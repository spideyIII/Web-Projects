      //
      // Answers persist as Dataverse ROWS: one U008 Valve Answer row per TOUCHED
      // valve and one U008 Defect Answer row per defect, under one U008 Inspection
      // header row per impact item. Untouched valves have NO rows - the Equipment
      // Guide bank remains the template and the initializer overlays saved rows.
      // Saves are DELTAS: a per-row signature is snapshotted at load into
