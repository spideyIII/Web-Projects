      // LOCKSTEP). Blank-safe: Coalesce guards every field.
      nfU008SavedValves = ForAll(
          colU008PendingValveRows As s,
          {
              RowKey: Coalesce(
                  s.RowKey,
                  ""
              ),
              'Valve Ident': Coalesce(
                  s.'Valve Ident',
                  ""
              ),
              Group: Coalesce(
                  s.Group,
                  ""
