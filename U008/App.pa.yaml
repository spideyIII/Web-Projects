App:
  Properties:
    Formulas: |-
      // ============================================================================
      // U008 HULL AND BACKUP VALVES - App.Formulas
      // Paste this ENTIRE block into the App object's Formulas property.
      // Requires: Settings > Updates > "User-defined functions" = ON (behavior UDFs).
      //
      // DATA SOURCE NAMES: this file references the five U008 tables as
      //     'U008 Equipment Guides'    (table: U008 Equipment Guide   - unchanged)
      //     'U008 DRF Requirements'    (table: U008 DRF Requirement   - unchanged)
      //     'U008 Inspections'         (table: U008 Inspection        - NEW header, 1 row/inspection)
      //     'U008 Valve Answers'       (table: U008 Valve Answer      - NEW, 1 row/touched valve)
      //     'U008 Defect Answers'      (table: U008 Defect Answer     - NEW, 1 row/defect)
      // PLACEHOLDER PLURALS - after adding the sources in Studio, read the names it
      // actually resolved and fix them here (U028's deployed plural differed from
      // every guess). The v3 refactor (2026-08-25) RETIRES the JSON snapshot: the
      // former 'U008 Inspection Results JSON' table is no longer read or written.
      // No PK display name of any answer table is referenced anywhere: saved rows
      // are carried as records, so their primary-key columns can be called anything.
      // The PRIMARY NAME column of each new table must be display-renamed:
      //   U008 Inspection    -> "ImpactItem_Ship_Availability"
      //   U008 Valve Answer  -> "RowKey"
      //   U008 Defect Answer -> "RowKey"
      //
      // APP.ONSTART: this file reads globals it cannot create itself
      // (App.Formulas may not Set anything). Paste the companion file
      // "U008AppOnStart.fx" into App.OnStart FIRST, then run App > Run OnStart,
      // or Studio reports "Name isn't valid" / "No type found for variable".
      // ============================================================================

      // ---------------------------------------------------------------------------
      // 1. CORE UTILITY FORMULAS (Guide Section 7 - standard across URO pages)
      // ---------------------------------------------------------------------------

      // Record resolution follows the established IMPACT screen pattern.
      // Studio preview uses the same DART-000307 fallback as the original U008.
      nfRecordItem = If(
          IsBlank(Param("recordId")),
          LookUp(
              'URO Impact Items',
              'Impact Item Number' = "DART-000307"
          ),
          LookUp(
              'URO Impact Items',
              'PK - URO Impact Item' = GUID(
                  Substitute(
                      Substitute(
                          Param("recordId"),
                          "{",
                          ""
                      ),
                      "}",
                      ""
                  )
              )
          )
      );
      nfUROMRC = nfRecordItem.'URO MRC';
      nfInWorkingStatus = nfRecordItem.'Owning Team Code' = "OWN-WORKING";
      // Editability is local UI state. Capture working status when the record is
      // loaded, rather than pulling a Dataverse named-record dependency into every
      // DisplayMode and collection-edit helper. Failed loads remain read-only.
      nfU008CanEdit = varU008RecordIsWorking && !varU008Attested && !varU008LoadFailed && !varSpinner;
      // Startup routing reads Dataverse directly because App.OnStart may not have loaded colEnvVars yet.
      nfFeatureShowMainScreen = LookUp(
          'Environment Variable Values',
          'Environment Variable Definition'.'Schema Name' = "impact_U008ImpactFeatureShowMainScreen"
      ).Value = "true";
      // Ship: prefers the on-screen dropdown selection, then falls back to the
      // impact item's own ship so the MOD is already resolved when the page opens.
      // Carried as TEXT (Coalesce compares scalars only; "" falls through).
      nfShipName = Coalesce(
          varSelectedShipName,
          nfRecordItem.Ship.'Ship Name'
      );
      nfShip = With(
          {shipNameText: nfShipName},
          LookUp('Common Navy Ships', 'Ship Name' = shipNameText)
      );
      // Development-only ship-change access via impact_TesterEmails
      // (semicolon-separated addresses; no email constants in source).
      nfTesterEmails = Lower(
          Coalesce(
              Text(
                  LookUp(
                      colEnvVars,
                      'Environment Variable Definition'.'Schema Name' = "impact_TesterEmails"
                  ).Value
              ),
              ""
          )
      );
      nfIsTester = CountRows(
          Filter(
              Split(
                  nfTesterEmails,
                  ";"
              ),
              Lower(Trim(Value)) = Lower(User().Email)
          )
      ) > 0;
      // Who may re-point the page at a different ship with drpU008ShipName.
      // Unlocks only for a direct Studio launch (no recordId) or a named tester.
      nfU008AllowShipChange = nfU008CanEdit && (IsBlank(Param("recordId")) || nfIsTester);
      // The header is captured with the successfully loaded record/ship.
      // Display only: retain stored date strings and N/A values.
      nfU008DateText(rawDate:Text):Text = If(
          IsBlank(rawDate), "",
          IfError(Text(DateValue(rawDate, "en-US"), "m/d/yy", "en-US"), rawDate)
      );

      nfHeader = Coalesce(varU008HeaderText, "");
      // U008 customization of the Guide's standard helper (doc Section 3.3).
      // SUBSTRING matching, not equality: the class column carries hull-series
      // text ("SSN774 CLASS"), and an exact-match Switch fails SILENTLY (rulebook).
      // Order matters: Seawolf first so "SSN21" never falls through.
      GetModNumber('Ship Class':Text):Number = Switch(
          true,
          "Seawolf" in 'Ship Class' || "SSN21" in 'Ship Class' || "SSN 21" in 'Ship Class',
          80,
          "Virginia" in 'Ship Class' || "774" in 'Ship Class',
          70,
          "Ohio" in 'Ship Class' || "SSBN" in 'Ship Class' || "SSGN" in 'Ship Class' || "726" in 'Ship Class',
          60,
          "Los Angeles" in 'Ship Class' || "688" in 'Ship Class',
          40,
          0
      );
      // Resolve MOD once per form/ship load from scalar ship inputs. Preserve the
      // existing classification rules; UI and local validators use the loaded number.
      ResolveU008ClassMod(shipClassText:Text,shipNameText:Text,shipNumberText:Text):Number = With(
          {modFromClass: GetModNumber(shipClassText)},
          If(
              modFromClass <> 0 || !IsBlank(shipClassText),
              modFromClass,
              With(
                  {
                      hullNo: Coalesce(
                          Value(shipNumberText),
                          0
                      )
                  },
                  Switch(
                      true,
                      shipNameText = "SSBN" || shipNameText = "SSGN",
                      60,
                      hullNo >= 774,
                      70,
                      hullNo >= 21 && hullNo <= 23,
                      80,// Seawolf: SSN 21, 22, 23

                      hullNo >= 688,
                      40,
                      0
                  )
              )
          )
      );
      nfModNumber = Coalesce(varU008ClassMod, 0);
      // The work-breakdown code label differs per MOD (verified against the DRF
      // headers of all four PDFs + real reports): SWAB (M40/M60), WBS (M70),
      // ESWBS (M80). The M60 EGL prints FGC but its DRF header prints SWAB.
      nfU008WbsLabel = Switch(
          nfModNumber,
          40,
          "SWAB",
          60,
          "SWAB",
          70,
          "WBS",
          80,
          "ESWBS",
          "WBS"
      );
      // System-prefix for the filter chips: "MSW-001/003" -> "MSW",
      // "APV-(5)-102" -> "APV", "Hawsepipe Upper Seal Assembly" -> "Hawsepipe".
      nfU008SysPrefix(valveIdent:Text):Text = With(
          {
              p: First(
                  Split(
                      Coalesce(
                          valveIdent,
                          ""
                      ),
                      "-"
                  )
              ).Value
          },
          If(
              "(" in p || " " in p,
              First(
                  Split(
                      p,
                      " "
                  )
              ).Value,
              p
          )
      );
      // M40's four AIDE valves (Air Induction / Diesel Exhaust: VH-2 hull insert +
      // VH-3/VH-5 backup bodies). They are evaluated per Attachment 1 minimum
      // repair thickness, always require DRF submittal, and the band suggestion
      // engine abstains on them (Section 9).
      nfU008IsAide(valveIdent:Text):Boolean = nfModNumber = 40 && valveIdent in [
          "VH-2",
          "VH-3",
          "VH-4",
          "VH-5"
      ];
      nfOptionSetSolution := {ShipClassChoices: {OhioSSGN: First(Choices('Ship Class Choices'.'Ohio Class SSGN')).Value}};
      // SSGN detection for the two SSGN-conditioned applicability families
      // ("SSGN Only", "SSGN after TZ-0918"). Decision 2026-08-26: the LEGACY exact
      // compare of the ship's class against the Ohio Class SSGN choice (the same
      // test the previous page's nfEGLItems used), OR the hull-number fallback -
      // hull numbers 726-729 are the four SSGN conversions; 730+ remain SSBN.
      nfU008IsSSGN = With(
          {
              hull: Coalesce(
                  Value(nfShip.'Ship Number'),
                  0
              )
          },
          nfShip.'Ship Class' = nfOptionSetSolution.ShipClassChoices.OhioSSGN || (hull >= 726 && hull <= 729)
      );
      // Compute signatures once in a shared named formula, rather than once per valve.
      nfU008DirtyRows = Filter(
          colU008Answers As r,
          nfU008RowSig(r) <> Coalesce(LookUp(colU008Shadow, Key = r.RowKey).Sig, "")
      );
      nfU008DeletedRows = Filter(
          colU008Shadow As s,
          IsBlank(LookUp(colU008Answers, RowKey = s.Key))
      );
      nfU008ValveDirty(valveKey:Text):Boolean =
          !IsEmpty(Filter(nfU008DirtyRows, RowKey = valveKey || GroupKey = valveKey))
          || !IsEmpty(Filter(nfU008DeletedRows, Key = valveKey || StartsWith(Key, valveKey & ".")));
      // The modal needs dirty state only for its active valve and child defects.
      // Keep the global shared projection for the worklist/save path.
      nfU008ValveDirtyLocal(valveKey:Text):Boolean = With(
          {
              valveRows: Filter(colU008Answers, RowKey = valveKey || GroupKey = valveKey),
              shadowRows: Filter(colU008Shadow, Key = valveKey || StartsWith(Key, valveKey & "."))
          },
          !IsEmpty(Filter(valveRows As r,
              nfU008RowSig(r) <> Coalesce(LookUp(colU008Shadow, Key = r.RowKey).Sig, "")))
          || !IsEmpty(Filter(shadowRows As s,
              IsBlank(LookUp(colU008Answers, RowKey = s.Key))))
      );
      nfU008AnyDirty():Boolean = !IsEmpty(nfU008DirtyRows) || !IsEmpty(nfU008DeletedRows);
      nfU008DirtyValveCount = CountRows(Filter(colU008Answers, 'Pair Order' = 0, nfU008ValveDirty(RowKey)));
      nfU008ShowRfiProgram = !IsEmpty(Filter(colU008Answers As v,
          v.'Pair Order' = 0, v.'In Worklist' = "Yes", !nfU008RfiApplies || v.'RFI Replaced' = "Yes"));
      nfU008ShowRfiDetail = !IsEmpty(Filter(colU008Answers As v,
          v.'Pair Order' = 0, v.'In Worklist' = "Yes",
          (!nfU008RfiApplies || v.'RFI Replaced' = "Yes")
              && v.'RFI Program' in ["AERP", "CCRP", "TRIPER", "Other"]));

      // Declarative local projections: no stored validation cache to go stale.
      // Only the active UI key/open flag are mirrored by modal entry/exit events.
      nfU008VisibleValves = SortByColumns(
          Filter(
              colU008Answers,
              'Pair Order' = 0,
              'In Worklist' = "Yes",
              varU008GroupFilter = "All"
                  || Group = varU008GroupFilter,
              IsBlank(varU008Search)
                  || varU008Search in 'Valve Ident'
                  || varU008Search in Location
                  || varU008Search in RowKey
          ),
          "RowKey",
          SortOrder.Ascending
      );
      nfU008VisibleValvePositions = ForAll(Sequence(CountRows(nfU008VisibleValves)) As n,
          {RowKey: Index(nfU008VisibleValves, n.Value).RowKey, NavIndex: n.Value});
      nfU008ActiveValve = If(varU008ModalMetricsActive && !IsBlank(varU008ActiveValveKey),
          LookUp(colU008Answers, RowKey = varU008ActiveValveKey), Blank());
      nfU008ActiveDefects = Filter(colU008Answers,
          varU008ModalMetricsActive && GroupKey = varU008ActiveValveKey && 'Pair Order' > 0);
      nfU008ActiveValidation = If(varU008ModalMetricsActive && !IsBlank(varU008ActiveValveKey),
          nfU008ValidationFor(nfU008ActiveValve, nfU008ActiveDefects),
          {ScreeningMissing: 0, PreMissing: 0, ReinstMissing: 0, SignatureMissing: 0,
           UnsignedMissing: 0, TotalMissing: 0, PreCanSign: false, ReinstCanSign: false, Complete: false});
      nfU008ActivePreSuggested = If(varU008ModalMetricsActive,
          nfU008SuggestedCatFor(nfU008ActiveValve, nfU008ActiveDefects, "Pre"), "");
      nfU008ActiveReinstSuggested = If(varU008ModalMetricsActive,
          nfU008SuggestedCatFor(nfU008ActiveValve, nfU008ActiveDefects, "Reinst"), "");
      nfU008ActiveCanEdit = varU008ModalMetricsActive && nfU008CanEdit
          && nfU008ActiveValve.'Applicability State' = "Applicable"
          && nfU008ActiveValve.'In Sample' = "Yes" && IsBlank(nfU008ActiveValve.'Validated Date');
      nfU008ActiveDefectNavigation = SortByColumns(nfU008ActiveDefects, "RowKey", SortOrder.Ascending);
      nfU008ActiveDefectPositions = ForAll(Sequence(CountRows(nfU008ActiveDefectNavigation)) As n,
          {RowKey: Index(nfU008ActiveDefectNavigation, n.Value).RowKey, NavIndex: n.Value});

      // Shared local text commit. UpdateIf avoids requiring a Dataverse-typed base
      // record for an in-memory edit; parameter names cannot shadow column names.
      // Compare actual local values before writing. Unchanged navigation must not
      // mutate colU008Answers or mark a clean inspection dirty.
      CommitU008ScreeningValues(valveKey:Text,newDoi:Text,newOther:Text,newSerial:Text,newDrfRemarks:Text):Boolean = {
          With({r: LookUp(colU008Answers, RowKey = valveKey)},
              With({changed: !IsBlank(r) && (
                  Coalesce(r.DOI, "") <> Coalesce(newDoi, "")
                  || Coalesce(r.'RFI Program Other', "") <> Coalesce(newOther, "")
                  || Coalesce(r.'RFI Pool Serial', "") <> Coalesce(newSerial, "")
                  || Coalesce(r.'DRF Remarks', "") <> Coalesce(newDrfRemarks, ""))},
                  If(changed,
                      UpdateIf(colU008Answers, RowKey = valveKey, {
                          DOI: newDoi, 'RFI Program Other': newOther,
                          'RFI Pool Serial': newSerial, 'DRF Remarks': newDrfRemarks
                      });
                      Set(varU008Dirty, true));
                  changed
              )
          )
      };
      CommitU008Screening(valveKey:Text,newDoi:Text,newOther:Text,newSerial:Text,newDrfRemarks:Text):Void = {
          If(nfU008ValveCanEdit(valveKey),
              CommitU008ScreeningValues(valveKey, newDoi, newOther, newSerial, newDrfRemarks))
      };

      // This helper preserves each caller's existing field ownership. Some legacy
      // paths do not commit Located On; writeLocatedOn keeps that behavior explicit.
      // CRES/remarks self-assignments are omitted because they do not change values.
      CommitU008DefectValues(defectKey:Text,cond:Text,newLocation:Text,newLocatedOn:Text,writeLocatedOn:Boolean,newB:Text,newC:Text,newPct:Text,newCat:Text,newMethod:Text):Boolean = {
          With({r: LookUp(colU008Answers, RowKey = defectKey)},
              With({changed: !IsBlank(r) && (
                  Coalesce(r.'Defect Location', "") <> Coalesce(newLocation, "")
                  || (writeLocatedOn && Coalesce(r.'Located On', "") <> Coalesce(newLocatedOn, ""))
                  || If(cond = "Pre",
                      Coalesce(r.'Pre B', "") <> Coalesce(newB, "")
                      || Coalesce(r.'Pre C', "") <> Coalesce(newC, "")
                      || Coalesce(r.'Pre Pct', "") <> Coalesce(newPct, "")
                      || Coalesce(r.'Pre Cat', "") <> Coalesce(newCat, "")
                      || Coalesce(r.'Pre Method', "") <> Coalesce(newMethod, ""),
                      Coalesce(r.'Reinst B', "") <> Coalesce(newB, "")
                      || Coalesce(r.'Reinst C', "") <> Coalesce(newC, "")
                      || Coalesce(r.'Reinst Pct', "") <> Coalesce(newPct, "")
                      || Coalesce(r.'Reinst Cat', "") <> Coalesce(newCat, "")
                      || Coalesce(r.'Reinst Repair Method', "") <> Coalesce(newMethod, "")))},
                  If(changed,
                      If(cond = "Pre",
                          If(writeLocatedOn,
                              UpdateIf(colU008Answers, RowKey = defectKey, {
                                  'Defect Location': newLocation, 'Located On': newLocatedOn,
                                  'Pre B': newB, 'Pre C': newC, 'Pre Pct': newPct,
                                  'Pre Cat': newCat, 'Pre Method': newMethod
                              }),
                              UpdateIf(colU008Answers, RowKey = defectKey, {
                                  'Defect Location': newLocation,
                                  'Pre B': newB, 'Pre C': newC, 'Pre Pct': newPct,
                                  'Pre Cat': newCat, 'Pre Method': newMethod
                              })),
                          If(writeLocatedOn,
                              UpdateIf(colU008Answers, RowKey = defectKey, {
                                  'Defect Location': newLocation, 'Located On': newLocatedOn,
                                  'Reinst B': newB, 'Reinst C': newC, 'Reinst Pct': newPct,
                                  'Reinst Cat': newCat, 'Reinst Repair Method': newMethod
                              }),
                              UpdateIf(colU008Answers, RowKey = defectKey, {
                                  'Defect Location': newLocation,
                                  'Reinst B': newB, 'Reinst C': newC, 'Reinst Pct': newPct,
                                  'Reinst Cat': newCat, 'Reinst Repair Method': newMethod
                              })));
                      Set(varU008Dirty, true));
                  changed
              )
          )
      };

      // ---------------------------------------------------------------------------
      // 1.5 APPLICABILITY RESOLUTION ENGINE (doc Section 3.4 - verified against
      // the EGL footnotes of all four MODs; the bank carries 15 distinct strings)
      //
      // Returns "Applicable" / "Not Applicable" - NEVER "Pending" any more.
      // CUSTOMER RULE (2026-08-26): the inspector makes NO applicability
      // decisions. Every EGL string resolves from the ship record alone, exactly
      // as the legacy page's nfEGLItems filter did:
      //   * "AFS" = "and following ships": "SSN784 AFS only" means hull 784 and
      //     every later hull (785, 786, ...). The legacy code tested >= 784.
      //   * "After ShipAlt 4620K" applies to every hull of the class (legacy).
      //   * "SSGN Only" / "SSGN after TZ-0918" apply to SSGN hulls (nfU008IsSSGN).
      //   * "<symbol><hull> only" (SSN23 Only, and the "SSN784 only" strings the
      //     Add-valve feature writes) applies to that one hull.
      //   * Improvement over the legacy code: "SSN774-SSN791 or SSN792 AFS" used
      //     "= 792", which would exclude 793+; with AFS = and-following it is
      //     every hull from 774 up.
      // The scenario-decision machinery (Section 1.5 below, the Decisions button,
      // the modal Resolve button) is left in place but is DORMANT - nothing can
      // evaluate to Pending, so it never opens.
      // Unknown pattern: fail OPEN ("Applicable") so a new EGL string is never
      // silently hidden from the picker.
      // ---------------------------------------------------------------------------
      nfU008InitialApplicability(applicability:Text):Text = With(
          {
              app: Lower(
                  Trim(
                      Coalesce(
                          applicability,
                          ""
                      )
                  )
              ),
              hull: Coalesce(
                  Value(nfShip.'Ship Number'),
                  0
              )
          },
          Switch(
              true,
              // class-wide rows: the MOD filter already guaranteed the class

              IsBlank(app) || StartsWith(
                  app,
                  "all "
              ),
              "Applicable",
              app = "ssgn only" || "tz-0918" in app,// "SSGN Only", "SSGN after TZ-0918"

              If(
                  nfU008IsSSGN,
                  "Applicable",
                  "Not Applicable"
              ),
              // one named hull: "SSN23 Only", "SSN784 only", "SSGN726 only" ...

              IsMatch(
                  app,
                  "ss[bg]?n ?\d+ only"
              ),
              If(
                  Value(
                      Match(
                          app,
                          "\d+"
                      ).FullMatch
                  ) = hull,
                  "Applicable",
                  "Not Applicable"
              ),
              "except ssn775" in app,// "SSN774-SSN784, except SSN775" (DFS SSN-775-1045-2023)

              If(
                  hull >= 774 && hull <= 784 && hull <> 775,
                  "Applicable",
                  "Not Applicable"
              ),
              app = "ssn774-ssn783",
              If(
                  hull >= 774 && hull <= 783,
                  "Applicable",
                  "Not Applicable"
              ),
              app = "ssn774-ssn784",
              If(
                  hull >= 774 && hull <= 784,
                  "Applicable",
                  "Not Applicable"
              ),
              // "SSN784 AFS only" / "SSN785 AFS only": that hull and following

              IsMatch(
                  app,
                  "ss[bg]?n ?\d+ afs only"
              ),
              If(
                  hull >= Value(
                      Match(
                          app,
                          "\d+"
                      ).FullMatch
                  ),
                  "Applicable",
                  "Not Applicable"
              ),
              app = "ssn774-ssn791 or ssn792 afs",// 774-791 plus 792-and-following = every hull from 774

              If(
                  hull >= 774,
                  "Applicable",
                  "Not Applicable"
              ),
              "or ssn788" in app,// "SSN774-SSN784, or SSN785 AFS, or SSN788, or SSN775" = every hull from 774

              If(
                  hull >= 774,
                  "Applicable",
                  "Not Applicable"
              ),
              "shipalt 4620k" in app,// legacy: applies to the whole class

              "Applicable",
              // unknown pattern: fail open, never silently exclude a valve

              "Applicable"
          )
      );
      // Plain-English question for the scenario modal, per condition family.
      nfU008ScenarioPrompt(applicability:Text):Text = With(
          {
              app: Lower(
                  Coalesce(
                      applicability,
                      ""
                  )
              )
          },
          Switch(
              true,
              "afs" in app,
              $"Does the AFS configuration marked '{applicability}' apply to USS {nfShip.'Ship Name'} (SSN {nfShip.'Ship Number'}) for this availability?",
              "shipalt 4620k" in app,
              $"Has ShipAlt 4620K been accomplished on USS {nfShip.'Ship Name'}?",
              "tz-0918" in app,
              $"Has TZ-0918 been accomplished on USS {nfShip.'Ship Name'}? (SDA-178 is a Hull valve after TZ-0918 and a Backup valve before it - see the valve's EGL remark.)",
              $"Does the EGL condition '{applicability}' apply to USS {nfShip.'Ship Name'}?"
          )
      );
      // Open the applicability scenario modal for one applicability string (one
      // decision covers EVERY valve of the loaded MOD that carries the string).
      OpenU008ScenarioReview(applicabilityText:Text):Void = 
      {
      	Set(
              varU008ScenarioText,
              applicabilityText
          );
          Set(
              varU008ScenarioPrompt,
              nfU008ScenarioPrompt(applicabilityText)
          );
          Set(
              varU008ScenarioOpen,
              !IsBlank(applicabilityText)
          )
      };
      // Walk-the-next-pending entry point for the context-bar Decisions button.
      // Worklist-scoped (v3): only valves the inspector selected prompt decisions;
      // the decision itself still applies to EVERY valve sharing the EGL string.
      OpenU008NextScenario():Void = 
      {
      	With(
              {
                  nextRow: First(
                      SortByColumns(
                          Filter(
                              colU008Answers,
                              'Pair Order' = 0,
                              'In Worklist' = "Yes",
                              'Applicability State' = "Pending"
                          ),
                          "RowKey",
                          SortOrder.Ascending
                      )
                  )
              },
              If(
                  IsBlank(nextRow.RowKey),
                  nfSendToast(
                      "No pending decisions",
                      "No applicability decisions are pending.",
                      3000,
                      "Info"
                  ),
                  OpenU008ScenarioReview(nextRow.Applicability)
              )
          )
      };
      // Apply one scenario decision to every valve of the loaded MOD that carries
      // the same applicability string AND is decidable on this hull (rows the hull
      // range already excluded stay Not Applicable). A decision is CHANGEABLE at
      // any time before attestation (2026-08-25): the modal bar keeps a
      // Change-decision button on decided scenario valves. Only rows whose state
      // actually FLIPS are updated - re-choosing the same answer is a no-op, so
      // an accidental re-click can never clear signatures. On flipping rows the
      // signatures and the per-valve Validated stamp ARE cleared, because the
      // attested row set changes.
      ApplyU008ScenarioDecision(isApplicable:Boolean):Void = 
      {
      	With(
              {
                  newState: If(
                      isApplicable,
                      "Applicable",
                      "Not Applicable"
                  )
              },
              With(
                  {
                      flipping: CountRows(
                          Filter(
                              colU008Answers,
                              'Pair Order' = 0 && Applicability = varU008ScenarioText && nfU008InitialApplicability(Applicability) = "Pending" && 'Applicability State' <> newState
                          )
                      )
                  },
                  UpdateIf(
                      colU008Answers,
                      'Pair Order' = 0 && Applicability = varU008ScenarioText && nfU008InitialApplicability(Applicability) = "Pending" && 'Applicability State' <> newState,
                      {
                          'Applicability State': newState,
                          'Applicability Reason': If(
                              isApplicable,
                              "Inspector confirmed the EGL condition applies to this hull/availability.",
                              "Inspector confirmed the EGL condition does not apply to this hull/availability."
                          ),
                          'Pre Inspector Name': "",
                          'Pre Shop': "",
                          'Pre Badge Number': "",
                          'Pre Signature': "",
                          'Pre Signature Date': "",
                          'Reinst Inspector Name': "",
                          'Reinst Shop': "",
                          'Reinst Badge Number': "",
                          'Reinst Signature': "",
                          'Reinst Signature Date': "",
                          'Validated Date': ""
                      }
                  );
                  If(
                      flipping > 0,
                      Set(
                          varU008Dirty,
                          true
                      );
                      nfSendToast(
                          "Decision applied",
                          $"{flipping} valve(s) carrying this EGL condition changed state. Any signatures and Validate stamps on the changed valves were cleared; affected DRFs must be re-signed.",
                          5000,
                          "Info"
                      ),
                      nfSendToast(
                          "No change",
                          "Every valve carrying this EGL condition already has that decision.",
                          4000,
                          "Info"
                      )
                  )
              )
          );
          Set(
              varU008ScenarioOpen,
              false
          )
      };
      // TRUE when this valve's applicability is an inspector SCENARIO decision on
      // this hull (the EGL string initially evaluates to Pending: AFS configs,
      // ShipAlt 4620K, TZ-0918). Such decisions stay CHANGEABLE after being made -
      // the modal applicability bar keeps a Change-decision button for them.
      nfU008IsScenarioDecision(valveKey:Text):Boolean = With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          !IsBlank(v.RowKey) && nfU008InitialApplicability(v.Applicability) = "Pending"
      );
      // Copy the Pre-Repair values into the Reinstalled condition for every defect
      // row of one valve whose Reinstalled side is COMPLETELY untouched (B, C, %
      // and Category all blank). Called when the Reinstalled tab is opened
      // (decision 2026-08-25): the paper form re-lists the same defects, so the
      // inspector starts from the pre-repair numbers and edits what changed.
      // Never overwrites a Reinstalled side that has ANY data. Method of Repair is
      // NOT copied - it has no Pre-Repair counterpart (Method of Inspection does).
      CopyU008PreToReinst(valveKey:Text):Void = {
          With({copyRows: Filter(colU008Answers,
              GroupKey = valveKey && 'Pair Order' > 0
              && !nfAnswerProvided('Reinst B') && !nfAnswerProvided('Reinst C')
              && !nfAnswerProvided('Reinst Pct') && IsBlank('Reinst Cat')
              && (Coalesce('Reinst B', "") <> Coalesce('Pre B', "")
                  || Coalesce('Reinst C', "") <> Coalesce('Pre C', "")
                  || Coalesce('Reinst Pct', "") <> Coalesce('Pre Pct', "")
                  || Coalesce('Reinst Cat', "") <> Coalesce('Pre Cat', "")))},
              If(!IsEmpty(copyRows),
                  UpdateIf(colU008Answers, RowKey in copyRows.RowKey, {
                      'Reinst B': 'Pre B', 'Reinst C': 'Pre C',
                      'Reinst Pct': 'Pre Pct', 'Reinst Cat': 'Pre Cat'
                  });
                  Set(varU008Dirty, true))
          )
      };
      // Editing gates. A valve's fields are editable only when the whole form is
      // editable, the valve is Applicable, it is in the inspection sample, and it
      // has not been validated. Signed DRF conditions additionally lock their own
      // field set (Section 3.5).
      nfU008ValveCanEdit(valveKey:Text):Boolean = With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          nfU008CanEdit && v.'Applicability State' = "Applicable" && v.'In Sample' = "Yes" && IsBlank(v.'Validated Date')
      );
      nfAnswerProvided(value:Text):Boolean = !IsBlank(
          Trim(
              Coalesce(
                  value,
                  ""
              )
          )
      );
      // Signature resolver (Guide Section 7, formula 5) - adapted, same as U028.
      nfIDPart1 = With(
          {
              normalized: Upper(
                  Substitute(
                      Substitute(
                          varU008SignerDisplayName,
                          ", ",
                          "."
                      ),
                      " ",
                      "."
                  )
              ),
              suffix: If(
                  IsBlank(varID),
                  "",
                  "." & varID
              )
          },
          If(
              !IsBlank(
                  Find(
                      "CIV",
                      normalized
                  )
              ),
              First(
                  Split(
                      normalized,
                      "CIV"
                  )
              ).Value & suffix,
              First(
                  Split(
                      normalized,
                      "CTR"
                  )
              ).Value & suffix
          )
      );
      // The name portion of nfIDPart1 (signature without the badge suffix).
      nfU008SignName = If(
          IsBlank(varID),
          nfIDPart1,
          Left(
              nfIDPart1,
              Len(nfIDPart1) - Len(varID) - 1
          )
      );
      // The valve bank rows this form loads, projected from the cached collection.
      // THE ForAll RECORD-LITERAL PROJECTION IS REQUIRED (typed-UDF rule): it
      // strips Dataverse logical-name baggage so the shape matches
      // U008SourceRecordType. Keep this list and that type in lockstep.
      // THE With() WRAPPER IS REQUIRED (blank-column rule): the filter value must
      // be folded to a constant BEFORE the query, or the degraded fetch returns
      // rows with blank data columns.
      // U008 DIFFERENCE FROM U028: the bank stores UROMOD as BARE DIGITS ("40"),
      // so the filter is Text(nfModNumber) with NO "M" prefix. The key column
      // (MOD_OrderNumber, "M40 001") is display text - never filter on it.
      // Sorting happens AFTER projection so no logical column name is needed.
      // Staged bank projection, consumed only after all load queries succeed.
      nfU008Source = With(
          {modText: Text(nfModNumber)},
          SortByColumns(
              ForAll(
                  Filter(
                      colU008PendingBank,
                      UROMOD = modText
                  ) As v,
                  {
                      MOD_OrderNumber: v.MOD_OrderNumber,
                      'Valve Ident': v.'Valve Ident',
                      Group: v.Group,
                      Type: v.Type,
                      Size: v.Size,
                      'WBS/ESWBS/FGC/SWAB': v.'WBS/ESWBS/FGC/SWAB',
                      'GC/MRN': v.'GC/MRN',
                      Location: v.Location,
                      Periodicity: v.Periodicity,
                      Applicability: v.Applicability,
                      'DSS-SOC': v.'DSS-SOC',
                      Remarks: v.Remarks
                  }
              ),
              "MOD_OrderNumber",
              SortOrder.Ascending
          )
      );
      // The 32 question-bank rows, projected for the serializer and the
      // data-driven field labels (Daniel's decision: definitions live in the
      // U008 DRF Requirement table, loaded whole - they are MOD-independent).
      nfU008Questions = SortByColumns(
          ForAll(
              colU008Questions As q,
              {
                  RequirementOrderNumber: q.RequirementOrderNumber,
                  'Item Description': q.'Item Description',
                  Requirement: q.Requirement,
                  ResponseType: q.ResponseType,
                  'Choices / Format': q.'Choices / Format',
                  'Conditional On': q.'Conditional On',
                  'JSON Field': q.'JSON Field',
                  'UI Requirements': q.'UI Requirements'
              }
          ),
          "RequirementOrderNumber",
          SortOrder.Ascending
      );
      // Field label from the question bank with a hardcoded fallback, so the
      // deployed bank drives the modal text without being a single point of
      // failure while the table is still empty.
      nfU008QLabel(jsonField:Text,fallback:Text):Text = Coalesce(
          LookUp(
              nfU008Questions,
              'JSON Field' = jsonField
          ).Requirement,
          fallback
      );
      // U008 General Notes (Guide standard nfNotesTable; URO MRC 008 General Notes).
      nfNotesTable = Table(
          {
              ID: "1",
              NoteText: "The requirements within this URO MRC shall not be changed unless specifically approved by NAVSEA (05U7)."
          },
          {
              ID: "2",
              NoteText: "Any component found in Category B or C condition that is to remain in service requires a Major Departure from Specification submitted to NAVSEA for approval (General Note 9)."
          },
          {
              ID: "3",
              NoteText: "Mechanical defects (accidental damage, manufacturing defects) do not need to be recorded on the Data Report Form but shall not violate Maintenance Standards acceptance criteria (Procedure Note 1)."
          },
          {
              ID: "4",
              NoteText: "A Ready For Issue (RFI) asset is an asset that can be requisitioned by a project - new, AERP, and CCRP assets included (General Note 10)."
          },
          {
              ID: "5",
              NoteText: "A SUBMEPP Product Feedback Form is provided at the end of this URO MRC."
          }
      );
      nfGeneralNotesText = Concat(
          nfNotesTable,
          ID & ". " & NoteText,
          Char(10) & Char(10)
      );
      // ---------------------------------------------------------------------------
      // 2. NOTIFICATION SCHEMA (Guide Section 7 - tpToast & nfSendToast, verbatim)
      // ---------------------------------------------------------------------------
      tpToast := Type({
          Header: Text,
          Body: Text,
          Duration: Number,
          Severity: Text,
          ShowDismiss: Boolean,
          ShowTime: Boolean,
          ShowProgress: Boolean,
          CurrentTime: DateTime,
          RemoveTime: DateTime,
