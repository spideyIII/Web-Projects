      // Opens the shared viewer for one valve: every sketch of the loaded MOD in
      // the filmstrip, with the suggested sketch pre-selected when the heuristic
      // has one. Exact-key selection only - sketch numbers reach 20, so the U028
      // digit-substring trick would misfire ("1" in "16").
      OpenU008SketchViewer(valveKey:Text):Void = 
      {
      	ClearCollect(
              colU008Viewer,
              ShowColumns(
                  Filter(
                      nfU008MediaTable,
                      Mod = nfModNumber
                  ),
                  Key,
                  Label
              )
          );
          With(
              {s: nfU008SuggestedSketch(valveKey)},
              Set(
                  varU008ViewerKey,
                  If(
                      s <> "" && !IsBlank(
                          LookUp(
                              colU008Viewer,
                              Key = s
                          )
                      ),
                      s,
                      First(colU008Viewer).Key
                  )
              )
          );
          Set(
              varU008ViewerOpen,
              !IsEmpty(colU008Viewer)
          );
          If(
              IsEmpty(colU008Viewer),
              nfSendToast(
                  "No sketches loaded",
                  "No sketches are loaded for this MOD - upload the media files and check nfU008MediaTable.",
                  4000,
                  "Info"
              )
          )
      };
      // ---------------------------------------------------------------------------
      // 8.5 SUGGESTED SKETCH (best-guess mapping, judgment-based)
      //
      // The EGL has no figure column and the sketches are drawn per valve TYPE,
      // so this heuristic maps system prefix / size / location to the most likely
      // sketch and ABSTAINS ("") when no rule fits. The viewer always shows every
      // sketch of the MOD; this only pre-selects a chip. The reviewable mapping
      // table ships in resources/U008 Sketch Mapping.md - correct rules here.
      // ---------------------------------------------------------------------------

      // Numeric size from the bank's text sizes ("1.5", "16/14" -> 16, "N/A" -> blank).
      nfU008SizeNum(size:Text):Number = With(
          {
              s: First(
                  Split(
                      Coalesce(
                          size,
                          ""
                      ),
                      "/"
                  )
              ).Value
          },
          IfError(
              Value(s),
              Blank()
          )
      );
      nfU008SuggestedSketch(valveKey:Text):Text = With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          With(
              {
                  pfx: nfU008SysPrefix(v.'Valve Ident'),
                  sz: Coalesce(
                      nfU008SizeNum(v.Size),
                      0
                  ),
                  loc: Lower(
                      Coalesce(
                          v.Location,
                          ""
                      )
                  ),
                  ident: Lower(
                      Coalesce(
                          v.'Valve Ident',
                          ""
                      )
                  )
              },
              Switch(
                  nfModNumber,
                  40,
                  Switch(
                      true,
                      pfx = "VH",
                      "F16M40",// AIDE assembly

                      pfx = "DE",
                      "F14M40",// diesel exhaust drain

                      pfx = "MFD",
                      "F15M40",// missile flood & drain

                      pfx = "AHP",
                      "F9M40",// MBT hull stop

                      pfx = "MSW" && sz >= 14,
                      "F1M40",// 16/14 MSW combination

                      pfx = "ABT" && sz = 5,
                      "F4M40",// 5-inch end-loaded

                      "esc" in loc,
                      "F12M40",// escape trunk flood & drain

                      sz >= 3,
                      "F2M40",
                      sz > 0,
                      "F3M40",
                      ""
                  ),
                  60,
                  Switch(
                      true,
                      pfx = "MSW" && sz >= 14,
                      "F8M60",
                      pfx = "ASW" && sz >= 8,
                      "F9M60",
                      pfx = "MCW" || pfx = "HOV",
                      "F12M60",
                      pfx = "DE",
                      "F10M60",
                      pfx = "VH" || pfx = "AI",
                      "F11M60",
                      pfx = "EMBT",
                      "F2M60",
                      "esc" in loc,
                      "F7M60",
                      sz >= 3,
                      "F6M60",
                      sz > 0,
                      "F4M60",
                      ""
                  ),
                  70,
                  Switch(
                      true,
                      pfx = "MSW",
                      "F17M70",
                      pfx = "ASW",
                      "F16M70",
                      pfx = "HDC",
                      "F15M70",
                      pfx = "VH" || pfx = "DE",
                      "F7M70",// AIDE (7A/7B are the PT add-ons)

                      pfx = "EMBT",
                      "F8M70",
                      pfx = "PL",
                      "F11M70",// payload tube hull/backup

                      pfx = "LET" || pfx = "LOT" || pfx = "LPT",
                      "F10M70",
                      sz >= 3,
                      "F1M70",
                      sz > 0,
                      "F2M70",
                      ""
                  ),
                  80,
                  Switch(
                      true,
                      "hawsepipe" in ident && "seal" in ident,
                      "F14M80",
                      "hawsepipe" in ident,
                      "F15M80",
                      (pfx = "MSW" || pfx = "ASW") && sz >= 8,
                      "F16M80",
                      (pfx = "MSW" || pfx = "ASW") && sz <= 2,
                      "F17M80",// constant vent 1-1/2

                      pfx = "DC",
                      "F18M80",
                      pfx = "EMBT",
                      "F19M80",
                      pfx = "IAL" && sz >= 6,
                      "F11M80",
                      pfx = "IAL",
                      "F20M80",
                      pfx = "LET",
                      "F10M80",
                      pfx = "VH" || pfx = "DE",
                      "F8M80",// AIDE

                      pfx = "ABT" && sz = 5,
                      "F3M80",// 5-in end-loaded

                      sz >= 3,
                      "F1M80",
                      sz > 0,
                      "F2M80",
                      ""
                  ),
                  ""
              )
          )
      );
      // ---------------------------------------------------------------------------
      // 9. AUTO-CATEGORY SUGGESTION (universal % bands) - U008 rebuild
      //
      // U008's acceptance criteria are far simpler than U028's: ONE band table,
      // identical in all four MODs (verified in Phase 1 against every PDF):
      //   A: wall reduction <= 10%   B: > 10 and <= 15%
      //   C: > 15 and <= 20%         D: > 20%              (Procedure Step 5.A)
      // The suggestion is shown with an "Apply" button and NEVER writes on its
      // own. Honesty rules (abstain = return ""):
      //   - CRES-liner valves: liner defects are judged SAT/UNSAT by depth
      //     (.120" welded liners / .038" M40 TD-13..16 / 1/8" AHP MBT stops) -
      //     a human call, not a % band. The engine abstains for the whole valve.
      //   - AIDE valves (M40 VH-2/3/4/5): Attachment 1 minimum-thickness table,
      //     not % bands. Abstain.
      //   - Any defect row whose % cannot be resolved (no manual % and B or C
      //     unparseable) makes the whole condition abstain - a partial worst-case
      //     would understate the category.
      // The readiness gate lives INSIDE the shared formula (rulebook): everything
      // keyed off it inherits the gating with no screen changes.
      // ---------------------------------------------------------------------------

      // Measurement text -> number. Preserve the approved None/N/A -> zero rule.
      // Only leading comparison markers and trailing units are removed; malformed
      // embedded symbols, multiple slashes, and comma decimals stay invalid.
      // Inputs and generated numeric text consistently use a decimal point.
      nfU008ParseMeasure(raw:Text):Number = With(
          {s0: Lower(Trim(Coalesce(raw, "")))},
          With(
              {s1: If(EndsWith(s0, "(u)"), Trim(Left(s0, Len(s0) - 3)), s0)},
              If(s1 = "n/a" || s1 = "na" || s1 = "none", 0,
                  s1 = "", Blank(),
                  With(
                      {s2: Trim(If(StartsWith(s1, "<=") || StartsWith(s1, ">="), Mid(s1, 3),
                          StartsWith(s1, "<") || StartsWith(s1, ">") || StartsWith(s1, "≤") || StartsWith(s1, "≥"), Mid(s1, 2), s1))},
                      With(
                          {s: Trim(If(EndsWith(s2, "inches"), Left(s2, Len(s2) - 6),
                              EndsWith(s2, "in"), Left(s2, Len(s2) - 2),
                              EndsWith(s2, "%") || EndsWith(s2, Char(34)) || EndsWith(s2, "”") || EndsWith(s2, "“") || EndsWith(s2, "″"), Left(s2, Len(s2) - 1), s2))},
                          If(
                              IsMatch(s, "[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+) *[/] *([0-9]+([.][0-9]*)?|[.][0-9]+)"),
                              IfError(Value(Trim(First(Split(s, "/")).Value), "en-US") / Value(Trim(Last(Split(s, "/")).Value), "en-US"), Blank()),
                              IsMatch(s, "[+-]?([0-9]+([.][0-9]*)?|[.][0-9]+)"),
                              IfError(Value(s, "en-US"), Blank()),
                              Blank()
                          )
                      )
                  )
              )
          )
      );
      // The effective % of wall reduction for one defect condition: the manual
      // override when it parses, else B / C x 100, else blank.
      nfU008DefectPct(b:Text,c:Text,manual:Text):Number = With(
          {m: nfU008ParseMeasure(manual)},
          If(
              !IsBlank(m),
              m,
              With(
                  {
                      bn: nfU008ParseMeasure(b),
                      cn: nfU008ParseMeasure(c)
                  },
                  If(
                      IsBlank(bn) || IsBlank(cn) || cn <= 0,
                      Blank(),
                      bn / cn * 100
                  )
              )
          )
      );
      // Display text for the computed % ("" when not computable) - shown in the
      // defect row's % field whenever the inspector has not typed an override.
      nfU008PctText(b:Text,c:Text):Text = With(
          {
              p: With(
                  {
                      bn: nfU008ParseMeasure(b),
                      cn: nfU008ParseMeasure(c)
                  },
                  If(
                      IsBlank(bn) || IsBlank(cn) || cn <= 0,
                      Blank(),
                      bn / cn * 100
                  )
              )
          },
          If(
              IsBlank(p),
              "",
              Text(Round(p, 2), "0.00", "en-US") & "%"
          )
      );
      // The defect editor's % box SHOWS the computed B/C x 100 text as its value
      // (2026-08-26 - the old placeholder hint was invisible). When the box still
      // holds exactly that computed text the inspector typed no override, so the
      // row stores BLANK (= auto-computed, full precision at save/validation);
      // anything else in the box is a manual override and is stored as typed.
      nfU008PctOverride(b:Text,c:Text,pctBox:Text):Text = With(
          {
              typed: Trim(
                  Coalesce(
                      pctBox,
                      ""
                  )
              )
          },
          If(
              typed = nfU008PctText(
                  b,
                  c
              ),
              "",
              typed
          )
      );
      // The ONE universal band table (Procedure Step 5.A - all four MODs).
      nfU008BandCat(pct:Number):Text = If(
          IsBlank(pct),
          "",
          pct <= 10,
          "A",
          pct <= 15,
          "B",
          pct <= 20,
          "C",
          "D"
      );
      // TRUE only when every defect row of the condition resolves to a %.
      nfU008SuggestReady(valveKey:Text,cond:Text):Boolean = With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              ),
              defects: Filter(
                  colU008Answers,
                  GroupKey = valveKey,
                  'Pair Order' > 0
              )
          },
          v.'DRF Required' = "Yes" && CountRows(defects) > 0 && If(
              cond = "Reinst",
              nfU008ReinstRequired(valveKey),
              true
          ) && CountRows(
              Filter(
                  defects As d,
                  IsBlank(
                      If(
                          cond = "Pre",
                          nfU008DefectPct(
                              d.'Pre B',
                              d.'Pre C',
                              d.'Pre Pct'
                          ),
                          nfU008DefectPct(
                              d.'Reinst B',
                              d.'Reinst C',
                              d.'Reinst Pct'
                          )
                      )
                  )
              )
          ) = 0
      );
      // The suggested category for one valve and one condition ("Pre" feeds the
      // As Found suggestion, "Reinst" feeds the Final suggestion). "" = abstain.
      // Bands are monotonic, so the worst defect's % decides.
      nfU008SuggestedCatFor(v:U008AnswerRecordType,defects:U008AnswersTableType,cond:Text):Text =
      If(IsBlank(v.RowKey) || v.'CRES Liner' = "Yes" || nfU008IsAide(v.'Valve Ident')
          || v.'DRF Required' <> "Yes" || IsEmpty(defects)
          || (cond = "Reinst" && (v.'RFI Replaced' = "Yes" || v.'Shipped To DOP' = "Yes")),
          "",
          With({percentages: ForAll(defects As d,
              {Pct: If(cond = "Pre", nfU008DefectPct(d.'Pre B', d.'Pre C', d.'Pre Pct'),
                  nfU008DefectPct(d.'Reinst B', d.'Reinst C', d.'Reinst Pct'))})},
              If(CountRows(Filter(percentages, IsBlank(Pct))) > 0, "",
                  nfU008BandCat(Max(percentages, Pct)))));
      nfU008SuggestedCat(valveKey:Text,cond:Text):Text =
      With({v: LookUp(colU008Answers, RowKey = valveKey),
            defects: Filter(colU008Answers, GroupKey = valveKey, 'Pair Order' > 0)},
          nfU008SuggestedCatFor(v, defects, cond));
      // Guidance text for the modal info box, switched by the valve's evaluation
      // path (bands / CRES liner / AIDE).
      nfU008CriteriaText(valveKey:Text):Text = With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          Switch(
              true,
              nfU008IsAide(v.'Valve Ident'),
              "AIDE valve: evaluate UT areas A-J against the Attachment 1 Table 1 minimum repair thickness (M40). A DRF is submitted regardless of condition; Data Sheets 1 and 2 accompany the report when UT is conducted. Areas outside A-J use the Category A band.",
              v.'CRES Liner' = "Yes",
              "CRES liner/cladding: defects are judged SAT or UNSAT by depth, not by % bands - .120"" for liners integrally welded to the hull (MSW/ASW/HDC/DE/VH families), .038"" for M40 TD-13/14/15/16 (dwg 2285-298), 1/8"" for AHP MBT hull-stop liners. Satisfactory liner defects put the valve in Category A. Liner valves with defects ALWAYS require DRF submittal, even when SAT (Reporting Note 2).",
              "Category of acceptance from % of wall thickness reduction (B / C x 100), identical for all MODs: A = 10% or less; B = over 10 to 15% (reinspect within 48 months + Major DFS); C = over 15 to 20% (repair/replace within 24 months + Major DFS); D = over 20% (repair/replace before further operation). Visible cracks are not acceptable and are repaired; record crack lengths in Remarks."
          )
      );
