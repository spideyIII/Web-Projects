    OnStart: |-
      // ============================================================================
      // U008 HULL AND BACKUP VALVES - App.OnStart
      // Paste this ENTIRE block into the App object's OnStart property, then run
      // App > Run OnStart once or reload the app so the variables and collection
      // shapes exist before App.Formulas evaluates.
      // ============================================================================

      // ---------------------------------------------------------------------------
      // CORE GLOBALS
      // ---------------------------------------------------------------------------

      // Ship selected in drpU008ShipName. Blank falls back to the impact item's ship.
      Set(
          varSelectedShipName,
          ""
      );

      Set(
          varU008RecordKey,
          ""
      );

      // Debug/header refresh marker.
      Set(
          visibleTrigger,
          Now()
      );

      // Inspection header and attestation state.
      Set(
          varU008Attested,
          false
      );

      Set(
          varU008AttestationDate,
          ""
      );

      Set(
          varU008AttestedBy,
          ""
      );

      Set(
          varU008HasHeader,
          false
      );

      // Header-level Inspecting Activity field.
      Set(
          varU008InspectingActivity,
          ""
      );

      // ---------------------------------------------------------------------------
      // LIST FILTERS AND PAGE STATE
      // ---------------------------------------------------------------------------

      Set(
          varU008Search,
          ""
      );

      Set(
          varU008SysFilter,
          "All"
      );

      Set(
          varU008GroupFilter,
          "All"
      );

      Set(
          varU008Dirty,
          false
      );

      Set(
          varU008SaveOk,
          false
      );

      // Applicability scenario state.
      Set(
          varU008ScenarioOpen,
          false
      );

      Set(
          varU008ScenarioText,
          ""
      );

      Set(
          varU008ScenarioPrompt,
          ""
      );

      // ---------------------------------------------------------------------------
      // USER / SIGNATURE STATE
      // ---------------------------------------------------------------------------

      // Preferred source: authenticated user's badge or DoD ID.
      Set(
          varID,
          Left(
              Text(
                  Office365Users.HttpRequest(
                      "https://dod-graph.microsoft.us/v1.0/users/"
                          & User().Email
                          & "?$select=employeeId",
                      "GET",
                      "",
                      {
                          ContentType: "application/json"
                      }
                  ).employeeId
              ),
              10
          )
      );

      // ---------------------------------------------------------------------------
      // SPINNER, VIEWER, AND APPEARANCE
      // ---------------------------------------------------------------------------

      Set(
          varSpinner,
          false
      );

      Set(
          varSpinnerText,
          ""
      );

      Set(
          varU008ViewerKey,
          ""
      );

      Set(
          varU008ViewerOpen,
          false
      );

      Set(
          varU008ThemeMode,
          "Light"
      );

      // ---------------------------------------------------------------------------
      // INLINE NOTICE / TOAST STATE
      // ---------------------------------------------------------------------------

      Set(
          varInlineNoticeTitle,
          ""
      );

      Set(
          varInlineNoticeBody,
          ""
      );

      Set(
          varInlineNoticeSeverity,
          ""
      );

      Set(
          varInlineNoticeUntil,
          Now()
      );

      ClearCollect(
          colToasts,
          {
              Header: "",
              Body: "",
              Duration: 0,
              Severity: "Info",
              ShowDismiss: true,
              ShowTime: true,
              ShowProgress: false,
              CurrentTime: Now(),
              RemoveTime: Now(),
              ToastVisible: false
          }
      );
      Clear(colToasts);

      Set(
          varShakeBell,
          false
      );

      Set(
          varShakeTimestamp,
          Now()
      );

      Set(
          varFlashColor,
          false
      );

      Set(
          varLastSeverity,
          ""
      );

      Set(
          varLastNotificationChecked,
          Now()
      );

      // ---------------------------------------------------------------------------
      // REFERENCE DATA COLLECTIONS
      // ---------------------------------------------------------------------------

      // Cached Equipment Guide rows.
      ClearCollect(
          colU008Bank,
          {
              MOD_OrderNumber: "",
              OrderNumber: "",
              UROMOD: "",
              Group: "",
              'Valve Ident': "",
              Type: "",
              Size: "",
              'WBS/ESWBS/FGC/SWAB': "",
              'GC/MRN': "",
              Location: "",
              Periodicity: "",
              Applicability: "",
              'DSS-SOC': "",
              Remarks: ""
          }
      );
      Clear(colU008Bank);

      // Cached DRF question bank.
      ClearCollect(
          colU008Questions,
          {
              RequirementOrderNumber: "",
              'Item Description': "",
              Requirement: "",
              ResponseType: "",
              'Choices / Format': "",
              'Conditional On': "",
              'JSON Field': "",
              'MRC Source': "",
              'UI Requirements': ""
          }
      );
      Clear(colU008Questions);

      // System-prefix chips.
      ClearCollect(
          colU008Systems,
          {
              Prefix: ""
          }
      );
      Clear(colU008Systems);

      // ---------------------------------------------------------------------------
      // TABLE-PERSISTENCE COLLECTIONS
      // ---------------------------------------------------------------------------

      // Saved Valve Answer row shape.
      ClearCollect(
          colU008SavedValveRows,
          {
              RowKey: "",
              'Valve Ident': "",
              Group: "",
              Type: "",
              Size: "",
              'WBS/ESWBS/FGC/SWAB': "",
              'GC/MRN': "",
              Location: "",
              Periodicity: "",
              Applicability: "",
              'DSS-SOC': "",
              'EGL Remarks': "",
              'Applicability State': "",
              'Applicability Reason': "",
              'In Sample': "",
              'In Worklist': "",
              'As Found Cat': "",
              'CRES Liner': "",
              'Visual Defects': "",
              'DRF Required': "",
              'RFI Replaced': "",
              'Pre-repair Insp': "",
              'RFI Program': "",
              'RFI Program Other': "",
              'RFI Pool Serial': "",
              'Shipped To DOP': "",
              'Final Cat': "",
              DOI: "",
              Remarks: "",
              'DRF Remarks': "",
              'Validated Date': "",
              Submitted: "",
              'Sketch File Link': "",
              'Pre Inspector Name': "",
              'Pre Shop': "",
              'Pre Badge Number': "",
              'Pre Signature': "",
              'Pre Signature Date': "",
              'Reinst Inspector Name': "",
              'Reinst Shop': "",
              'Reinst Badge Number': "",
              'Reinst Signature': "",
              'Reinst Signature Date': ""
          }
      );
      Clear(colU008SavedValveRows);

      // Saved Defect Answer row shape.
      // Measurement columns are decimal in Dataverse; numeric seeds preserve type.
      ClearCollect(
          colU008SavedDefectRows,
          {
              RowKey: "",
              'Pair Order': 0,
              'Valve Ident': "",
              'Defect Location': "",
              'Defect CRES Liner': "",
              'Located On': "",
              'Pre B': 0,
              'Pre C': 0,
              'Pre Pct': 0,
              'Pre Cat': "",
              'Pre Method': "",
              'Pre Needs Remarks Override': "",
              'Pre Defect Remarks': "",
              'Reinst B': 0,
              'Reinst C': 0,
              'Reinst Pct': 0,
              'Reinst Cat': "",
              'Reinst Repair Method': "",
              'Reinst Defect Remarks': ""
          }
      );
      Clear(colU008SavedDefectRows);

      // Delta-save shadow.
      ClearCollect(
          colU008Shadow,
          {
              Key: "",
              Sig: ""
          }
      );
      Clear(colU008Shadow);

      // Save-error row keys and connector diagnostics.
      ClearCollect(
          colU008SaveErrors,
          {
              Message: "",
              Key: ""
          }
      );
      Clear(colU008SaveErrors);

      // ---------------------------------------------------------------------------
      // ENVIRONMENT VARIABLES
      // ---------------------------------------------------------------------------

      ClearCollect(
          colEnvVars,
          'Environment Variable Values'
      );

      // ---------------------------------------------------------------------------
      // MISSING-ITEMS POPUP COLLECTION
      // ---------------------------------------------------------------------------

      ClearCollect(
          colU008MissingItems,
          {
              Section: "",
              FieldLabel: "",
              Detail: "",
              TargetView: "",
              TargetCondition: "",
              DefectKey: "",
              SortOrder: 0
          }
      );
      Clear(colU008MissingItems);

      // Failure state disables editing until a successful form load.
      Set(varU008LoadFailed, false);
      Set(varU008LoadOk, false);

      Set(varU008LoadedShipName, "");
      Set(varU008HeaderLoadOk, false);
      Set(varU008BankLoadOk, false);
      Set(varU008QuestionsLoadOk, false);
      Set(varU008ValvesLoadOk, false);
      Set(varU008DefectsLoadOk, false);
      Set(varU008HeaderReadOk, false);
      Set(varU008PendingUploadKey, "");
      Set(varU008PendingUploadName, "");
      Set(varU008PendingUploadLink, "");
      ClearCollect(colU008PendingBank, colU008Bank); Clear(colU008PendingBank);
      ClearCollect(colU008PendingQuestions, colU008Questions); Clear(colU008PendingQuestions);
      ClearCollect(colU008PendingValveRows, colU008SavedValveRows); Clear(colU008PendingValveRows);
      ClearCollect(colU008PendingDefectRows, colU008SavedDefectRows); Clear(colU008PendingDefectRows);

      // Resolve the signer once; a profile-service outage does not block inspection work.
      Set(varU008SignerDisplayName, IfError(Coalesce(Office365Users.UserProfileV2(User().Email).displayName, User().FullName), User().FullName));
      Set(varU008QuestionsLoaded, false);
