      });
      nfSendToast(Header:Text,Body:Text,Duration:Number,Severity:Text):Void = 
      {
      	Set(
              varInlineNoticeTitle,
              Header
          );
          Set(
              varInlineNoticeBody,
              Body
          );
          Set(
              varInlineNoticeSeverity,
              Severity
          );
          Set(
              varInlineNoticeUntil,
              DateAdd(
                  Now(),
                  Duration,
                  TimeUnit.Milliseconds
              )
          );
          Collect(
              colToasts,
              {
                  Header: Header,
                  Body: Body,
                  Duration: Duration,
                  Severity: Severity,
                  ShowDismiss: true,
                  ShowTime: true,
                  ShowProgress: false,
                  CurrentTime: Now(),
                  RemoveTime: DateAdd(
                      Now(),
                      Duration,
                      TimeUnit.Milliseconds
                  ),
                  ToastVisible: true
              }
          );
          Set(
              varShakeBell,
              true
          );
          Set(
              varShakeTimestamp,
              Now()
          );
          Set(
              varLastSeverity,
              Severity
          )
      };
      // ---------------------------------------------------------------------------
      // 3. U008 TYPE DEFINITIONS (doc Section 8.1)
