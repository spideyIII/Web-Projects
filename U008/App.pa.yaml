      // DEFECT rows added by the inspector (Pair Order 1..99, key "M70 175.01").
      // ONE defect row carries BOTH conditions (doc Section 6.2): the paper form's
      // Pre-Repair and Reinstalled tables list the SAME defect locations, so the
      // modal renders two blocks over one row set and the lists cannot drift.
      // Dates are text ("yyyy-mm-dd") so serialize/restore is symmetric.
      U008AnswerRecordType := Type({
          RowIndex: Number,
