      nfU008RowSig(r:U008AnswerRecordType):Text = r.RowKey & Char(31) & Text(r.'Pair Order') & Char(31) & r.'Valve Ident' & Char(31) & r.Group & Char(31) & r.Type & Char(31) & r.Size & Char(31) & r.'WBS/ESWBS/FGC/SWAB' & Char(31) & r.'GC/MRN' & Char(31) & r.Location & Char(31) & r.Periodicity & Char(31) & r.Applicability & Char(31) & r.'DSS-SOC' & Char(31) & r.'EGL Remarks' & Char(31) & r.'Applicability State' & Char(31) & r.'Applicability Reason' & Char(31) & r.'In Sample' & Char(31) & r.'In Worklist' & Char(31) & r.'As Found Cat' & Char(31) & r.'CRES Liner' & Char(31) & r.'Visual Defects' & Char(31) & r.'DRF Required' & Char(31) & r.'RFI Replaced' & Char(31) & r.'Pre-repair Insp' & Char(31) & r.'RFI Program' & Char(31) & r.'RFI Program Other' & Char(31) & r.'RFI Pool Serial' & Char(31) & r.'Shipped To DOP' & Char(31) & r.'Final Cat' & Char(31) & r.DOI & Char(31) & r.Remarks & Char(31) & r.'DRF Remarks' & Char(31) & r.'Validated Date' & Char(31) & r.Submitted & Char(31) & r.'Sketch File Link' & Char(31) & r.'Defect Location' & Char(31) & r.'Located On' & Char(31) & r.'Defect CRES Liner' & Char(31) & r.'Pre B' & Char(31) & r.'Pre C' & Char(31) & r.'Pre Pct' & Char(31) & r.'Pre Cat' & Char(31) & r.'Pre Method' & Char(31) & r.'Pre Needs Remarks Override' & Char(31) & r.'Pre Defect Remarks' & Char(31) & r.'Reinst B' & Char(31) & r.'Reinst C' & Char(31) & r.'Reinst Pct' & Char(31) & r.'Reinst Cat' & Char(31) & r.'Reinst Repair Method' & Char(31) & r.'Reinst Defect Remarks' & Char(31) & r.'Pre Inspector Name' & Char(31) & r.'Pre Shop' & Char(31) & r.'Pre Badge Number' & Char(31) & r.'Pre Signature' & Char(31) & r.'Pre Signature Date' & Char(31) & r.'Reinst Inspector Name' & Char(31) & r.'Reinst Shop' & Char(31) & r.'Reinst Badge Number' & Char(31) & r.'Reinst Signature' & Char(31) & r.'Reinst Signature Date';
      // Saved rows projected to clean shapes for the typed initializer (typed-UDF
