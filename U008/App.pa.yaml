                  ""
              ),
              // Decimal columns: NO Coalesce-to-zero - a blank measurement must


              // stay blank ("not measured"), never become 0.
      'Located On': Coalesce(
                  s.'Located On',
                  ""
              ),
              'Pre B': s.'Pre B',
              'Pre C': s.'Pre C',
              'Pre Pct': s.'Pre Pct',
              'Pre Cat': Coalesce(
                  s.'Pre Cat',
                  ""
              ),
              'Pre Method': Coalesce(
                  s.'Pre Method',
                  ""
              ),
              'Pre Needs Remarks Override': Coalesce(
                  s.'Pre Needs Remarks Override',
                  ""
              ),
              'Pre Defect Remarks': Coalesce(
                  s.'Pre Defect Remarks',
                  ""
              ),
              'Reinst B': s.'Reinst B',
              'Reinst C': s.'Reinst C',
              'Reinst Pct': s.'Reinst Pct',
              'Reinst Cat': Coalesce(
                  s.'Reinst Cat',
                  ""
              ),
              'Reinst Repair Method': Coalesce(
                  s.'Reinst Repair Method',
                  ""
              ),
              'Reinst Defect Remarks': Coalesce(
                  s.'Reinst Defect Remarks',
                  ""
              )
          }
      );
      // ---------------------------------------------------------------------------
      // 3.3 WORKLIST (v3 2026-08-25) - the inspector's chosen working set
      //
      // 'In Worklist' = "Yes" marks the valves the inspector is working on this
      // availability. The main list shows ONLY worklist valves; the picker overlay
      // adds/removes at any time. Removing a valve NEVER deletes its answers - it
      // only leaves the working view. Worklist membership persists on the valve's
      // answer row. Scope decision (2026-08-25): completion counters, the sign
      // walk and Complete Inspection all consider WORKLIST valves only; Group 2
      // sampling arithmetic stays MOD-wide (compliance is per GC, not per view).
      // ---------------------------------------------------------------------------
      nfU008WorklistCount = CountRows(
          Filter(
              colU008Answers,
              'Pair Order' = 0,
              'In Worklist' = "Yes"
          )
      );
      // ---------------------------------------------------------------------------
      // 3.5 VALVE-STATUS HELPERS AND THE VALIDATOR (aligned RFI/UI rules)
      // ---------------------------------------------------------------------------

      // The Reinstalled Condition of a DRF is NOT required when the valve was
      // replaced with an RFI asset or was shipped to a DOP for restoration.
      nfU008ReinstRequired(valveKey:Text):Boolean = With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          !(v.'RFI Replaced' = "Yes" || v.'Shipped To DOP' = "Yes")
      );
      // RFI applicability gate.
      nfU008RfiApplies = varU008DopInspection <> true;
      // Program is required either when RFI does not apply (special branch) or
      // when the valve was replaced with an RFI asset.
      nfU008RfiProgramRequired(valveKey:Text):Boolean = With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          !nfU008RfiApplies || v.'RFI Replaced' = "Yes"
      );
      // Free-text program name required only for Program = Other.
      nfU008RfiOtherRequired(valveKey:Text):Boolean = With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          nfU008RfiProgramRequired(valveKey) && v.'RFI Program' = "Other"
      );
      // Pool serial required only for AERP / CCRP / Other.
      nfU008RfiSerialRequired(valveKey:Text):Boolean = With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          nfU008RfiProgramRequired(valveKey) && v.'RFI Program' in [
              "AERP",
              "CCRP",
              "TRIPER",
              "Other"
          ]
      );
      // Detail row visibility / requirement helper.
      nfU008RfiDetailNeeded(valveKey:Text):Boolean = nfU008RfiOtherRequired(valveKey) || nfU008RfiSerialRequired(valveKey);

      // ---------------------------------------------------------------------------
      // PRE-REPAIR INSPECTION GATEWAY
      //
      // This question is shown only for an RFI-replaced valve when RFI processing
      // applies to the current DART item. Selecting No is a valid workflow:
      // the screen resets dependent screening fields to N/A, deletes defect rows,
      // clears signatures/validation, and retains the RFI asset information.
      // ---------------------------------------------------------------------------

      // True only when the Pre-repair Insp question should be displayed and
      // required for the selected valve.
      nfU008PreRepairInspRequired(
          valveKey: Text
      ): Boolean =
      With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          nfU008RfiApplies
              && v.'RFI Replaced' = "Yes"
      );

      // True when the user selected the valid no-pre-repair-inspection workflow.
      nfU008PreRepairInspNo(
          valveKey: Text
      ): Boolean =
      With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          nfU008PreRepairInspRequired(valveKey)
              && v.'Pre-repair Insp' = "No"
      );

      // True when the user selected the normal screening / DRF workflow.
      nfU008PreRepairInspYes(
          valveKey: Text
      ): Boolean =
      With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          nfU008PreRepairInspRequired(valveKey)
              && v.'Pre-repair Insp' = "Yes"
      );

      // True when the RFI-replaced valve still needs the gateway answer.
      nfU008PreRepairInspMissing(
          valveKey: Text
      ): Boolean =
      With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          nfU008PreRepairInspRequired(valveKey)
              && IsBlank(v.'Pre-repair Insp')
      );

      nfU008ScreeningMissingFor(v:U008AnswerRecordType):Number =
      With({gatewayRequired: nfU008RfiApplies && v.'RFI Replaced' = "Yes",
            programRequired: !nfU008RfiApplies || v.'RFI Replaced' = "Yes"},
          With({gatewayNo: gatewayRequired && v.'Pre-repair Insp' = "No",
                otherRequired: programRequired && v.'RFI Program' = "Other",
                serialRequired: programRequired && v.'RFI Program' in ["AERP", "CCRP", "TRIPER", "Other"]},
      // -----------------------------------------------------------------------
          // The gateway itself is required only for an RFI-replaced valve when
          // RFI processing applies to the DART item.
          // -----------------------------------------------------------------------
          If(
              gatewayRequired
                  && IsBlank(v.'Pre-repair Insp'),
              1,
              0
          )

          // -----------------------------------------------------------------------
          // Normal screening fields.
          //
          // If Pre-repair Insp = No, the screen writes N/A to these fields and
          // they are not missing. RFI asset information remains independently
          // required and is evaluated below.
          // -----------------------------------------------------------------------
          + If(
              gatewayNo,
              0,

              If(
                  IsBlank(v.'As Found Cat'),
                  1,
                  0
              )
              + If(
                  IsBlank(v.'CRES Liner'),
                  1,
                  0
              )
              + If(
                  IsBlank(v.'Visual Defects'),
                  1,
                  0
              )
              + If(
                  IsBlank(v.'DRF Required'),
                  1,
                  0
              )
              + If(
                  IsBlank(v.'Final Cat'),
                  1,
                  0
              )
              + If(
                  !nfAnswerProvided(v.DOI),
                  1,
                  0
              )
          )

          // -----------------------------------------------------------------------
          // RFI information remains independently required.
          //
          // This applies even when Pre-repair Insp = No because RFI asset
          // information is retained and still must explain the selected path.
          // -----------------------------------------------------------------------
          + If(
              nfU008RfiApplies
                  && IsBlank(v.'RFI Replaced'),
              1,
              0
          )
          + If(
              programRequired
                  && IsBlank(v.'RFI Program'),
              1,
              0
          )
          + If(
              otherRequired
                  && !nfAnswerProvided(v.'RFI Program Other'),
              1,
              0
          )
          + If(
              serialRequired
                  && !nfAnswerProvided(v.'RFI Pool Serial'),
              1,
              0
          )
          ));
      nfU008ScreeningMissing(valveKey:Text):Number =
          nfU008ScreeningMissingFor(LookUp(colU008Answers, RowKey = valveKey));
      // Numeric-category defects must resolve to a percentage, not merely have B text.
      nfU008NumericMeasureMissing(b:Text,c:Text,pct:Text):Boolean = IsBlank(nfU008DefectPct(b, c, pct));
      // Defect-row gaps for one valve and one condition.
      // The original missing-field predicates, aggregated in one pass per condition.
      nfU008DefectsMissingFor(v:U008AnswerRecordType,defects:U008AnswersTableType,cond:Text):Number =
      With({valveIsCres: v.'CRES Liner' = "Yes", specialMeasurePath: v.'CRES Liner' = "Yes" || nfU008IsAide(v.'Valve Ident')},
          If(v.'DRF Required' <> "Yes", 0,
              If(cond = "Pre",
                  If(IsEmpty(defects), 1, 0) + Coalesce(Sum(defects,
      If(!nfAnswerProvided('Defect Location'), 1, 0)
              + If(!nfAnswerProvided('Located On'), 1, 0)
              + If(valveIsCres && !('Defect CRES Liner' in [
                                  "Yes",
                                  "No"
                              ]), 1, 0)
              + If(If(
                                  valveIsCres,
                                  If(
                                      'Defect CRES Liner' = "Yes",
                                      !('Pre Cat' in [
                                          "SAT",
                                          "UNSAT"
                                      ]),
                                      'Defect CRES Liner' = "No",
                                      !('Pre Cat' in [
                                          "A",
                                          "B",
                                          "C",
                                          "D"
                                      ]),
                                      false
                                  ),
                                  !('Pre Cat' in [
                                      "A",
                                      "B",
                                      "C",
                                      "D"
                                  ])
                              ), 1, 0)
              + If(!nfAnswerProvided('Pre Method'), 1, 0)
              + If(If(specialMeasurePath,
                                  IsBlank(nfU008ParseMeasure('Pre B')) && IsBlank(nfU008ParseMeasure('Pre Pct')),
                                  nfU008NumericMeasureMissing('Pre B', 'Pre C', 'Pre Pct')), 1, 0)
          ), 0),
                  If(v.'RFI Replaced' = "Yes" || v.'Shipped To DOP' = "Yes", 0,
                      Coalesce(Sum(defects,
      If(If(
                                      valveIsCres,
                                      If(
                                          'Defect CRES Liner' = "Yes",
                                          !('Reinst Cat' in [
                                              "SAT",
                                              "UNSAT"
                                          ]),
                                          'Defect CRES Liner' = "No",
                                          !('Reinst Cat' in [
                                              "A",
                                              "B",
                                              "C",
                                              "D"
                                          ]),
                                          false
                                      ),
                                      !('Reinst Cat' in [
                                          "A",
                                          "B",
                                          "C",
                                          "D"
                                      ])
                                  ), 1, 0)
              + If(!nfAnswerProvided('Reinst Repair Method'), 1, 0)
              + If(If(specialMeasurePath,
                                  IsBlank(nfU008ParseMeasure('Reinst B')) && IsBlank(nfU008ParseMeasure('Reinst Pct')),
                                  nfU008NumericMeasureMissing('Reinst B', 'Reinst C', 'Reinst Pct')), 1, 0)
          ), 0)))));
      nfU008DefectsMissing(valveKey:Text,cond:Text):Number =
      With({v: LookUp(colU008Answers, RowKey = valveKey),
            defects: Filter(colU008Answers, GroupKey = valveKey, 'Pair Order' > 0)},
          nfU008DefectsMissingFor(v, defects, cond));
      // One pure summary shares parent lookup and defect inputs across its results.
      U008ValidationSummaryType := Type({
          ScreeningMissing: Number, PreMissing: Number, ReinstMissing: Number,
          SignatureMissing: Number, UnsignedMissing: Number, TotalMissing: Number,
          PreCanSign: Boolean, ReinstCanSign: Boolean, Complete: Boolean
      });
      nfU008ValidationFor(v:U008AnswerRecordType,defects:U008AnswersTableType):U008ValidationSummaryType =
      With({reinstRequired: !(v.'RFI Replaced' = "Yes" || v.'Shipped To DOP' = "Yes")},
          With({screening: nfU008ScreeningMissingFor(v),
                pre: nfU008DefectsMissingFor(v, defects, "Pre"),
                reinst: If(reinstRequired, nfU008DefectsMissingFor(v, defects, "Reinst"), 0),
                signature: If(v.'DRF Required' = "Yes",
                    If(IsBlank(v.'Pre Signature'), 1, 0)
                        + If(reinstRequired && IsBlank(v.'Reinst Signature'), 1, 0), 0),
                pending: If(v.'Applicability State' = "Pending", 1, 0) + If(v.'In Sample' = "Pending", 1, 0)},
              With({unsigned: pending + screening + pre + reinst,
                    signEligible: v.'Applicability State' = "Applicable" && v.'In Sample' = "Yes" && v.'DRF Required' = "Yes"},
                  {ScreeningMissing: screening, PreMissing: pre, ReinstMissing: reinst,
                   SignatureMissing: signature, UnsignedMissing: unsigned, TotalMissing: unsigned + signature,
                   PreCanSign: signEligible && screening = 0 && pre = 0,
                   ReinstCanSign: signEligible && reinstRequired && screening = 0 && pre = 0 && reinst = 0,
                   Complete: v.'Applicability State' = "Applicable" && v.'In Sample' = "Yes" && unsigned + signature = 0}
              )
          )
      );
      nfU008ValveMissing(valveKey:Text,requireSignatures:Boolean):Number =
      With({v: LookUp(colU008Answers, RowKey = valveKey),
            defects: Filter(colU008Answers, GroupKey = valveKey, 'Pair Order' > 0)},
          With({validation: nfU008ValidationFor(v, defects)},
              validation.UnsignedMissing + If(requireSignatures, validation.SignatureMissing, 0)));
      // Action-time readiness stays a fresh check after the latest commit.
      nfU008CondReady(valveKey:Text,cond:Text):Boolean =
      With({v: LookUp(colU008Answers, RowKey = valveKey),
            defects: Filter(colU008Answers, GroupKey = valveKey, 'Pair Order' > 0)},
          v.'Applicability State' = "Applicable" && v.'In Sample' = "Yes" && v.'DRF Required' = "Yes"
          && nfU008ScreeningMissingFor(v) = 0
          && If(cond = "Pre", nfU008DefectsMissingFor(v, defects, "Pre") = 0,
              !(v.'RFI Replaced' = "Yes" || v.'Shipped To DOP' = "Yes")
              && nfU008DefectsMissingFor(v, defects, "Pre") = 0 && nfU008DefectsMissingFor(v, defects, "Reinst") = 0));
      nfU008ValveComplete(valveKey:Text):Boolean =
      With({v: LookUp(colU008Answers, RowKey = valveKey),
            defects: Filter(colU008Answers, GroupKey = valveKey, 'Pair Order' > 0)},
          nfU008ValidationFor(v, defects).Complete);
      // The valves that count toward completion: IN THE WORKLIST (v3 scope
      // decision 2026-08-25 - the worklist is the working scope), hull-applicable
      // (or still pending a decision - those BLOCK completion), and in the sample
      // (or still pending - also blocking).
      nfU008InScopeCount = CountRows(
          Filter(
              colU008Answers,
              'Pair Order' = 0,
              'In Worklist' = "Yes",
              'Applicability State' <> "Not Applicable",
              'In Sample' <> "No"
          )
      );
      nfU008CompleteCount = CountRows(
          Filter(
              colU008Answers As v,
              v.'Pair Order' = 0,
              v.'In Worklist' = "Yes",
              v.'Applicability State' <> "Not Applicable",
              v.'In Sample' <> "No",
              nfU008ValveComplete(v.RowKey)
          )
      );
      nfU008PendingDecisionCount = CountRows(
          Filter(
              colU008Answers,
              'Pair Order' = 0,
              'In Worklist' = "Yes",
              'Applicability State' = "Pending" || 'In Sample' = "Pending"
          )
      );
      // Full inspection completion: every in-scope valve complete, activity entered, no open decisions.
      nfU008FormComplete = nfU008InScopeCount > 0 && !IsBlank(
          Trim(
              Coalesce(
                  varU008InspectingActivity,
                  ""
              )
          )
      ) && nfU008PendingDecisionCount = 0 && nfU008CompleteCount = nfU008InScopeCount;
      // ---------------------------------------------------------------------------
      // 3.55 SUBMISSION COUNTS (worklist-scoped)
      // Final submission requires every active in-scope valve complete and validated.
      // ---------------------------------------------------------------------------

      // A valve counts as EDITED when any answer content exists on it: a screening
      // answer, DOI, remarks, a signature, a Validate stamp, or any defect row.
      // Scope decisions alone (applicability / sampling) do NOT make it edited.
      nfU008ValveEdited(
          valveKey: Text
      ): Boolean =
      With(
          {
              v: LookUp(
                  colU008Answers,
                  RowKey = valveKey
              )
          },
          nfAnswerProvided(v.'As Found Cat')
              || nfAnswerProvided(v.'CRES Liner')
              || nfAnswerProvided(v.'Visual Defects')
              || nfAnswerProvided(v.'DRF Required')
              || nfAnswerProvided(v.'RFI Replaced')
              || nfAnswerProvided(v.'Pre-repair Insp')
              || nfAnswerProvided(v.'RFI Program')
              || nfAnswerProvided(v.'RFI Program Other')
              || nfAnswerProvided(v.'RFI Pool Serial')
              || nfAnswerProvided(v.'Shipped To DOP')
              || nfAnswerProvided(v.'Final Cat')
              || nfAnswerProvided(v.DOI)
              || nfAnswerProvided(v.Remarks)
              || nfAnswerProvided(v.'DRF Remarks')
              || nfAnswerProvided(v.'Pre Signature')
              || nfAnswerProvided(v.'Reinst Signature')
              || nfAnswerProvided(v.'Validated Date')
              || CountRows(
                  Filter(
                      colU008Answers,
                      GroupKey = valveKey,
                      'Pair Order' > 0
                  )
              ) > 0
      );
      // Validated WORKLIST valves carry a Validate stamp - validation already
      // required the valve to be complete, so every one is submit-ready. Only
      // worklist valves submit (v3 scope decision).
      nfU008ValidatedCount = CountRows(
          Filter(
              colU008Answers,
              'Pair Order' = 0,
              'In Worklist' = "Yes",
              !IsBlank('Validated Date')
          )
      );
      // Edited worklist valves not yet validated: listed in the submit-
      // confirmation modal as "stays draft" so nothing is excluded silently.
      nfU008EditedNotValidatedCount = CountRows(
          Filter(
              colU008Answers As v,
              v.'Pair Order' = 0,
              v.'In Worklist' = "Yes",
              IsBlank(v.'Validated Date'),
              nfU008ValveEdited(v.RowKey)
          )
      );
      // Edited valves OUTSIDE the worklist (e.g. worked, then removed from the
      // list): shown as a warning at submission - they are NOT submitted but
      // their saved answers are never touched.
      nfU008EditedOutsideWorklistCount = CountRows(
          Filter(
              colU008Answers As v,
              v.'Pair Order' = 0,
              v.'In Worklist' <> "Yes",
              nfU008ValveEdited(v.RowKey)
          )
      );
      // Measurement texts that CANNOT convert to a number (decimal-columns rule):
      // non-blank but unparseable, e.g. footnoted "N/A (1)" or prose. They would
      // save as BLANK decimals, so the save warns and the validator already
      // refuses to sign/validate a defect whose required measurement is one.
      nfU008InvalidMeasure(raw:Text):Boolean = nfAnswerProvided(raw)
          && With({parsed: nfU008ParseMeasure(raw)}, IsBlank(parsed) || parsed < 0);
      nfU008UnparsedMeasureCount = CountRows(
          Filter(
              colU008Answers As r,
              r.'Pair Order' > 0,
              nfU008InvalidMeasure(r.'Pre B') || nfU008InvalidMeasure(r.'Pre C') || nfU008InvalidMeasure(r.'Pre Pct') || nfU008InvalidMeasure(r.'Reinst B') || nfU008InvalidMeasure(r.'Reinst C') || nfU008InvalidMeasure(r.'Reinst Pct')
          )
      );
      // Final submission completes the whole active inspection scope.
      // Excluded/not-sampled valves do not require validation; pending decisions do.
      nfU008UnvalidatedScopeCount = CountRows(Filter(colU008Answers,
          'Pair Order' = 0, 'In Worklist' = "Yes",
          'Applicability State' <> "Not Applicable", 'In Sample' <> "No",
          IsBlank('Validated Date')));
      nfU008CanSubmit = nfU008FormComplete && nfU008UnvalidatedScopeCount = 0;
      // The footer Sign button's walk: the first WORKLIST valve whose PRE-REPAIR
      // condition is ready to sign but unsigned; then the first whose REINSTALLED
      // condition is required, ready, and unsigned. {"", ""} when nothing to sign.
      nfU008NextSignTarget():U008SignTargetType = With(
          {
              pre: First(
                  SortByColumns(
                      Filter(
                          colU008Answers As v,
                          v.'Pair Order' = 0,
                          v.'In Worklist' = "Yes",
                          IsBlank(v.'Pre Signature'),
                          nfU008CondReady(
                              v.RowKey,
                              "Pre"
                          )
                      ),
                      "RowKey",
                      SortOrder.Ascending
                  )
              ),
              reinst: First(
                  SortByColumns(
                      Filter(
                          colU008Answers As v,
                          v.'Pair Order' = 0,
                          v.'In Worklist' = "Yes",
                          IsBlank(v.'Reinst Signature'),
                          nfU008CondReady(
                              v.RowKey,
                              "Reinst"
                          )
                      ),
                      "RowKey",
                      SortOrder.Ascending
                  )
              )
          },
          If(
              !IsBlank(pre.RowKey),
              {
                  Key: pre.RowKey,
                  Cond: "Pre"
              },
              !IsBlank(reinst.RowKey),
              {
                  Key: reinst.RowKey,
                  Cond: "Reinst"
              },
              {
                  Key: "",
                  Cond: ""
              }
          )
      );
      // ---------------------------------------------------------------------------
      // 3.6 GROUP 2 SAMPLING (M70/M80 - Proc 1.B; doc Section 8.4)
      //
      // 25% of the Group 2 valves per GC (M70) / MRN (M80) within each WBS/ESWBS
      // must be inspected, minimum one per GC. If ANY Group 2 valve of the GC is
      // discovered with more than 10% wall reduction, the REMAINDER of that GC
      // must be inspected (escalation). Group 1 valves are always in sample.
      // ---------------------------------------------------------------------------
      nfU008SampleStats(gc:Text,wbs:Text):U008SampleStatsType = With(
          {
              grp: Filter(
                  colU008Answers,
                  'Pair Order' = 0,
                  Group = "2",
                  'GC/MRN' = gc,
                  'WBS/ESWBS/FGC/SWAB' = wbs,
                  'Applicability State' <> "Not Applicable"
              )
          },
          With(
              {
                  total: CountRows(grp),
                  inSample: CountRows(
                      Filter(
                          grp,
                          'In Sample' = "Yes"
                      )
                  ),
                  // any in-sample valve of the GC with a pre-repair band above 10%

                  escalated: CountRows(
                      Filter(
                          grp As g,
                          g.'In Sample' = "Yes",
                          CountRows(
                              Filter(
                                  colU008Answers As d,
                                  d.GroupKey = g.RowKey,
                                  d.'Pair Order' > 0,
                                  Coalesce(
                                      nfU008DefectPct(
                                          d.'Pre B',
                                          d.'Pre C',
                                          d.'Pre Pct'
                                      ),
                                      0
                                  ) > 10
                              )
                          ) > 0
                      )
                  ) > 0
              },
              {
                  Total: total,
                  InSample: inSample,
                  MinRequired: Max(
                      If(
                          total > 0,
                          1,
                          0
                      ),
                      RoundUp(
                          total / 4,
                          0
                      )
                  ),
                  Escalated: escalated
              }
          )
      );
      // Optional, informational sampling tracker. Population follows SampleStats:
      // all loaded Group 2 parent valves not marked Not Applicable, not just worklist.
      // Defer the group/defect aggregation while editing or while the panel is closed.
      nfU008SamplingPopulation = Filter(colU008Answers,
          'Pair Order' = 0, Group = "2", 'Applicability State' <> "Not Applicable");
      nfU008SamplingSummary = If(varU008SamplingExpanded && !varU008ModalMetricsActive && !varU008LoadFailed,
          SortByColumns(
              ForAll(GroupBy(nfU008SamplingPopulation, 'GC/MRN', 'WBS/ESWBS/FGC/SWAB', SamplingValves) As bucket,
                  With({stats: nfU008SampleStats(bucket.'GC/MRN', bucket.'WBS/ESWBS/FGC/SWAB'),
                        selectedWorklist: CountRows(Filter(bucket.SamplingValves, 'In Sample' = "Yes", 'In Worklist' = "Yes")),
                        validatedWorklist: CountRows(Filter(bucket.SamplingValves, 'In Sample' = "Yes", 'In Worklist' = "Yes", !IsBlank('Validated Date'))),
                        pendingWorklist: CountRows(Filter(bucket.SamplingValves, 'In Worklist' = "Yes", 'In Sample' = "Pending"))},
                      With({requiredNow: If(stats.Escalated, stats.Total, stats.MinRequired)},
                          {GcKey: bucket.'GC/MRN', WbsKey: bucket.'WBS/ESWBS/FGC/SWAB',
                           Total: stats.Total, BaseMinimum: stats.MinRequired, RequiredNow: requiredNow,
                           Selected: stats.InSample, SelectedWorklist: selectedWorklist, Validated: validatedWorklist,
                           MoreToSelect: Max(0, requiredNow - stats.InSample),
                           MoreToValidate: Max(0, requiredNow - validatedWorklist),
                           SelectedRemaining: Max(0, selectedWorklist - validatedWorklist),
                           SelectedOutside: Max(0, stats.InSample - selectedWorklist),
                           PendingWorklist: pendingWorklist, Escalated: stats.Escalated}
                      )
                  )
              ), "GcKey", SortOrder.Ascending, "WbsKey", SortOrder.Ascending),
          Filter(Table({GcKey: "", WbsKey: "", Total: 0, BaseMinimum: 0, RequiredNow: 0,
              Selected: 0, SelectedWorklist: 0, Validated: 0, MoreToSelect: 0, MoreToValidate: 0,
              SelectedRemaining: 0, SelectedOutside: 0, PendingWorklist: 0, Escalated: false}), false));

      // ---------------------------------------------------------------------------
      // 4. MEASUREMENT STORAGE (Decimal columns - refactor 2026-08-25)
      // The six defect measurement columns (Pre/Reinst B, C, Pct) are DECIMAL in
      // Dataverse. The save parses the typed text with nfU008ParseMeasure
      // (quotes / % / fractions parse; "None" and exact "N/A" -> 0; free text ->
      // blank + save warning) and stores the EFFECTIVE percent via nfU008DefectPct
      // (typed override when it parses, else B/C x 100). The load formats numbers
      // back to text; a stored % that matches the computed B/C value restores as
      // BLANK so the auto-compute behavior survives the round trip.
      // ---------------------------------------------------------------------------

      // ---------------------------------------------------------------------------
      // 5. LOCAL POPULATION - MERGE (v3, doc Section 8.3 superseded 2026-08-25)
      //
      // The collection is built by OVERLAYING saved answer rows onto the Equipment
      // Guide bank: every bank valve gets a row (saved fields when a U008 Valve
      // Answer row exists, virgin defaults otherwise), then every saved U008
      // Defect Answer row is appended. Untouched valves have no saved rows at all.
      // NOTE: a valve REMOVED from the Equipment Guide after answers were saved is
      // dropped from the form (its Dataverse rows remain untouched) - the bank is
      // the row template, saved rows are overrides.
      // ---------------------------------------------------------------------------
      InitializeU008Collections(
          savedValves: U008SavedValveTableType,
          savedDefects: U008SavedDefectTableType,
          nfSource: U008SourceTableType
      ): U008AnswersTableType =
      With(
          {
              valveRows: ForAll(
                  nfSource As v,
                  With(
                      {
                          s: LookUp(
                              savedValves,
                              RowKey = v.MOD_OrderNumber
                          )
                      },
                      If(
                          IsBlank(s.RowKey),

                          // ---- Virgin valve row from the Equipment Guide ----
                          With(
                              {
                                  applicabilityState: nfU008InitialApplicability(
                                      v.Applicability
                                  )
                              },
                              {
                                  RowIndex: 0,
                                  GroupKey: v.MOD_OrderNumber,
                                  RowKey: v.MOD_OrderNumber,
                                  'Pair Order': 0,
                                  'Valve Ident': v.'Valve Ident',
                                  Group: v.Group,
                                  Type: v.Type,
                                  Size: v.Size,
                                  'WBS/ESWBS/FGC/SWAB': v.'WBS/ESWBS/FGC/SWAB',
                                  'GC/MRN': v.'GC/MRN',
                                  Location: v.Location,
                                  Periodicity: v.Periodicity,
                                  Applicability: v.Applicability,
                                  'DSS-SOC': v.'DSS-SOC',
                                  'EGL Remarks': v.Remarks,

                                  'Applicability State': applicabilityState,
                                  'Applicability Reason': If(
                                      applicabilityState = "Not Applicable",
                                      "EGL applicability does not include the selected hull.",
                                      ""
                                  ),

                                  'In Sample': If(
                                      v.Group = "2",
                                      "Pending",
                                      "Yes"
                                  ),
                                  'In Worklist': "",

                                  'As Found Cat': "",
                                  'CRES Liner': "",
                                  'Visual Defects': "",
                                  'DRF Required': "",
                                  'RFI Replaced': "",
                                  'Pre-repair Insp': "",
                                  'RFI Program': "",
                                  'RFI Program Other': "",
                                  'RFI Pool Serial': "",
                                  'Shipped To DOP': "",
                                  'Final Cat': "",
                                  DOI: "",
                                  Remarks: "",
                                  'DRF Remarks': "",
                                  'Validated Date': "",
                                  Submitted: "",
                                  'Sketch File Link': "",

                                  'Defect Location': "",
                                  'Located On': "",
                                  'Defect CRES Liner': "",
                                  'Pre B': "",
                                  'Pre C': "",
                                  'Pre Pct': "",
                                  'Pre Cat': "",
                                  'Pre Method': "",
                                  'Pre Needs Remarks Override': "",
                                  'Pre Defect Remarks': "",
                                  'Reinst B': "",
                                  'Reinst C': "",
                                  'Reinst Pct': "",
                                  'Reinst Cat': "",
                                  'Reinst Repair Method': "",
                                  'Reinst Defect Remarks': "",

                                  'Pre Inspector Name': "",
                                  'Pre Shop': "",
                                  'Pre Badge Number': "",
                                  'Pre Signature': "",
                                  'Pre Signature Date': "",
                                  'Reinst Inspector Name': "",
                                  'Reinst Shop': "",
                                  'Reinst Badge Number': "",
                                  'Reinst Signature': "",
                                  'Reinst Signature Date': ""
                              }
                          ),

                          // ---- Saved valve row is the inspection authority ----
                          With(
                              {
                                  applicabilityState: nfU008InitialApplicability(
                                      Coalesce(
                                          s.Applicability,
                                          v.Applicability
                                      )
                                  )
                              },
                              {
                                  RowIndex: 0,
                                  GroupKey: s.RowKey,
                                  RowKey: s.RowKey,
                                  'Pair Order': 0,
                                  'Valve Ident': s.'Valve Ident',
                                  Group: s.Group,
                                  Type: s.Type,
                                  Size: s.Size,
                                  'WBS/ESWBS/FGC/SWAB': s.'WBS/ESWBS/FGC/SWAB',
                                  'GC/MRN': s.'GC/MRN',
                                  Location: s.Location,
                                  Periodicity: s.Periodicity,
                                  Applicability: s.Applicability,
                                  'DSS-SOC': s.'DSS-SOC',
                                  'EGL Remarks': s.'EGL Remarks',

                                  'Applicability State': applicabilityState,
                                  'Applicability Reason': If(
                                      applicabilityState = "Not Applicable",
                                      "EGL applicability does not include the selected hull.",
                                      ""
                                  ),

                                  'In Sample': If(
                                      IsBlank(s.'In Sample'),
                                      If(
                                          s.Group = "2",
                                          "Pending",
                                          "Yes"
                                      ),
                                      s.'In Sample'
                                  ),
                                  'In Worklist': s.'In Worklist',

                                  'As Found Cat': s.'As Found Cat',
                                  'CRES Liner': s.'CRES Liner',
                                  'Visual Defects': s.'Visual Defects',
                                  'DRF Required': s.'DRF Required',
                                  'RFI Replaced': s.'RFI Replaced',
                                  'Pre-repair Insp': s.'Pre-repair Insp',
                                  'RFI Program': s.'RFI Program',
                                  'RFI Program Other': s.'RFI Program Other',
                                  'RFI Pool Serial': s.'RFI Pool Serial',
                                  'Shipped To DOP': s.'Shipped To DOP',
                                  'Final Cat': s.'Final Cat',
                                  DOI: s.DOI,
                                  Remarks: s.Remarks,
                                  'DRF Remarks': s.'DRF Remarks',
                                  'Validated Date': s.'Validated Date',
                                  Submitted: s.Submitted,
                                  'Sketch File Link': s.'Sketch File Link',

                                  'Defect Location': "",
                                  'Located On': "",
                                  'Defect CRES Liner': "",
                                  'Pre B': "",
                                  'Pre C': "",
                                  'Pre Pct': "",
                                  'Pre Cat': "",
                                  'Pre Method': "",
                                  'Pre Needs Remarks Override': "",
                                  'Pre Defect Remarks': "",
                                  'Reinst B': "",
                                  'Reinst C': "",
                                  'Reinst Pct': "",
                                  'Reinst Cat': "",
                                  'Reinst Repair Method': "",
                                  'Reinst Defect Remarks': "",

                                  'Pre Inspector Name': s.'Pre Inspector Name',
                                  'Pre Shop': s.'Pre Shop',
                                  'Pre Badge Number': s.'Pre Badge Number',
                                  'Pre Signature': s.'Pre Signature',
                                  'Pre Signature Date': s.'Pre Signature Date',
                                  'Reinst Inspector Name': s.'Reinst Inspector Name',
                                  'Reinst Shop': s.'Reinst Shop',
                                  'Reinst Badge Number': s.'Reinst Badge Number',
                                  'Reinst Signature': s.'Reinst Signature',
                                  'Reinst Signature Date': s.'Reinst Signature Date'
                              }
                          )
                      )
                  )
              ),

              // ---- Saved defect rows merged beneath their parent valve ----
              defectRows: ForAll(
                  savedDefects As d,
                  {
                      RowIndex: 0,

                      GroupKey: If(
                          IsBlank(
                              Find(
                                  ".",
                                  d.RowKey
                              )
                          ),
                          d.RowKey,
                          Left(
                              d.RowKey,
                              Find(
                                  ".",
                                  d.RowKey
                              ) - 1
                          )
                      ),

                      RowKey: d.RowKey,
                      'Pair Order': d.'Pair Order',
                      'Valve Ident': d.'Valve Ident',

                      Group: "",
                      Type: "",
                      Size: "",
                      'WBS/ESWBS/FGC/SWAB': "",
                      'GC/MRN': "",
                      Location: "",
                      Periodicity: "",
                      Applicability: "",
                      'DSS-SOC': "",
                      'EGL Remarks': "",
                      'Applicability State': "",
                      'Applicability Reason': "",
                      'In Sample': "",
                      'In Worklist': "",
                      'As Found Cat': "",
                      'CRES Liner': "",
                      'Visual Defects': "",
                      'DRF Required': "",
                      'RFI Replaced': "",
                      'Pre-repair Insp': "",
                      'RFI Program': "",
                      'RFI Program Other': "",
                      'RFI Pool Serial': "",
                      'Shipped To DOP': "",
                      'Final Cat': "",
                      DOI: "",
                      Remarks: "",
                      'DRF Remarks': "",
                      'Validated Date': "",
                      Submitted: "",
                      'Sketch File Link': "",
                      'Defect Location': d.'Defect Location',
                      'Located On': If(d.'Located On' = "Value", "Body", d.'Located On'),
                      'Defect CRES Liner': d.'Defect CRES Liner',

                      'Pre B': If(
                          IsBlank(d.'Pre B'),
                          "",
                          Text(d.'Pre B', "0.###############", "en-US")
                      ),

                      'Pre C': If(
                          IsBlank(d.'Pre C'),
                          "",
                          Text(d.'Pre C', "0.###############", "en-US")
                      ),

                      'Pre Pct': With(
                          {
                              comp: If(
                                  IsBlank(d.'Pre B')
                                      || IsBlank(d.'Pre C')
                                      || d.'Pre C' <= 0,
                                  Blank(),
                                  d.'Pre B' / d.'Pre C' * 100
                              )
                          },
                          If(
                              IsBlank(d.'Pre Pct'),
                              "",
                              !IsBlank(comp)
                                  && Abs(d.'Pre Pct' - comp) < 0.05,
                              "",
                              Text(d.'Pre Pct', "0.###############", "en-US")
                          )
                      ),

                      'Pre Cat': d.'Pre Cat',
                      'Pre Method': d.'Pre Method',
                      'Pre Needs Remarks Override': d.'Pre Needs Remarks Override',
                      'Pre Defect Remarks': d.'Pre Defect Remarks',

                      'Reinst B': If(
                          IsBlank(d.'Reinst B'),
                          "",
                          Text(d.'Reinst B', "0.###############", "en-US")
                      ),

                      'Reinst C': If(
                          IsBlank(d.'Reinst C'),
                          "",
                          Text(d.'Reinst C', "0.###############", "en-US")
                      ),

                      'Reinst Pct': With(
                          {
                              comp: If(
                                  IsBlank(d.'Reinst B')
                                      || IsBlank(d.'Reinst C')
                                      || d.'Reinst C' <= 0,
                                  Blank(),
                                  d.'Reinst B' / d.'Reinst C' * 100
                              )
                          },
                          If(
                              IsBlank(d.'Reinst Pct'),
                              "",
                              !IsBlank(comp)
                                  && Abs(d.'Reinst Pct' - comp) < 0.05,
                              "",
                              Text(d.'Reinst Pct', "0.###############", "en-US")
                          )
                      ),

                      'Reinst Cat': d.'Reinst Cat',
                      'Reinst Repair Method': d.'Reinst Repair Method',
                      'Reinst Defect Remarks': d.'Reinst Defect Remarks',

                      'Pre Inspector Name': "",
                      'Pre Shop': "",
                      'Pre Badge Number': "",
                      'Pre Signature': "",
                      'Pre Signature Date': "",
                      'Reinst Inspector Name': "",
                      'Reinst Shop': "",
                      'Reinst Badge Number': "",
                      'Reinst Signature': "",
                      'Reinst Signature Date': ""
                  }
              )
          },

          // ---- Concatenate valve and defect rows, then stamp display row index ----
          With(
              {
                  nv: CountRows(valveRows),
                  nd: CountRows(defectRows)
              },
              ForAll(
                  Sequence(nv + nd),
                  With(
                      {
                          rec: If(
                              Value <= nv,
                              Index(
                                  valveRows,
                                  Value
                              ),
                              Index(
                                  defectRows,
                                  Value - nv
                              )
                          )
                      },
                      Patch(
                          rec,
                          {
                              RowIndex: Value
                          }
                      )
                  )
              )
          )
      );
      // ---------------------------------------------------------------------------
      // 6. PAGE LOAD / SHIP CHANGE ENTRY POINT (v3 - table persistence)
      // ---------------------------------------------------------------------------

      // Stage every remote read. A failed query leaves the displayed answer set
      // and its dirty shadow untouched. Concurrent branches write distinct state.
      ReloadU008Answers():Void = {
          Set(varU008ReopenStatusAllowed, false);
          Set(varU008RecordIsWorking, false);
          Set(varU008LoadOk, false);
          Set(varU008LoadFailed, true);
          If(IsBlank(nfRecordItem.'PK - URO Impact Item') || nfModNumber = 0,
              nfSendToast("Cannot load inspection", "Open this page from a valid impact item with a supported ship. Studio preview uses the original U008 fallback record.", 10000, "Error"),
              With({k: Text(nfRecordItem.'PK - URO Impact Item'), impactPk: nfRecordItem.'PK - URO Impact Item', modText: Text(nfModNumber)},
                  Concurrent(
                      Set(varU008HeaderLoadOk, IfError(
                          With({h: LookUp('U008 Inspections', 'URO Impact Item'.'PK - URO Impact Item' = impactPk)},
                              Set(varU008PendingHeader, h); true), false)),
                      Set(varU008BankLoadOk, true);
                      IfError(
                          ClearCollect(colU008PendingBank, Filter('U008 Equipment guides', UROMOD = modText)); true,
                          Set(varU008BankLoadOk, false); false
                      ),
                      Set(varU008QuestionsLoadOk, true);
                      IfError(
                          If(varU008QuestionsLoaded,
                              ClearCollect(colU008PendingQuestions, colU008Questions),
                              ClearCollect(colU008PendingQuestions, 'U008 DRF Requirements')
                          ); true,
                          Set(varU008QuestionsLoadOk, false); false
                      ),
                      Set(varU008ValvesLoadOk, true);
                      IfError(
                          ClearCollect(colU008PendingValveRows, Filter('U008 Valve Answers', 'Impact Item Key' = k)); true,
                          Set(varU008ValvesLoadOk, false); false
                      ),
                      Set(varU008DefectsLoadOk, true);
                      IfError(
                          ClearCollect(colU008PendingDefectRows, Filter('U008 Defect Answers', 'Impact Item Key' = k)); true,
                          Set(varU008DefectsLoadOk, false); false
                      )
                  );
                  If(varU008HeaderLoadOk && varU008BankLoadOk && varU008QuestionsLoadOk && varU008ValvesLoadOk && varU008DefectsLoadOk,
                      // Build the whole merged answer set before changing live collections.
                      Set(varSpinnerText, "Preparing inspection...");
                      If(IfError(
                              ClearCollect(colU008PendingAnswers, InitializeU008Collections(nfU008SavedValves, nfU008SavedDefects, nfU008Source)); true,
                              false
                          ),
                          ClearCollect(colU008PendingShadow, ForAll(colU008PendingAnswers As r, {Key: r.RowKey, Sig: nfU008RowSig(r)}));
                          ClearCollect(colU008Bank, colU008PendingBank);
                          ClearCollect(colU008Questions, colU008PendingQuestions);
                          Set(varU008QuestionsLoaded, true);
                          ClearCollect(colU008SavedValveRows, colU008PendingValveRows);
                          ClearCollect(colU008SavedDefectRows, colU008PendingDefectRows);
                          ClearCollect(colU008Answers, colU008PendingAnswers);
                          ClearCollect(colU008Shadow, colU008PendingShadow);
                          Set(varU008RecordKey, k);
                          Set(varU008HeaderRecord, varU008PendingHeader);
                          Set(varU008HasHeader, !IsBlank(varU008HeaderRecord));
                          Set(varU008InspectingActivity, Coalesce(varU008HeaderRecord.'Inspecting Activity', ""));
                          Set(varU008Attested, varU008HeaderRecord.'Form Status' = "Completed");
                          Set(varU008AttestationDate, Coalesce(varU008HeaderRecord.'Attestation Date', ""));
                          Set(varU008AttestedBy, Coalesce(varU008HeaderRecord.'Attested By', ""));
                          Set(varU008LoadedShipName, nfShipName);
                          Set(varU008Dirty, false);
                          Set(varU008RecordIsWorking, nfInWorkingStatus);
                          Set(varU008ReopenStatusAllowed,
                              nfRecordItem.'Impact Item Location Status' = 'Impact Item Location Status Choices'.Working
                              || nfRecordItem.'Impact Item Location Status' = 'Impact Item Location Status Choices'.'Certify Completion');
                          Set(varU008DopInspection, nfRecordItem.'U008 DOP Inspection');
                          Set(varU008ImpactNumber, Text(nfRecordItem.'Impact Item Number'));
                          Set(varU008ImpactGuid, nfRecordItem.'PK - URO Impact Item');
                          Set(varU008MrcNumber, Text(nfRecordItem.'URO MRC'.'URO MRC Number'));
                          Set(varU008HeaderText, $"{nfRecordItem.'Impact Item Number'} : USS {nfShip.'Ship Name'} ({nfShip.'Ship Symbol'} {nfShip.'Ship Number'}) URO/MRC: {nfRecordItem.'URO MRC'.'URO MRC Number'} {If(
          nfIsTester,
          " " & visibleTrigger & " Status: " & nfRecordItem.'Impact Item Location Status'
      )}");
                          Set(varU008LoadOk, true);
                          Set(varU008LoadFailed, false)
                      )
                  )
              );
              If(!varU008LoadOk,
                  nfSendToast("Load failed", "The form could not be fully loaded. Previous local answers were kept read-only. Use Retry load when the connection is available.", 10000, "Error")
              )
          )
      };
      LoadU008Form():Void = {
          Set(varSpinnerText, "Loading inspection...");
          Set(varSpinner, true);
          IfError(
          Set(varU008ScenarioOpen, false);
          Set(varU008ScenarioText, "");
          Set(varU008ScenarioPrompt, "");
          If(varU008RecordKey <> Text(nfRecordItem.'PK - URO Impact Item'), Set(varSelectedShipName, ""));
          Set(varU008PreviousClassMod, varU008ClassMod);
          Set(varU008ClassMod, ResolveU008ClassMod(Text(nfShip.'Ship Class'), Text(nfShip.'Ship Name'), Text(nfShip.'Ship Number')));
          ReloadU008Answers();
          If(varU008LoadOk,
              Clear(colU008SaveErrors);
              ClearCollect(colU008Systems, {Prefix: "All"});
              Collect(colU008Systems, ForAll(
                  SortByColumns(Distinct(ForAll(Filter(colU008Answers, 'Pair Order' = 0) As v,
                      nfU008SysPrefix(v.'Valve Ident')), Value), "Value", SortOrder.Ascending) As p,
                  {Prefix: p.Value}));
              Set(varU008Search, "");
              Set(varU008SysFilter, "All");
              Set(varU008GroupFilter, "All");
              If(IsEmpty(Filter(colU008Answers, 'Pair Order' = 0)),
                  nfSendToast("No valves loaded", "This ship's class has no equipment-guide valves.", 5000, "Warning")),
              // Restore the displayed ship when a ship-change load fails.
              Set(varSelectedShipName, varU008LoadedShipName);
              Set(varU008ClassMod, varU008PreviousClassMod)
          );
          true,
          Set(varU008LoadOk, false);
          Set(varU008LoadFailed, true);
          Set(varU008RecordIsWorking, false);
          nfSendToast("Loading interrupted", "The inspection could not finish loading. Your retained local answers are read-only; retry loading when the connection is available.", 8000, "Error"); false
          );
          Set(varSpinner, false)
      };
      // ---------------------------------------------------------------------------
      // 6.5 INSPECTOR-ADDED VALVE (2026-08-26, decision: bank-scoped)
      //
      // A valve the inspector adds from the picker becomes a NEW U008 Equipment
      // Guide row for the LOADED MOD, applicable to the LOADED HULL ONLY:
      //   Applicability = "<Ship Symbol><hull> only"  e.g. "SSN784 only"
      // which the generic "<symbol><hull> only" rule in nfU008InitialApplicability
      // resolves - so the valve appears in the picker for this hull on every
      // future inspection (periodicity is 5-13 years) and never for another hull.
      // Key = "M<mod> X<GUID>"; independent clients allocate collision-resistant
      // identifiers without a race-prone Max + 1 query or two-digit suffix limit. Remarks carry an audit marker. The new row is appended to
      // the in-memory bank, to colU008Answers as a virgin valve row ALREADY IN THE
      // WORKLIST (its shadow entry is missing, so the next save creates its
      // U008 Valve Answer row), and its system prefix joins the filter chips.
      // Requires Create privilege on U008 Equipment Guide for the inspector role.
      // Returns false (with a toast) when the write fails.
      // ---------------------------------------------------------------------------
      AddU008CustomValve(
          valveIdent: Text,
          valveType: Text,
          size: Text,
          wbs: Text,
          gc: Text,
          location: Text,
          periodicity: Text,
          valveGroup: Text,
          dssSoc: Text,
          remarks: Text
      ): Boolean =
      {
          If(!nfU008CanEdit || nfModNumber = 0 || !IsMatch(Upper(Trim(Coalesce(Text(nfShip.'Ship Symbol'), ""))), "SSN|SSGN|SSBN") || IfError(Value(nfShip.'Ship Number'), 0) <= 0,
              nfSendToast("Cannot add valve", "Select a supported ship with a valid symbol and hull number, and confirm this inspection is editable.", 6000, "Error"); false,

          Set(varSpinnerText, "Adding valve...");
          Set(varSpinner, true);
          With({addSucceeded: IfError(
          With(
              {
                  modText: Text(nfModNumber),
                  hull: Coalesce(
                      Value(nfShip.'Ship Number'),
                      0
                  ),
                  symbol: Upper(Trim(Coalesce(Text(nfShip.'Ship Symbol'), "")))
              },
              With(
                  {
                      keyPrefix: "M" & modText & " X",
                      applic: symbol & Text(hull) & " only",
                      marker: $"INSPECTOR-ADDED {Text(
                          Today(),
                          "yyyy-mm-dd"
                      )} by {nfU008SignName} ({nfRecordItem.'Impact Item Number'})"
                  },
                  With(
                      {
                          customSuffix: Substitute(Text(GUID()), "-", "")
                      },
                      IfError(
                          With(
                              {
                                  newRow: Patch(
                                      'U008 Equipment guides',
                                      Defaults('U008 Equipment guides'),
                                      {
                                          MOD_OrderNumber: keyPrefix
                                              & customSuffix,
                                          OrderNumber: "X"
                                              & customSuffix,
                                          UROMOD: modText,
                                          Group: valveGroup,
                                          'Valve Ident': valveIdent,
                                          Type: valveType,
                                          Size: size,
                                          'WBS/ESWBS/FGC/SWAB': wbs,
                                          'GC/MRN': gc,
                                          Location: location,
                                          Periodicity: periodicity,
                                          Applicability: applic,
                                          'DSS-SOC': dssSoc,
                                          Remarks: If(
                                              IsBlank(
                                                  Trim(remarks)
                                              ),
                                              marker,
                                              marker
                                                  & " - "
                                                  & Trim(remarks)
                                          ),
                                          'URO Change Number': 209
                                      }
                                  )
                              },

                              Set(varSpinnerText, "Adding valve · Updating worklist...");
                              Collect(
                                  colU008Bank,
                                  newRow
                              );

                              Collect(
                                  colU008Answers,
                                  {
                                      RowIndex: 0,
                                      GroupKey: newRow.MOD_OrderNumber,
                                      RowKey: newRow.MOD_OrderNumber,
                                      'Pair Order': 0,
                                      'Valve Ident': valveIdent,
                                      Group: valveGroup,
                                      Type: valveType,
                                      Size: size,
                                      'WBS/ESWBS/FGC/SWAB': wbs,
                                      'GC/MRN': gc,
                                      Location: location,
                                      Periodicity: periodicity,
                                      Applicability: applic,
                                      'DSS-SOC': dssSoc,
                                      'EGL Remarks': newRow.Remarks,

                                      'Applicability State': nfU008InitialApplicability(
                                          applic
                                      ),
                                      'Applicability Reason': "",

                                      'In Sample': If(
                                          valveGroup = "2",
                                          "Pending",
                                          "Yes"
                                      ),
                                      'In Worklist': "Yes",

                                      'As Found Cat': "",
                                      'CRES Liner': "",
                                      'Visual Defects': "",
                                      'DRF Required': "",
                                      'RFI Replaced': "",
                                      'Pre-repair Insp': "",
                                      'RFI Program': "",
                                      'RFI Program Other': "",
                                      'RFI Pool Serial': "",
                                      'Shipped To DOP': "",
                                      'Final Cat': "",
                                      DOI: "",
                                      Remarks: "",
                                      'DRF Remarks': "",
                                      'Validated Date': "",
                                      Submitted: "",
                                      'Sketch File Link': "",

                                      'Defect Location': "",
                                      'Located On': "",
                                      'Defect CRES Liner': "",
                                      'Pre B': "",
                                      'Pre C': "",
                                      'Pre Pct': "",
                                      'Pre Cat': "",
                                      'Pre Method': "",
                                      'Pre Needs Remarks Override': "",
                                      'Pre Defect Remarks': "",
                                      'Reinst B': "",
                                      'Reinst C': "",
                                      'Reinst Pct': "",
                                      'Reinst Cat': "",
                                      'Reinst Repair Method': "",
                                      'Reinst Defect Remarks': "",

                                      'Pre Inspector Name': "",
                                      'Pre Shop': "",
                                      'Pre Badge Number': "",
                                      'Pre Signature': "",
                                      'Pre Signature Date': "",
                                      'Reinst Inspector Name': "",
                                      'Reinst Shop': "",
                                      'Reinst Badge Number': "",
                                      'Reinst Signature': "",
                                      'Reinst Signature Date': ""
                                  }
                              );

                              If(
                                  IsBlank(
                                      LookUp(
                                          colU008Systems,
                                          Prefix = nfU008SysPrefix(
                                              valveIdent
                                          )
                                      )
                                  ),
                                  Collect(
                                      colU008Systems,
                                      {
                                          Prefix: nfU008SysPrefix(
                                              valveIdent
                                          )
                                      }
                                  )
                              );

                              Set(
                                  varU008Dirty,
                                  true
                              );

                              true
                          ),

                          nfSendToast(
                              "Add valve failed",
                              "The valve could not be added to the Equipment Guide. Check Create permission on U008 Equipment Guide. Nothing was changed.",
                              7000,
                              "Error"
                          );

                          false
                      )
                  )
              )
          ),
              nfSendToast("Add valve interrupted", "Check the Equipment Guide before retrying; the valve may have been created. Your existing answers were kept.", 7000, "Error"); false
          )},
              Set(varSpinner, false);
              addSucceeded
          )
          )
      };
      // ---------------------------------------------------------------------------
      // 7. RECOVERABLE MULTI-ROW SAVE (not a server transaction)
      //
      // 1. Upsert the ONE header row (create on first save).
      // 2. Patch every valve row whose signature changed since the shadow was
      //    snapshotted (create the U008 Valve Answer row on first touch).
      // 3. Retain returned valve identities for parenting and retry.
      // 4. Patch every changed defect row. Measurements write as DECIMALS
      //    (2026-08-25): typed text parses via nfU008ParseMeasure (None / exact
      //    N/A -> 0; quotes, %, fractions parse; invalid input blocks saving);
      //    the Pct column stores the EFFECTIVE percent (override else B/C x 100).
      // 5. Delete saved defect rows that no longer exist locally (remove /
      //    renumber falls out of the key-based diff naturally).
      // 6. Publish completion last; snapshot locally only after full success.
      //    Retain successful Patch records for retry. Server uniqueness is still
      //    required to guarantee identity across simultaneous clients.
      // ---------------------------------------------------------------------------
      // Explicit header-only reopening: keep all valve/defect data and section signatures.
      // Existing child Submitted flags describe the prior submission; header status/count
      // govern final completion. The next final submission recalculates those flags.
      ReopenU008Inspection():Boolean = {
          Set(varU008ReopenOk, false);
          If(!varSpinner && !varU008LoadFailed && varU008Attested
              && !IsBlank(varU008RecordKey)
              && varU008RecordKey = Text(nfRecordItem.'PK - URO Impact Item'),
              Set(varSpinnerText, "Reopening inspection...");
              Set(varSpinner, true);
              IfError(
                  With({impactPk: nfRecordItem.'PK - URO Impact Item'},
                      Refresh('URO Impact Items');
                      With({savedImpact: LookUp('URO Impact Items', 'PK - URO Impact Item' = impactPk)},
                          Set(varU008ReopenStatusAllowed, !IsBlank(savedImpact)
                              && (savedImpact.'Impact Item Location Status' = 'Impact Item Location Status Choices'.Working
                                  || savedImpact.'Impact Item Location Status' = 'Impact Item Location Status Choices'.'Certify Completion'));
                          If(!varU008ReopenStatusAllowed,
                              nfSendToast("Cannot reopen inspection", "The Impact Item must be in Working or Certify Completion status. The final attestation was kept.", 7000, "Warning"),
                      With({saved: LookUp('U008 Inspections',
                          'URO Impact Item'.'PK - URO Impact Item' = impactPk)},
                          If(IsBlank(saved) || saved.'Form Status' <> "Completed",
                              Set(varU008LoadFailed, true);
                              nfSendToast("Inspection changed", "The saved inspection is no longer Completed or could not be found. Use Retry load before editing.", 7000, "Warning"),
                              With({reopened: Patch('U008 Inspections', saved, {
                                  'Form Status': "In Progress",
                                  Attestation: "",
                                  'Attested By': "",
                                  'Attestation Date': "",
                                  'Submitted Valve Count': 0
                              })},
                                  Set(varU008HeaderRecord, reopened);
                                  Set(varU008Attested, false);
                                  Set(varU008AttestedBy, "");
                                  Set(varU008AttestationDate, "");
                                  Set(varU008ReopenOk, true);
                                  nfSendToast("Inspection reopened", "The final attestation was removed. Valve answers and individual signatures were kept. Reopen validated valves before correcting them, then validate and submit again.", 8000, "Success")
                              )
                          )
                      )
                          )
                      )
                  ); true,
                  nfSendToast("Reopening not confirmed", "The saved status could not be confirmed. Use Retry load to check it before retrying. Your valve answers were kept.", 8000, "Error");
                  Set(varU008LoadFailed, true);
                  false
              );
              Set(varSpinner, false),
              nfSendToast("Cannot reopen inspection", "Load the completed inspection before reopening it. Its Impact Item must be in Working or Certify Completion status.", 7000, "Warning")
          );
          varU008ReopenOk
      };

      SaveU008WithMessage(actionText:Text):Boolean =
      {
          Set(varU008SaveOk, false);
          IfError(

          Set(
              varSpinner,
              true
          );
          Set(
              varSpinnerText,
              actionText & "..."
          );
          Set(
              varU008SaveOk,
              false
          );

          Clear(colU008SaveErrors);
          If(varU008Attested && !nfU008CanSubmit,
              Collect(colU008SaveErrors, {Key: "INCOMPLETE_INSPECTION"});
              nfSendToast("Inspection not complete", "Enter Inspecting Activity, resolve pending decisions, and complete and validate every in-scope worklist valve before final submission.", 7000, "Warning")
          );
          If(varU008LoadFailed || !nfInWorkingStatus || IsBlank(varU008RecordKey)
              || varU008RecordKey <> Text(nfRecordItem.'PK - URO Impact Item'),
              Collect(colU008SaveErrors, {Key: "READ_ONLY"});
              nfSendToast("Cannot save", "Load an editable inspection before saving. Your local answers were kept.", 6000, "Error")
          );


          // Reject invalid text before any remote write; keep all original input for correction.
          If(
              nfU008UnparsedMeasureCount > 0,
              Collect(colU008SaveErrors, {Key: "MEASUREMENTS"});
              nfSendToast(
                  "Invalid measurements",
                  $"{nfU008UnparsedMeasureCount} defect row(s) contain invalid or negative measurements and cannot be saved. Your entries have been kept; correct them before saving. Use plain numbers, None or N/A. Put footnotes in Remarks.",
                  7000,
                  "Warning"
              )
          );

          // -----------------------------------------------------------------------
          // 1. Upsert the inspection header
          // -----------------------------------------------------------------------
          If(IsEmpty(colU008SaveErrors),
              Set(varSpinnerText, actionText & " · Checking inspection...");
              Set(varU008HeaderReadOk, IfError(
                  With({impactPk: nfRecordItem.'PK - URO Impact Item'},
                      With({h: LookUp('U008 Inspections',
                          'URO Impact Item'.'PK - URO Impact Item' = impactPk)},
                          Set(varU008HeaderRecord, h); true)
                  ), false));
              If(!varU008HeaderReadOk || varU008HeaderRecord.'Form Status' = "Completed",
                  Set(varU008LoadFailed, true);
                  Collect(colU008SaveErrors, {Key: "HEADER_STATE"});
                  nfSendToast("Inspection unavailable for saving", "The inspection could not be checked or is already completed. Keep this page open and verify the saved record before retrying.", 8000, "Warning")
              );
              If(IsEmpty(colU008SaveErrors),
          Set(varSpinnerText, actionText & " · Saving inspection details...");
          IfError(
              If(
                  IsBlank(varU008HeaderRecord),

                  With({savedHeader: Patch(
                          'U008 Inspections',
                          Defaults('U008 Inspections'),
                          {
                              ImpactItem_Ship_Availability: nfHeader,
                              'URO Impact Item': nfRecordItem,
                              'Class MOD': "M" & Text(nfModNumber),
                              'URO Change Number': "209",
                              'Form Status': "In Progress",
                              'Inspecting Activity': varU008InspectingActivity,
                              Attestation: "",
                              'Attested By': "",
                              'Attestation Date': "",
                              'Submitted Valve Count': 0
                          }
                      )},
                      Set(varU008HeaderRecord, savedHeader); true
                  ),

                  With({savedHeader: Patch(
                          'U008 Inspections',
                          varU008HeaderRecord,
                          {
                              ImpactItem_Ship_Availability: nfHeader,
                              'Class MOD': "M" & Text(nfModNumber),
                              'Form Status': "In Progress",
                              'Inspecting Activity': varU008InspectingActivity,
                              Attestation: "",
                              'Attested By': "",
                              'Attestation Date': "",
                              'Submitted Valve Count': 0
                          }
                      )},
                      Set(varU008HeaderRecord, savedHeader); true
                  )
              ),

              Collect(
                  colU008SaveErrors,
                  {
                      Key: "HEADER",
                      Message: FirstError.Message
                  }
              );

              nfSendToast(
                  "Header save failed",
                  "The inspection header could not be saved. Your local answers were preserved.",
                  6000,
                  "Error"
              );

              false
          )
          )
          );

          Set(
              varU008HasHeader,
              !IsBlank(varU008HeaderRecord)
          );

          // -----------------------------------------------------------------------
          // 2. Upsert changed valve rows
          // -----------------------------------------------------------------------
          If(
              IsEmpty(colU008SaveErrors),
              Set(varSpinnerText, actionText & " · Saving valve answers...");
              ForAll(
                  Filter(nfU008DirtyRows, 'Pair Order' = 0) As d,

                  IfError(
                      With(
                      {
                          ex: LookUp(colU008SavedValveRows, RowKey = d.RowKey)
                      },

                      IfError(
                          If(
                              IsBlank(ex),

                              With({saved: Patch(
                                  'U008 Valve Answers',
                                  Defaults('U008 Valve Answers'),
                                  {
                                      'U008 Inspection': varU008HeaderRecord,
                                      'Impact Item Key': varU008RecordKey,
                                      RowKey: d.RowKey,
                                      'Valve Ident': d.'Valve Ident',
                                      Group: d.Group,
                                      Type: d.Type,
                                      Size: d.Size,
                                      'WBS/ESWBS/FGC/SWAB': d.'WBS/ESWBS/FGC/SWAB',
                                      'GC/MRN': d.'GC/MRN',
                                      Location: d.Location,
                                      Periodicity: d.Periodicity,
                                      Applicability: d.Applicability,
                                      'DSS-SOC': d.'DSS-SOC',
                                      'EGL Remarks': d.'EGL Remarks',
                                      'Applicability State': d.'Applicability State',
                                      'Applicability Reason': d.'Applicability Reason',
                                      'In Sample': d.'In Sample',
                                      'In Worklist': d.'In Worklist',

                                      'As Found Cat': d.'As Found Cat',
                                      'CRES Liner': d.'CRES Liner',
                                      'Visual Defects': d.'Visual Defects',
                                      'DRF Required': d.'DRF Required',
                                      'RFI Replaced': d.'RFI Replaced',
                                      'Pre-repair Insp': d.'Pre-repair Insp',
                                      'RFI Program': d.'RFI Program',
                                      'RFI Program Other': d.'RFI Program Other',
                                      'RFI Pool Serial': d.'RFI Pool Serial',
                                      'Shipped To DOP': d.'Shipped To DOP',
                                      'Final Cat': d.'Final Cat',
                                      DOI: d.DOI,
                                      Remarks: d.Remarks,
                                      'DRF Remarks': d.'DRF Remarks',
                                      'Validated Date': d.'Validated Date',
                                      Submitted: d.Submitted,
                                      'Sketch File Link': d.'Sketch File Link',

                                      'Pre Inspector Name': d.'Pre Inspector Name',
                                      'Pre Shop': d.'Pre Shop',
                                      'Pre Badge Number': d.'Pre Badge Number',
                                      'Pre Signature': d.'Pre Signature',
                                      'Pre Signature Date': d.'Pre Signature Date',
                                      'Reinst Inspector Name': d.'Reinst Inspector Name',
                                      'Reinst Shop': d.'Reinst Shop',
                                      'Reinst Badge Number': d.'Reinst Badge Number',
                                      'Reinst Signature': d.'Reinst Signature',
                                      'Reinst Signature Date': d.'Reinst Signature Date'
                                  }
                              )},
                                  RemoveIf(colU008SavedValveRows, RowKey = d.RowKey);
                                  Collect(colU008SavedValveRows, saved);
                                  true
                              ),

                              With({saved: Patch(
                                  'U008 Valve Answers',
                                  ex,
                                  {
                                      'Valve Ident': d.'Valve Ident',
                                      Group: d.Group,
                                      Type: d.Type,
                                      Size: d.Size,
                                      'WBS/ESWBS/FGC/SWAB': d.'WBS/ESWBS/FGC/SWAB',
                                      'GC/MRN': d.'GC/MRN',
                                      Location: d.Location,
                                      Periodicity: d.Periodicity,
                                      Applicability: d.Applicability,
                                      'DSS-SOC': d.'DSS-SOC',
                                      'EGL Remarks': d.'EGL Remarks',
                                      'Applicability State': d.'Applicability State',
                                      'Applicability Reason': d.'Applicability Reason',
                                      'In Sample': d.'In Sample',
                                      'In Worklist': d.'In Worklist',

                                      'As Found Cat': d.'As Found Cat',
                                      'CRES Liner': d.'CRES Liner',
                                      'Visual Defects': d.'Visual Defects',
                                      'DRF Required': d.'DRF Required',
                                      'RFI Replaced': d.'RFI Replaced',
                                      'Pre-repair Insp': d.'Pre-repair Insp',
                                      'RFI Program': d.'RFI Program',
                                      'RFI Program Other': d.'RFI Program Other',
                                      'RFI Pool Serial': d.'RFI Pool Serial',
                                      'Shipped To DOP': d.'Shipped To DOP',
                                      'Final Cat': d.'Final Cat',
                                      DOI: d.DOI,
                                      Remarks: d.Remarks,
                                      'DRF Remarks': d.'DRF Remarks',
                                      'Validated Date': d.'Validated Date',
                                      Submitted: d.Submitted,
                                      'Sketch File Link': d.'Sketch File Link',

                                      'Pre Inspector Name': d.'Pre Inspector Name',
                                      'Pre Shop': d.'Pre Shop',
                                      'Pre Badge Number': d.'Pre Badge Number',
                                      'Pre Signature': d.'Pre Signature',
                                      'Pre Signature Date': d.'Pre Signature Date',
                                      'Reinst Inspector Name': d.'Reinst Inspector Name',
                                      'Reinst Shop': d.'Reinst Shop',
                                      'Reinst Badge Number': d.'Reinst Badge Number',
                                      'Reinst Signature': d.'Reinst Signature',
                                      'Reinst Signature Date': d.'Reinst Signature Date'
                                  }
                              )},
                                  RemoveIf(colU008SavedValveRows, RowKey = d.RowKey);
                                  Collect(colU008SavedValveRows, saved);
                                  true
                              )
                          ),

                          Collect(
                              colU008SaveErrors,
                              {
                                  Key: d.RowKey,
                                  Message: FirstError.Message
                              }
                          );

                          false
                      )
                  ),
                      Collect(colU008SaveErrors, {Key: d.RowKey, Message: FirstError.Message}); false
                  )
              )
          );

          // -----------------------------------------------------------------------
          // 3. Parent identities are retained from successful Patch calls.
          // -----------------------------------------------------------------------
          // 4. Upsert changed defect rows
          // -----------------------------------------------------------------------
          If(
              IsEmpty(colU008SaveErrors),
              Set(varSpinnerText, actionText & " · Saving defects...");
              ForAll(
                  Filter(nfU008DirtyRows, 'Pair Order' > 0) As d,

                  IfError(
                      With(
                      {
                          ex: LookUp(colU008SavedDefectRows, RowKey = d.RowKey),

                          // Lookup fields require a connected Dataverse record, not a
                          // collection copy whose entity metadata may be lost.
                          parent: With({itemKey: varU008RecordKey, parentKey: d.GroupKey},
                              LookUp('U008 Valve Answers', 'Impact Item Key' = itemKey && RowKey = parentKey)
                          )
                      },

                      If(IsBlank(parent),
                          Collect(colU008SaveErrors, {Key: d.RowKey}); false,
                      IfError(
                          If(
                              IsBlank(ex),

                              With({saved: Patch(
                                  'U008 Defect Answers',
                                  Defaults('U008 Defect Answers'),
                                  {
                                      'U008 Inspection': varU008HeaderRecord,
                                      'U008 Valve Answer': parent,
                                      'Impact Item Key': varU008RecordKey,
                                      RowKey: d.RowKey,
                                      'Pair Order': d.'Pair Order',
                                      'Valve Ident': d.'Valve Ident',
                                      'Defect Location': d.'Defect Location',
                                      'Defect CRES Liner': d.'Defect CRES Liner',
                                      'Located On': d.'Located On',

                                      'Pre B': nfU008ParseMeasure(d.'Pre B'),
                                      'Pre C': nfU008ParseMeasure(d.'Pre C'),
                                      'Pre Pct': nfU008DefectPct(
                                          d.'Pre B',
                                          d.'Pre C',
                                          d.'Pre Pct'
                                      ),
                                      'Pre Cat': d.'Pre Cat',
                                      'Pre Method': d.'Pre Method',
                                      'Pre Needs Remarks Override': d.'Pre Needs Remarks Override',
                                      'Pre Defect Remarks': d.'Pre Defect Remarks',

                                      'Reinst B': nfU008ParseMeasure(d.'Reinst B'),
                                      'Reinst C': nfU008ParseMeasure(d.'Reinst C'),
                                      'Reinst Pct': nfU008DefectPct(
                                          d.'Reinst B',
                                          d.'Reinst C',
                                          d.'Reinst Pct'
                                      ),
                                      'Reinst Cat': d.'Reinst Cat',
                                      'Reinst Repair Method': d.'Reinst Repair Method',
                                      'Reinst Defect Remarks': d.'Reinst Defect Remarks'
                                  }
                              )},
                                  RemoveIf(colU008SavedDefectRows, RowKey = d.RowKey);
                                  Collect(colU008SavedDefectRows, saved);
                                  true
                              ),

                              With({saved: Patch(
                                  'U008 Defect Answers',
                                  ex,
                                  {
                                      'Pair Order': d.'Pair Order',
                                      'Valve Ident': d.'Valve Ident',
                                      'Defect Location': d.'Defect Location',
                                      'Defect CRES Liner': d.'Defect CRES Liner',
                                      'Located On': d.'Located On',

                                      'Pre B': nfU008ParseMeasure(d.'Pre B'),
                                      'Pre C': nfU008ParseMeasure(d.'Pre C'),
                                      'Pre Pct': nfU008DefectPct(
                                          d.'Pre B',
                                          d.'Pre C',
                                          d.'Pre Pct'
                                      ),
                                      'Pre Cat': d.'Pre Cat',
                                      'Pre Method': d.'Pre Method',
                                      'Pre Needs Remarks Override': d.'Pre Needs Remarks Override',
                                      'Pre Defect Remarks': d.'Pre Defect Remarks',

                                      'Reinst B': nfU008ParseMeasure(d.'Reinst B'),
                                      'Reinst C': nfU008ParseMeasure(d.'Reinst C'),
                                      'Reinst Pct': nfU008DefectPct(
                                          d.'Reinst B',
                                          d.'Reinst C',
                                          d.'Reinst Pct'
                                      ),
                                      'Reinst Cat': d.'Reinst Cat',
                                      'Reinst Repair Method': d.'Reinst Repair Method',
                                      'Reinst Defect Remarks': d.'Reinst Defect Remarks'
                                  }
                              )},
                                  RemoveIf(colU008SavedDefectRows, RowKey = d.RowKey);
                                  Collect(colU008SavedDefectRows, saved);
                                  true
                              )
                          ),

                          Collect(
                              colU008SaveErrors,
                              {
                                  Key: d.RowKey,
                                  Message: FirstError.Message
                              }
                          );

                          false
                      )
                      )
                  ),
                      Collect(colU008SaveErrors, {Key: d.RowKey, Message: FirstError.Message}); false
                  )
              )
          );

          // -----------------------------------------------------------------------
          // 5. Delete removed defects using a frozen workset; cache each success.
          // -----------------------------------------------------------------------
          If(IsEmpty(colU008SaveErrors),
              Set(varSpinnerText, actionText & " · Removing deleted defects...");
              ClearCollect(colU008DeleteRows, Filter(colU008SavedDefectRows As saved,
                  IsBlank(LookUp(colU008Answers, RowKey = saved.RowKey))));
              ForAll(colU008DeleteRows As del,
                  IfError(
                      With({itemKey: varU008RecordKey, rowKeyText: del.RowKey},
                      With({present: LookUp('U008 Defect Answers',
                          'Impact Item Key' = itemKey && RowKey = rowKeyText)},
                          If(IsBlank(present),
                              RemoveIf(colU008SavedDefectRows, RowKey = del.RowKey); true,
                              With({removed: Remove('U008 Defect Answers', present)},
                                  RemoveIf(colU008SavedDefectRows, RowKey = del.RowKey); true
                              )
                          )
                      )
                      ),
                      Collect(colU008SaveErrors, {Key: del.RowKey, Message: FirstError.Message}); false
                  )
              )
          );

          // -----------------------------------------------------------------------
          // 6. Publish completion only after all answer writes/deletions succeeded.
          If(IsEmpty(colU008SaveErrors) && varU008Attested,
              Set(varSpinnerText, actionText & " · Finalizing inspection...");
              IfError(
                  With({savedHeader: Patch('U008 Inspections', varU008HeaderRecord, {
                      'Form Status': "Completed",
                      Attestation: "Inspector attests that the recorded conditions of every submitted (validated) valve are accurate.",
                      'Attested By': varU008AttestedBy,
                      'Attestation Date': varU008AttestationDate,
                      'Submitted Valve Count': CountRows(Filter(colU008Answers, 'Pair Order' = 0, Submitted = "Yes"))
                  })},
                      Set(varU008HeaderRecord, savedHeader); true
                  ),
                  Collect(colU008SaveErrors, {Key: "COMPLETION", Message: FirstError.Message}); false
              )
          );
          Set(varU008SaveOk, IsEmpty(colU008SaveErrors) && !IsBlank(varU008HeaderRecord));
          If(varU008SaveOk,
              Set(varSpinnerText, actionText & " · Finishing...");
              // Avoid destructive post-save reloading and extra network round trips.
              ClearCollect(colU008Shadow, ForAll(colU008Answers As r, {Key: r.RowKey, Sig: nfU008RowSig(r)}));
              // Remove successfully deleted rows from the local persistence cache.
              RemoveIf(colU008SavedDefectRows As s, IsBlank(LookUp(colU008Answers, RowKey = s.RowKey)));
              Set(varU008Dirty, false),
              Set(varU008Dirty, true);
              nfSendToast("Save incomplete", "Some changes may already be saved. Your local answers were kept. Retry Save Draft; completion was not confirmed.", 7000, "Error")
          );
              true,
              Set(varU008SaveOk, false);
              Set(varU008Dirty, true);
              Collect(colU008SaveErrors, {Key: "UNEXPECTED", Message: FirstError.Message});
              nfSendToast("Save interrupted", "Your local answers were kept. Some writes may have succeeded; retry Save Draft before leaving.", 7000, "Error");
              false
          );
          Set(varSpinner, false);
          varU008SaveOk
      };
      // Backward-compatible default for other app callers.
      SaveAndRecreateU008():Boolean = {
          SaveU008WithMessage("Saving draft")
      };
