          'DRF Required': Text,
          'RFI Replaced': Text,
          'Pre-repair Insp': Text,
          'RFI Program': Text,
          'RFI Program Other': Text,
          'RFI Pool Serial': Text,
          'Shipped To DOP': Text,
          'Final Cat': Text,
          DOI: Text,
          Remarks: Text,
          'DRF Remarks': Text,
          'Validated Date': Text,
          // per-valve Validate stamp (decision 2026-08-21)

          Submitted: Text,
          // "Yes" when part of the attested submission (partial-submit model, 2026-08-25)

          'Sketch File Link': Text,
          // SharePoint link of the uploaded DRF sketch (flow return; 2026-08-27)


          // DRF defect fields (defect rows) - one row carries BOTH conditions
      'Defect Location': Text,
          'Defect CRES Liner': Text,
          'Located On': Text,
          'Pre B': Text,
          'Pre C': Text,
          'Pre Pct': Text,
          // manual override; blank = computed from B/C

          'Pre Cat': Text,
          // A/B/C/D or SAT/UNSAT (CRES liner rows)

          'Pre Method': Text,
          // MM / UTM / VDE

          'Pre Needs Remarks Override': Text,
          'Pre Defect Remarks': Text,
          'Reinst B': Text,
          'Reinst C': Text,
          'Reinst Pct': Text,
          'Reinst Cat': Text,
          'Reinst Repair Method': Text,
          'Reinst Defect Remarks': Text,
          // None / Handwork / Mach / Weld / Epoxy / Dalic / free text


          // two independent signature blocks (valve rows with a DRF)
      'Pre Inspector Name': Text,
          'Pre Shop': Text,
          'Pre Badge Number': Text,
          'Pre Signature': Text,
          'Pre Signature Date': Text,
          'Reinst Inspector Name': Text,
          'Reinst Shop': Text,
          'Reinst Badge Number': Text,
          'Reinst Signature': Text,
          'Reinst Signature Date': Text
      });
      U008AnswersTableType := Type([U008AnswerRecordType]);
      // Shape of the bank rows handed to the initializer (nfU008Source).
      // MUST match nfU008Source's projection list exactly.
      U008SourceRecordType := Type({
          MOD_OrderNumber: Text,
          'Valve Ident': Text,
          Group: Text,
          Type: Text,
          Size: Text,
          'WBS/ESWBS/FGC/SWAB': Text,
          'GC/MRN': Text,
          Location: Text,
          Periodicity: Text,
          Applicability: Text,
          'DSS-SOC': Text,
          Remarks: Text
      });
      U008SourceTableType := Type([U008SourceRecordType]);
      // Shape of a SAVED VALVE ANSWER row handed to the initializer - MUST match
      // the nfU008SavedValves projection AND the U008 Valve Answer table columns.
      U008SavedValveType := Type({
          RowKey: Text,
          'Valve Ident': Text,
          Group: Text,
          Type: Text,
          Size: Text,
          'WBS/ESWBS/FGC/SWAB': Text,
          'GC/MRN': Text,
          Location: Text,
          Periodicity: Text,
          Applicability: Text,
          'DSS-SOC': Text,
          'EGL Remarks': Text,
          'Applicability State': Text,
          'Applicability Reason': Text,
          'In Sample': Text,
          'In Worklist': Text,
          'As Found Cat': Text,
          'CRES Liner': Text,
          'Visual Defects': Text,
          'DRF Required': Text,
          'RFI Replaced': Text,
          'Pre-repair Insp': Text,
          'RFI Program': Text,
          'RFI Program Other': Text,
          'RFI Pool Serial': Text,
          'Shipped To DOP': Text,
          'Final Cat': Text,
          DOI: Text,
          Remarks: Text,
          'DRF Remarks': Text,
          'Validated Date': Text,
          Submitted: Text,
          'Sketch File Link': Text,
          'Pre Inspector Name': Text,
          'Pre Shop': Text,
          'Pre Badge Number': Text,
          'Pre Signature': Text,
          'Pre Signature Date': Text,
          'Reinst Inspector Name': Text,
          'Reinst Shop': Text,
          'Reinst Badge Number': Text,
          'Reinst Signature': Text,
          'Reinst Signature Date': Text
      });
      U008SavedValveTableType := Type([U008SavedValveType]);
      // Shape of a SAVED DEFECT ANSWER row - MUST match nfU008SavedDefects and the
