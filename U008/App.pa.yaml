      // (quotes / % / fractions / None / N-A all resolve to numbers) and formats
      // the numbers back to text at load. Blank = not measured.
      U008SavedDefectType := Type({
          RowKey: Text,
          'Pair Order': Number,
          'Valve Ident': Text,
          'Defect Location': Text,
          'Defect CRES Liner': Text,
          'Located On': Text,
