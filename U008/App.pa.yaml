          InSample: Number,
          MinRequired: Number,
          Escalated: Boolean
      });
      // ---------------------------------------------------------------------------
      // 3.2 TABLE PERSISTENCE PLUMBING (v3 refactor 2026-08-25 - JSON retired)
      //
      // 2026-08-27: 'Sketch File Link' (U008 Valve Answer, text) carries the
