                  ""
              ),
              'EGL Remarks': Coalesce(
                  s.'EGL Remarks',
                  ""
              ),
              'Applicability State': Coalesce(
                  s.'Applicability State',
                  ""
              ),
              'Applicability Reason': Coalesce(
                  s.'Applicability Reason',
                  ""
              ),
              'In Sample': Coalesce(
                  s.'In Sample',
                  ""
              ),
              'In Worklist': Coalesce(
                  s.'In Worklist',
                  ""
              ),
              'As Found Cat': Coalesce(
                  s.'As Found Cat',
                  ""
              ),
              'CRES Liner': Coalesce(
                  s.'CRES Liner',
                  ""
              ),
              'Visual Defects': Coalesce(
                  s.'Visual Defects',
                  ""
              ),
              'DRF Required': Coalesce(
                  s.'DRF Required',
                  ""
              ),
              'Pre-repair Insp': Coalesce(
                  s.'Pre-repair Insp',
                  ""
              ),
              'RFI Replaced': Coalesce(
                  s.'RFI Replaced',
                  ""
              ),
              'RFI Program': Coalesce(
                  s.'RFI Program',
                  ""
              ),
              'RFI Program Other': Coalesce(
                  s.'RFI Program Other',
                  ""
              ),
              'RFI Pool Serial': Coalesce(
                  s.'RFI Pool Serial',
                  ""
              ),
              'Shipped To DOP': Coalesce(
                  s.'Shipped To DOP',
                  ""
              ),
              'Final Cat': Coalesce(
