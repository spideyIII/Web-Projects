                                Set(varSpinnerText, "Uploading sketch...");
                                IfError(
                                    With({r: LookUp(colU008Answers, RowKey = _u008RowKey), f: First(attU008Sketch.Attachments)},
                                        If(!IsBlank(r) && !IsEmpty(attU008Sketch.Attachments),
                                            If(CountRows(Split(f.Name, ".")) < 2 || IsBlank(Last(Split(f.Name, ".")).Value),
                                                nfSendToast("File extension required", "Select a file with its original extension, such as .pdf or .png.", 6000, "Warning"),
                                                With({fileName: r.'Valve Ident' & " Sketch." & Last(Split(f.Name, ".")).Value},
                                                    If(varU008PendingUploadKey <> r.RowKey || varU008PendingUploadName <> f.Name || IsBlank(varU008PendingUploadLink),
                                                        Set(varU008PendingUploadKey, "");
                                                        Set(varU008PendingUploadLink, "");
                                                        IfError(
                                                            With({upload: U003UploadReportSketchForDefectItem.Run(
                                                                varU008ImpactGuid, fileName, r.'Valve Ident',
                                                                {file: {contentBytes: f.Value, name: fileName}})},
                                                                If(IsBlank(upload.sketchfilelink),
                                                                    nfSendToast("Upload failed", "The flow returned no sketch link. Your attachment was kept; check the flow run history before retrying.", 7000, "Error"),
                                                                    Set(varU008PendingUploadKey, r.RowKey);
                                                                    Set(varU008PendingUploadName, f.Name);
                                                                    Set(varU008PendingUploadLink, upload.sketchfilelink)
                                                                ); true
                                                            ),
                                                            nfSendToast("Upload interrupted", "Your attachment was kept. Check the flow run history before retrying; a file may already have uploaded.", 7000, "Error"); false
                                                        )
                                                    );
                                                    If(varU008PendingUploadKey = r.RowKey && !IsBlank(varU008PendingUploadLink),
                                                        Patch(colU008Answers, r, {'Sketch File Link': varU008PendingUploadLink});
                                                        Set(varU008Dirty, true);
                                                        If(SaveU008WithMessage("Saving sketch link"),
                                                            UpdateContext({_u008AttachOpen: false}); Reset(attU008Sketch);
                                                            Set(varU008PendingUploadKey, ""); Set(varU008PendingUploadName, ""); Set(varU008PendingUploadLink, "");
                                                            nfSendToast("Sketch uploaded", "Sketch uploaded and linked to this valve's Data Report Form.", 4000, "Success"),
                                                            nfSendToast("Form not saved", "The uploaded link and attachment were kept. Retry Upload to save the existing link, or use Save Draft.", 7000, "Warning")
                                                        )
                                                    )
                                                )
                                            )
                                        ); true
                                    ),
                                    nfSendToast("Upload interrupted", "Your local answers and attachment were kept. Retry saving before leaving.", 7000, "Error"); false
                                );
                                Set(varSpinner, false)
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Upload"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =110
