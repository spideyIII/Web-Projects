                                    },

                                    If(
                                        !IsBlank(valve),
                                        CommitU008ScreeningValues(_u008RowKey, LookUp(colU008Answers, RowKey = _u008RowKey).DOI, txtU008RfiOther.Text, txtU008RfiSerial.Text, txtU008DrfRemarks.Text)
                                    );

                                    If(
                                        !IsBlank(defect),
                                        CommitU008DefectValues(_u008DefKey, _u008DrfCond, txtU008StripLoc.Text, "", false, txtU008StripB.Text, txtU008StripC.Text, nfU008PctOverride(
                                                        txtU008StripB.Text,
                                                        txtU008StripC.Text,
                                                        txtU008StripPct.Text
                                                    ), _u008DefCat, If(_u008DrfCond = "Pre", _u008DefMethod, txtU008StripRepair.Text))
                                    );

                                    UpdateContext({_u008DefKey: "", _u008DefNew: false});

                                    With(
                                        { v2: LookUp(colU008Answers, RowKey = _u008RowKey) },

                                        If(
                                            !nfU008ValveComplete(_u008RowKey),
                                            nfSendToast(
                                                "Validation blocked",
                                                $"{nfU008ValveMissing(_u008RowKey, true)} required item(s) remain on this valve. Fill the missing items and validate again.",
                                                5000,
                                                "Warning"
                                            ),
                                            Patch(
