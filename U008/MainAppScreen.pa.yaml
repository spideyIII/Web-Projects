                              Fill: =thmU008.InfoBg
                              FillPortions: =0
                              Height: =140
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =140
                              PaddingBottom: =12
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =12
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                            Children:
                              - lblU008CriteriaText:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =thmU008.TextBody
                                    LayoutMinWidth: =96
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =13
                                    Text: =nfU008CriteriaText(_u008RowKey)
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =96
                        - vctrU008CriteriaNotes:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =thmU008.SurfaceAlt
                              FillPortions: =0
                              Height: =96
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =96
                              PaddingBottom: =10
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =10
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                            Children:
                              - lblU008CriteriaLegend:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =thmU008.TextBody
                                    LayoutMinWidth: =96
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =12
                                    Text: ="Methods of inspection - MM = Mechanical Measurement, UTM = Ultrasonic Measurement, VDE = Visual Depth Estimate."
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =96
                              - lblU008CriteriaReinst:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =thmU008.TextMuted
                                    LayoutMinWidth: =96
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Size: =12
                                    Text: ="Reinstalled condition - epoxy or electroplating (Dalic) repairs cannot restore Category A unless NAVSEA-approved (Reporting 8.A.(3)); a valve left in service in Category B or C requires a Major DFS (General Note 9); RFI-replaced valves are Category A unless receipt OQE says less (7.A.(4))."
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =96
                        - lblU008CriteriaSuggest:
                            Control: ModernText@1.0.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =thmU008.Primary
                              FontWeight: =FontWeight.Semibold
                              LayoutMinWidth: =96
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Size: =12
                              Text: |-
                                =With(
                                    {
                                        sp: nfU008ActivePreSuggested,
                                        sr: nfU008ActiveReinstSuggested
                                    },
                                    If(sp = "" && sr = "",
                                        "No category suggestion yet - it appears on the Screening tab once every defect row of a condition resolves to a % of wall reduction.",
                                        $"Suggested from the DRF measurements:{If(sp = "", "", $"  As Found {sp}")}{If(sr = "", "", $"  ·  Final {sr}")}. Apply it from the Screening tab - inspector judgment prevails."))
                              VerticalAlign: =VerticalAlign.Top
                              Width: =96
                  - hctrU008ModalFooter:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =44
                        PaddingLeft: =8
                        PaddingRight: =8
                      Children:
                        - btnU008ResetValve:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Reset every field of this valve to blank"
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Subtle
                              Color: =thmU008.DangerText
                              DisplayMode: |-
                                =If(
                                    nfU008CanEdit && nfU008ActiveValve.'Applicability State' = "Applicable",
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              FontWeight: =""
                              OnSelect: |-
                                =If(
                                    Confirm(
                                        "Reset this valve to blank? All screening answers, defect rows, DOI, remarks, BOTH signatures and the Validate stamp are cleared. Applicability and sample decisions are kept. This cannot be undone.",
                                        {Title: "Reset Valve", ConfirmButton: "Reset", CancelButton: "Cancel"}
                                    ),
                                    RemoveIf(colU008Answers,
                                        GroupKey = _u008RowKey && 'Pair Order' > 0);
                                    Patch(colU008Answers,
                                        LookUp(colU008Answers, RowKey = _u008RowKey),
                                        {
                                            'As Found Cat': "", 'CRES Liner': "",
                                            'Visual Defects': "", 'DRF Required': "",
                                            'RFI Replaced': "", 'RFI Program': "",
                                            'RFI Program Other': "", 'RFI Pool Serial': "",
                                            'Shipped To DOP': "", 'Final Cat': "",
                                            DOI: "", Remarks: "", 'DRF Remarks': "",
                                            'Validated Date': "", Submitted: "",
                                            'Pre Inspector Name': "", 'Pre Shop': "",
                                            'Pre Badge Number': "", 'Pre Signature': "",
                                            'Pre Signature Date': "",
                                            'Reinst Inspector Name': "", 'Reinst Shop': "",
                                            'Reinst Badge Number': "", 'Reinst Signature': "",
                                            'Reinst Signature Date': ""
                                        });
                                    UpdateContext({
                                        _u008DefKey: "",
                                        _u008ModalView: "Screening",
                                        _u008DrfCond: "Pre"});
                                    Set(varU008Dirty, true);
                                    nfSendToast(
                                    "Valve reset",
                                    "Valve reset to blank - the reset is kept on the next save.",
                                    4000,
                                    "Warning"
                                )
                                )
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Reset"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =70
                        - btnMissingItems:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: |-
                                =With(
                                    {missingCount: nfU008ActiveValidation.TotalMissing},
                                    If(
                                    missingCount > 0,
                                    $"Show {missingCount} missing required item(s)",
                                    "Check this valve for missing required items"
                                    )
                                )
                              Appearance: =ButtonAppearance.Subtle
                              Color: |-
                                =With(
                                    {missingCount: nfU008ActiveValidation.TotalMissing},
                                    If(
                                    missingCount > 0,
                                    thmU008.WarnText,
                                    thmU008.SuccessText
                                    )
                                )
                              Icon: |-
                                =With(
                                    {missingCount: nfU008ActiveValidation.TotalMissing},
                                    If(
                                    missingCount > 0,
                                    "Warning",
                                    "Checkmark"
                                    )
                                )
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =With(
                                    {
                                        v: LookUp(
                                            colU008Answers,
                                            RowKey = _u008RowKey
                                        ),
                                        defects: Filter(
                                            colU008Answers,
                                            GroupKey = _u008RowKey,
                                            'Pair Order' > 0
                                        )
                                    },
                                    Clear(colU008MissingItems);

                                    // ------------------------------------------------------------
                                    // Applicability and inspection-sample decisions
                                    // ------------------------------------------------------------
                                    If(
                                        v.'Applicability State' = "Pending",
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Decision",
                                                FieldLabel: "Applicability State",
                                                Detail: "Resolve the applicability decision for this valve.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 10
                                            }
                                        )
                                    );

                                    If(
                                        v.'In Sample' = "Pending",
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Decision",
                                                FieldLabel: "In Sample",
                                                Detail: "Mark this valve In Sample or Not in Sample.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 20
                                            }
                                        )
                                    );

                                    // ------------------------------------------------------------
                                    // Screening fields
                                    // ------------------------------------------------------------
                                    If(
                                        IsBlank(v.'As Found Cat'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "As Found Category",
                                                Detail: "Select the valve's as-found category.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 100
                                            }
                                        )
                                    );

                                    If(
                                        IsBlank(v.'CRES Liner'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "CRES Liner",
                                                Detail: "Select Yes or No.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 110
                                            }
                                        )
                                    );

                                    If(
                                        IsBlank(v.'Visual Defects'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "Visual Defects",
                                                Detail: "Select Yes or No.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 120
                                            }
                                        )
                                    );

                                    If(
                                        IsBlank(v.'DRF Required'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "DRF Required",
                                                Detail: "Select Yes or No.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 130
                                            }
                                        )
                                    );

                                    If(
                                        nfU008RfiApplies && IsBlank(v.'RFI Replaced'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "RFI Replaced",
                                                Detail: "Select whether the valve was replaced under RFI.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 140
                                            }
                                        )
                                    );

                                    If(
                                        nfU008RfiProgramRequired(_u008RowKey)
                                            && IsBlank(v.'RFI Program'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "RFI Program",
                                                Detail: "Select the applicable RFI program.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 150
                                            }
                                        )
                                    );

                                    If(
                                        nfU008RfiOtherRequired(_u008RowKey)
                                            && !nfAnswerProvided(v.'RFI Program Other'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "RFI Program Other",
                                                Detail: "Enter the program name because RFI Program is Other.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 160
                                            }
                                        )
                                    );

                                    If(
                                        nfU008RfiSerialRequired(_u008RowKey)
                                            && !nfAnswerProvided(v.'RFI Pool Serial'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "RFI Pool Serial",
                                                Detail: "Enter the required pool serial number.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 170
                                            }
                                        )
                                    );

                                    If(
                                        IsBlank(v.'Final Cat'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "Final Category",
                                                Detail: "Select the final category.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 180
                                            }
                                        )
                                    );

                                    If(
                                        !nfAnswerProvided(v.DOI),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Screening",
                                                FieldLabel: "Date of Inspection",
                                                Detail: "Enter the inspection date.",
                                                TargetView: "Screening",
                                                TargetCondition: "",
                                                DefectKey: "",
                                                SortOrder: 190
                                            }
                                        )
                                    );

                                    // ------------------------------------------------------------
                                    // DRF / defect requirements
                                    // ------------------------------------------------------------
                                    If(
                                        v.'DRF Required' = "Yes"
                                            && CountRows(defects) = 0,
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Pre-Repair DRF",
                                                FieldLabel: "Defect Row",
                                                Detail: "Add at least one defect row.",
                                                TargetView: "DRF",
                                                TargetCondition: "Pre",
                                                DefectKey: "",
                                                SortOrder: 300
                                            }
                                        )
                                    );

                                    // ------------------------------------------------------------
                                    // Pre-repair defect details
                                    //
                                    // Shared defect fields are listed only here:
                                    // Defect Location, Located On, and Defect CRES Liner.
                                    // ------------------------------------------------------------
                                    If(
                                        v.'DRF Required' = "Yes",
                                        ForAll(
                                            defects As d,

                                            If(
                                                !nfAnswerProvided(d.'Defect Location'),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Pre-Repair DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Defect Location",
                                                        Detail: "Enter the defect location.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Pre",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 300 + d.'Pair Order'
                                                    }
                                                )
                                            );

                                            If(
                                                !nfAnswerProvided(d.'Located On'),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Pre-Repair DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Located On",
                                                        Detail: "Select Body, Tailpiece, Cover, or enter Other.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Pre",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 305 + d.'Pair Order'
                                                    }
                                                )
                                            );

                                            If(
                                                If(v.'CRES Liner' = "Yes" || nfU008IsAide(v.'Valve Ident'),
                                                    IsBlank(nfU008ParseMeasure(d.'Pre B')) && IsBlank(nfU008ParseMeasure(d.'Pre Pct')),
                                                    nfU008NumericMeasureMissing(d.'Pre B', d.'Pre C', d.'Pre Pct')),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Pre-Repair DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Pre B or Pre Pct",
                                                        Detail: "For numeric categories enter Pre B and a positive Pre C, or a valid Pre Pct. CRES/AIDE entries retain their existing B-or-percent rule.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Pre",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 310 + d.'Pair Order'
                                                    }
                                                )
                                            );

                                            // Required only when the VALVE is CRES liner.
                                            If(
                                                v.'CRES Liner' = "Yes"
                                                    && !(
                                                        d.'Defect CRES Liner' in [
                                                            "Yes",
                                                            "No"
                                                        ]
                                                    ),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Pre-Repair DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Defect CRES Liner",
                                                        Detail: "Select Yes or No for this defect.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Pre",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 315 + d.'Pair Order'
                                                    }
                                                )
                                            );

                                            // SAT / UNSAT applies only when THIS specific defect is CRES liner.
                                            If(
                                                v.'CRES Liner' = "Yes"
                                                    && d.'Defect CRES Liner' = "Yes"
                                                    && !(
                                                        d.'Pre Cat' in [
                                                            "SAT",
                                                            "UNSAT"
                                                        ]
                                                    ),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Pre-Repair DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Pre Category",
                                                        Detail: "Select SAT or UNSAT for this CRES-liner defect.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Pre",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 320 + d.'Pair Order'
                                                    }
                                                )
                                            );

                                            // A-D applies to a non-CRES valve or a defect explicitly marked No.
                                            If(
                                                (
                                                    v.'CRES Liner' <> "Yes"
                                                        || d.'Defect CRES Liner' = "No"
                                                )
                                                && !(
                                                    d.'Pre Cat' in [
                                                        "A",
                                                        "B",
                                                        "C",
                                                        "D"
                                                    ]
                                                ),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Pre-Repair DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Pre Category",
                                                        Detail: "Select category A, B, C, or D.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Pre",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 320 + d.'Pair Order'
                                                    }
                                                )
                                            );

                                            If(
                                                !nfAnswerProvided(d.'Pre Method'),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Pre-Repair DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Pre Method",
                                                        Detail: "Select the inspection method.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Pre",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 330 + d.'Pair Order'
                                                    }
                                                )
                                            )
                                        )
                                    );

                                    // ------------------------------------------------------------
                                    // Reinstalled defect details
                                    //
                                    // Do not re-list Defect Location, Located On, or Defect CRES Liner.
                                    // They are shared fields and were checked above.
                                    // ------------------------------------------------------------
                                    If(
                                        v.'DRF Required' = "Yes"
                                            && nfU008ReinstRequired(_u008RowKey),
                                        ForAll(
                                            defects As d,

                                            If(
                                                If(v.'CRES Liner' = "Yes" || nfU008IsAide(v.'Valve Ident'),
                                                    IsBlank(nfU008ParseMeasure(d.'Reinst B')) && IsBlank(nfU008ParseMeasure(d.'Reinst Pct')),
                                                    nfU008NumericMeasureMissing(d.'Reinst B', d.'Reinst C', d.'Reinst Pct')),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Reinstalled DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Reinst B or Reinst Pct",
                                                        Detail: "For numeric categories enter Reinst B and a positive Reinst C, or a valid Reinst Pct. CRES/AIDE entries retain their existing B-or-percent rule.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Reinst",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 400 + d.'Pair Order'
                                                    }
                                                )
                                            );

                                            // SAT / UNSAT applies only when THIS specific defect is CRES liner.
                                            If(
                                                v.'CRES Liner' = "Yes"
                                                    && d.'Defect CRES Liner' = "Yes"
                                                    && !(
                                                        d.'Reinst Cat' in [
                                                            "SAT",
                                                            "UNSAT"
                                                        ]
                                                    ),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Reinstalled DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Reinst Category",
                                                        Detail: "Select SAT or UNSAT for this CRES-liner defect.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Reinst",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 410 + d.'Pair Order'
                                                    }
                                                )
                                            );

                                            // A-D applies to a non-CRES valve or a defect explicitly marked No.
                                            If(
                                                (
                                                    v.'CRES Liner' <> "Yes"
                                                        || d.'Defect CRES Liner' = "No"
                                                )
                                                && !(
                                                    d.'Reinst Cat' in [
                                                        "A",
                                                        "B",
                                                        "C",
                                                        "D"
                                                    ]
                                                ),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Reinstalled DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Reinst Category",
                                                        Detail: "Select category A, B, C, or D.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Reinst",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 410 + d.'Pair Order'
                                                    }
                                                )
                                            );

                                            If(
                                                !nfAnswerProvided(d.'Reinst Repair Method'),
                                                Collect(
                                                    colU008MissingItems,
                                                    {
                                                        Section: "Reinstalled DRF",
                                                        FieldLabel: $"Defect {d.'Pair Order'} - Repair Method",
                                                        Detail: "Select or enter the reinstalled repair method.",
                                                        TargetView: "DRF",
                                                        TargetCondition: "Reinst",
                                                        DefectKey: d.RowKey,
                                                        SortOrder: 420 + d.'Pair Order'
                                                    }
                                                )
                                            )
                                        )
                                    );

                                    // ------------------------------------------------------------
                                    // Signatures
                                    // ------------------------------------------------------------
                                    If(
                                        v.'DRF Required' = "Yes"
                                            && IsBlank(v.'Pre Signature'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Pre-Repair DRF",
                                                FieldLabel: "Pre-Repair Signature",
                                                Detail: "Complete the required pre-repair fields, then sign.",
                                                TargetView: "DRF",
                                                TargetCondition: "Pre",
                                                DefectKey: "",
                                                SortOrder: 500
                                            }
                                        )
                                    );

                                    If(
                                        v.'DRF Required' = "Yes"
                                            && nfU008ReinstRequired(_u008RowKey)
                                            && IsBlank(v.'Reinst Signature'),
                                        Collect(
                                            colU008MissingItems,
                                            {
                                                Section: "Reinstalled DRF",
                                                FieldLabel: "Reinstalled Signature",
                                                Detail: "Complete the required reinstalled fields, then sign.",
                                                TargetView: "DRF",
                                                TargetCondition: "Reinst",
                                                DefectKey: "",
                                                SortOrder: 510
                                            }
                                        )
                                    );

                                    UpdateContext(
                                        {
                                            _u008MissingOpen: true
                                        }
                                    )
                                )
                              Text: |-
                                =With(
                                    {missingCount: nfU008ActiveValidation.TotalMissing},
                                    If(
                                    missingCount > 0,
                                    $"Missing ({missingCount})",
                                    "Complete"
                                    )
                                )
                              Tooltip: |-
                                =With(
                                    {missingCount: nfU008ActiveValidation.TotalMissing},
                                    If(
                                    missingCount = 0,
                                    "This valve is complete. Validate & Save Valve stamps the valve and saves the whole form.",
                                    $"{missingCount} required item(s) remain. Select this button to view the missing-item checklist. Defect edits commit with Save defect; typed screening entries commit when you select Done, switch tabs, sign, or validate."
                                    )
                                )
                              Width: =130
