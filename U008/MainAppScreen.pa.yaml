                  Patch(
                      'Impact Feedback Items_1',
                      Defaults('Impact Feedback Items_1'),
                      {
                          Title: cmpFeedback_1.FeedbackRecord.Title,
                          'Submission Type': LookUp(
                              Choices('Impact Feedback Items_1'.'Submission Type'),
                              Text(Value) = cmpFeedback_1.SelectedSubmissionTypeText
