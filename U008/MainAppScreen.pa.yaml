                          'Impact Item Specifics': cmpFeedback_1.ImpactItemSpecifics,
                          'Screen Name': cmpFeedback_1.FeedbackRecord.'Screen Name'
                      }
                  )
              );
              nfSendToast(
                  "Feedback Sumitted Successfully",
                  "Thank you!",
                  3000,
                  "Success"
              )
            OnUpload: |-
              =FeedbackUpload.Run(
                  JSON(
                      {
                          RowGuid: varNewFeedbackRecord.'PK - Impact Feedback Item'
                      }
                  ),
                  {
                      name: cmpFeedback_1.UploadRecord.name,
                      contentBytes: cmpFeedback_1.UploadRecord.contentBytes
                  }
              );
              nfSendToast(
                  "Feedback Uploaded Successfully",
                  "Thank you!",
                  3000,
                  "Success"
              )
