                                                        LookUp(
                                                            colU008Answers,
                                                            RowKey = _u008RowKey
                                                        ),
                                                        {
                                                            'Pre Signature': "",
                                                            'Pre Signature Date': "",
                                                            'Pre Inspector Name': "",
                                                            'Pre Badge Number': "",
                                                            'Validated Date': ""
                                                        }
                                                    ),
                                                    Patch(
                                                        colU008Answers,
                                                        LookUp(
                                                            colU008Answers,
                                                            RowKey = _u008RowKey
                                                        ),
                                                        {
                                                            'Reinst Signature': "",
                                                            'Reinst Signature Date': "",
                                                            'Reinst Inspector Name': "",
                                                            'Reinst Badge Number': "",
                                                            'Validated Date': ""
                                                        }
                                                    )
                                                );
                                                Set(
                                                    varU008Dirty,
                                                    true
                                                );
                                                nfSendToast(
                                                    "Signature removed",
                                                    "The condition is unlocked for editing.",
                                                    4000,
                                                    "Warning"
                                                )
                                            )
                                          PaddingBottom: =5
