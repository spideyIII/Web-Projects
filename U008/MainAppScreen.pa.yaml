            PriorityChoices: =Choices('Priority Choices')
            RelatedRecordID: ="Text"
            ScreenName: =App.ActiveScreen.Name
            ShowFeedback: =true
            SubmissionTypeChoices: =Choices('Impact Feedback Items_1'.'Submission Type')
            Width: =If(cmpFeedback_1.IsOpen, App.Width, 60)
            X: =If(cmpFeedback_1.IsOpen,0, cmpFeedback_1.FeedbackX)
            Y: =If(cmpFeedback_1.IsOpen,0, cmpFeedback_1.FeedbackY)
