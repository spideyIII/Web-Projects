Screens:
  MainAppScreen:
    Properties:
      Fill: =thmU008.AppBg
      LoadingSpinnerColor: =thmU008.Primary
      OnVisible: |-
        =Set(
            visibleTrigger,
            Now()
        );
        Set(
            varSpinner,
            true
        );
        Set(
            varSpinnerText,
            "Loading inspection..."
        );
        LoadU008Form();
        Set(
            varSpinner,
            false
        );
        // Empty worklist -> start in the valve picker (2026-08-26). Skipped when the
        // ship's class loaded no valves at all (the warning toast already explains).
        UpdateContext(
            {
                _u008ModalOpen: false,
                _u008RowKey: "",
                _u008ModalView: "Screening",
                _u008DrfCond: "Pre",
                _ctrU008LeaveConfirm: false,
                _u008PickerOpen: varU008LoadOk && nfU008WorklistCount = 0 && CountRows(
                    Filter(
                        colU008Answers,
                        'Pair Order' = 0
                    )
                ) > 0,
                _u008PickSearch: "",
                _u008PickGroup: "All",
                _u008AddValveOpen: false,
                _u008MissingOpen: false,
                _u008RemarksTarget: "",
                _u008DefKey: "",
                _u008DefNew: false,
                _u008DefTick: 0,
                _u008AttachOpen: false
            }
        ); Set(varU008ActiveValveKey, _u008RowKey); Set(varU008ModalMetricsActive, _u008ModalOpen);
    Children:
      - vctrU008Root:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =thmU008.AppBg
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =8
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - hctrU008TopAction:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Semilight
                  Fill: =thmU008.SurfaceAlt
                  FillPortions: =0
                  Height: =45
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutJustifyContent: =LayoutJustifyContent.End
                  LayoutMinHeight: =45
                Children:
                  - btnU008Back:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Go Back"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        Color: =thmU008.TextBody
                        FontWeight: =""
                        Icon: ="ArrowLeft"
                        OnSelect: |-
                          =If(
                              !varU008Dirty && !nfU008AnyDirty(),
                              Back(),
                              UpdateContext({_ctrU008LeaveConfirm: true})
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =60
                  - lblU008RecordItem:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =thmU008.Heading
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        LayoutMinWidth: =96
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =18
                        Text: =If(varU008LoadFailed, "Load failed - retained answers are read-only. Select Retry load.", nfHeader)
                        Width: =96
                        Wrap: =false
                  - btnU008ThemeToggle:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Toggle light or dark appearance"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        Color: =thmU008.TextBody
                        FontWeight: =""
                        OnSelect: |-
                          =Set(varU008ThemeMode,
                              If(varU008ThemeMode = "Dark", "Light", "Dark"))
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: |-
                          =If(varU008ThemeMode = "Dark", "Appearance: Dark", "Appearance: Light")
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =150
                  - lblBlankToPositionNotificationCenter_1:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Text: =""
                        Width: =75
                  - lblBlankToPositionFeedback:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Text: =""
                        Width: =60
                  - btnU008RetryLoad:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Retry loading this inspection"
                        OnSelect: |-
                          =If((!varU008Dirty && !nfU008AnyDirty()) || Confirm("Retrying the load will replace your retained local answers. Continue?", {Title: "Reload inspection", ConfirmButton: "Reload", CancelButton: "Keep answers"}),
                              UpdateContext({_u008ModalOpen: false, _u008PickerOpen: false, _u008DefKey: "", _u008DefNew: false}); Set(varU008ModalMetricsActive, _u008ModalOpen);
                              Set(varSpinner, true); Set(varSpinnerText, "Loading inspection..."); LoadU008Form())
                        Text: ="Retry load"
                        Visible: =varU008LoadFailed
                        Width: =110
                  - btnU008Info:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Info"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =thmU008.Link
                        FontWeight: =""
                        Icon: ="Info"
                        OnSelect: |-
                          =nfSendToast(
                              "U008 Hull and Backup Valves",
                              "Screen each in-sample valve, complete a Data Report Form where defects require one (two signatures: Pre-Repair and Reinstalled), Validate each valve, then Complete Inspection. Save Draft keeps in-progress work at any time.",
                              6000,
                              "Info"
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Info"
                        VerticalAlign: =VerticalAlign.Middle
            - hctrNotificationStrip:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(IsBlank(varInlineNoticeTitle), Color.Transparent, Switch(varInlineNoticeSeverity, "Error", thmU008.DangerBg, "Warning", thmU008.WarnBg, "Success", thmU008.SuccessBg, thmU008.SurfaceAlt))
                  FillPortions: =0
                  Height: =32
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =6
                  LayoutMaxHeight: =32
                  LayoutMinHeight: =32
                  LayoutMinWidth: =0
                  PaddingLeft: =10
                  PaddingRight: =4
                Children:
                  - lblInlineNotice:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Right
                        AlignInContainer: =AlignInContainer.Center
                        Color: =Switch(varInlineNoticeSeverity, "Error", thmU008.DangerText, "Warning", thmU008.WarnText, "Success", thmU008.SuccessText, thmU008.TextBody)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height
                        LayoutMinWidth: =0
                        Size: =12
                        Text: |-
                          =If(
                              IsBlank(varInlineNoticeTitle),
                              "",
                              varInlineNoticeTitle &
                              If(
                                  !IsBlank(varInlineNoticeBody),
                                  "    " & varInlineNoticeBody,
                                  ""
                              )
                          )
                  - btnInlineNoticeClose:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Dismiss notification title"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =thmU008.TextBody
                        Height: =28
                        Icon: ="Dismiss"
                        OnSelect: =Set(varInlineNoticeTitle, "")
                        Text: =""
                        Visible: =!IsBlank(varInlineNoticeTitle)
                        Width: =28
                  - tmrInlineNotice:
                      Control: Timer@2.1.0
                      Properties:
                        AutoStart: =!IsBlank(varInlineNoticeTitle)
                        Duration: =500
                        Height: =1
                        OnTimerEnd: |-
                          =If(
                              !IsBlank(varInlineNoticeTitle) && Now() >= varInlineNoticeUntil,
                              Set(varInlineNoticeTitle, "")
                          )
                        Repeat: =true
                        Start: =!IsBlank(varInlineNoticeTitle)
                        Visible: =false
                        Width: =1
            - hctrU008ContextBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Semilight
                  Fill: =thmU008.SurfaceAlt
                  FillPortions: =0
                  Height: =48
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =10
                  LayoutMinHeight: =48
                  PaddingLeft: =10
                  PaddingRight: =10
                Children:
                  - lblU008ShipLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =thmU008.TextBody
                        FontWeight: =FontWeight.Semibold
                        LayoutMinWidth: =96
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =14
                        Text: ="Ship:"
                        Visible: =false
                        Width: =45
                  - drpU008ShipName:
                      Control: ModernDropdown@1.0.3
                      Properties:
                        AccessibleLabel: ="Ship selection"
                        AlignInContainer: =AlignInContainer.Center
                        Default: =First([nfShip])
                        DisplayMode: |-
                          =If(nfU008CanEdit && nfU008AllowShipChange,
                              DisplayMode.Edit, DisplayMode.View)
                        ItemDisplayText: =ThisItem.'Ship Name'
                        Items: =Sort('Common Navy Ships', 'Ship Name')
                        OnChange: |-
                          =If(
                              Self.Selected.'Ship Name' <> nfShip.'Ship Name',
                              If(
                                  (!varU008Dirty && !nfU008AnyDirty()) || Confirm(
                                      "Switching ships reloads the form for the other MOD's valve set and discards unsaved answers. Continue?",
                                      {Title: "Change Ship", ConfirmButton: "Switch Ship", CancelButton: "Cancel"}
                                  ),
                                  Set(varSelectedShipName, Self.Selected.'Ship Name');
                                  Set(varSpinner, true); Set(varSpinnerText, "Loading inspection...");
                                  LoadU008Form();
                                  Set(varSpinner, false);
                                  UpdateContext({
                                      _u008PickerOpen: varU008LoadOk && nfU008WorklistCount = 0
                                          && CountRows(Filter(colU008Answers, 'Pair Order' = 0)) > 0,
                                      _u008PickSearch: "",
                                      _u008PickGroup: "All",
                                      _u008AddValveOpen: false}),
                                  Reset(Self)
                              )
                          )
                        Size: =0
                        Visible: =false
                        Width: =150
                  - lblU008ModBadge:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =thmU008.ChipText
                        Fill: =thmU008.ChipFill
                        FontWeight: =FontWeight.Bold
                        Height: =28
                        LayoutMinWidth: =96
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =14
                        Text: |-
                          =$"MOD: {nfModNumber} {varU008DopInspection}"
                        Visible: =false
                        Width: =95
                  - lblU008ActivityLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        Color: =thmU008.TextBody
                        FontWeight: =FontWeight.Semibold
                        LayoutMinWidth: =96
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =14
                        Text: ="Inspecting Activity:"
                        Width: =125
                  - txtU008InspectingActivity:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        AccessibleLabel: ="Inspecting Activity"
                        AlignInContainer: =AlignInContainer.Center
                        Default: =varU008InspectingActivity
                        DisplayMode: =If(nfU008CanEdit, DisplayMode.Edit, DisplayMode.View)
                        FontWeight: =""
                        MaxLength: =-1
                        OnChange: =Set(varU008Dirty, true); Set(varU008InspectingActivity, Self.Text)
                        Placeholder: ="e.g. Portsmouth Naval Shipyard"
                        Size: =0
                        TriggerOutput: =TriggerOutput.Delayed
                        Width: =240
                  - lblU008Stats:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Right
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =thmU008.TextBody
                        FillPortions: =1.5
                        LayoutMinWidth: =330
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =12
                        Text: |-
                          =If(_u008ModalOpen,
                              "Editing valve...",
                              If(
                              nfU008InScopeCount = 0,
                              "No valves loaded - this ship's class is not covered by URO MRC 008",
                              $"Valves complete: {nfU008CompleteCount} of {nfU008InScopeCount} | Decisions open: {nfU008PendingDecisionCount} | {If(IsBlank(varU008InspectingActivity), "Activity: Missing", "Activity: OK")} | {If(varU008Dirty, "Unsaved changes", "Saved")}"
                              )
                          )
                        Width: =96
                  - btnU008Decisions:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Review pending applicability decisions"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        DisplayMode: =If(nfU008CanEdit, DisplayMode.Edit, DisplayMode.Disabled)
                        FontWeight: =""
                        OnSelect: =OpenU008NextScenario()
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: =$"Decisions ({CountRows(Filter(colU008Answers, 'Pair Order' = 0, 'In Worklist' = "Yes", 'Applicability State' = "Pending"))})"
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =CountRows(Filter(colU008Answers, 'Pair Order' = 0, 'In Worklist' = "Yes", 'Applicability State' = "Pending")) > 0
                        Width: =130
                  - lblU008SaveDraftUnsaved:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Color: =thmU008.WarnText
                        Fill: =thmU008.WarnBg
                        FontWeight: =FontWeight.Semibold
                        LayoutMinWidth: =145
                        PaddingBottom: =0
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =0
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =11
                        Text: |-
                          =With(
                              {
                                  unsavedValveCount: If(_u008ModalOpen, 0, nfU008DirtyValveCount)
                              },
                              If(
                                  unsavedValveCount = 1,
                                  "●  1 unsaved valve",
                                  unsavedValveCount > 1,
                                  $"●  {unsavedValveCount} unsaved valves",
                                  "●  Unsaved changes"
                              )
                          )
                        Visible: =varU008Dirty || If(_u008ModalOpen, false, nfU008AnyDirty())
                        Width: =120
                  - btnU008SaveDraft:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: |-
                          =If(
                              varU008Dirty || If(_u008ModalOpen, false, nfU008AnyDirty()),
                              "Save unsaved draft changes",
                              "Save Draft"
                          )
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: |-
                          =If(
                              varU008Dirty || If(_u008ModalOpen, false, nfU008AnyDirty()),
                              ButtonAppearance.Primary,
                              ButtonAppearance.Secondary
                          )
                        DisplayMode: =If(nfU008CanEdit, DisplayMode.Edit, DisplayMode.Disabled)
                        FontWeight: =FontWeight.Semibold
                        Height: =30
                        Icon: ="Save"
                        IconStyle: =IconStyle.Filled
                        OnSelect: |-
                          =If(
                              SaveU008WithMessage("Saving draft"),
                              nfSendToast(
                                  "Draft saved",
                                  "Your changes were saved.",
                                  3000,
                                  "Success"
                              ),
                              nfSendToast(
                                  "Save failed",
                                  "Your entries were kept. Check the validation notice and correct any invalid measurements before retrying.",
                                  5000,
                                  "Error"
                              )
                          )
                        PaddingBottom: =5
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =5
                        RadiusBottomLeft: =3
                        RadiusBottomRight: =3
                        RadiusTopLeft: =3
                        RadiusTopRight: =3
                        Text: ="Save Draft"
                        Tooltip: |-
                          =With(
                              {
                                  unsavedValveCount: If(_u008ModalOpen, 0, nfU008DirtyValveCount)
                              },
                              If(
                                  !(varU008Dirty || If(_u008ModalOpen, false, nfU008AnyDirty())),
                                  "No unsaved changes are currently detected.",
                                  unsavedValveCount = 1,
                                  "Save the 1 valve with unsaved changes.",
                                  unsavedValveCount > 1,
                                  $"Save the {unsavedValveCount} valves with unsaved changes.",
                                  "Save unsaved inspection-level changes."
                              )
                          )
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =120
            - hctrU008FinalActions:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =42
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =42
                  PaddingLeft: =20
                  PaddingRight: =20
                Children:
                  - lblU008FinalStatus:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =If(varU008Attested, Align.Right, Align.Left)
                        AlignInContainer: =AlignInContainer.Center
                        FillPortions: =1
                        Height: =36
                        Size: =12
                        Text: |-
                          =If(varU008Attested, $"Signed by {varU008AttestedBy} · {nfU008DateText(varU008AttestationDate)}",
                              _u008ModalOpen, "Finish editing this valve before completing the inspection.",
                              varU008LoadFailed, "Reload the inspection before completing it.",
                              IsBlank(Trim(Coalesce(varU008InspectingActivity, ""))), "Inspecting Activity is required before final submission.",
                              nfU008InScopeCount = 0, "Add applicable valves to the worklist before final submission.",
                              nfU008PendingDecisionCount > 0, $"Resolve {nfU008PendingDecisionCount} pending worklist decision(s).",
                              nfU008UnvalidatedScopeCount > 0, $"Complete and validate {nfU008UnvalidatedScopeCount} remaining in-scope valve(s).",
                              !nfU008FormComplete, "Complete the remaining valve requirements before final submission.",
                              "Ready for final review and attestation.")
                  - btnU008ReopenInspection:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Reopen the completed inspection and remove its final attestation"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Secondary
                        DisplayMode: =If(varU008ReopenStatusAllowed && !varU008LoadFailed && !varSpinner && !_u008ModalOpen, DisplayMode.Edit, DisplayMode.Disabled)
                        Height: =34
                        OnSelect: |-
                          =If(varU008Attested && !varSpinner && !varU008LoadFailed && !_u008ModalOpen,
                              If(Confirm("Reopen this inspection? This immediately changes the saved status to In Progress and removes the final attestation. Valve answers and individual signatures will be kept. You must attest and submit again after corrections.",
                                  {Title: "Reopen inspection", ConfirmButton: "Reopen inspection", CancelButton: "Keep completed"}),
                                  If(ReopenU008Inspection(), UpdateContext({_u008SubmitConfirm: false}))))
                        Text: ="Reopen Inspection"
                        Visible: =varU008Attested
                        Width: =190
                  - btnU008CompleteInspection:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Review the final inspection attestation"
                        AlignInContainer: =AlignInContainer.Center
                        DisplayMode: =If(nfU008CanEdit && !_u008ModalOpen, DisplayMode.Edit, DisplayMode.Disabled)
                        Height: =34
                        OnSelect: |-
                          =If(nfU008CanEdit && !_u008ModalOpen,
                              With({activityText: Trim(Coalesce(txtU008InspectingActivity.Text, "")),
                                    scopeCount: nfU008InScopeCount,
                                    pendingCount: nfU008PendingDecisionCount,
                                    completeCount: nfU008CompleteCount,
                                    unvalidatedCount: nfU008UnvalidatedScopeCount},
                                  If(Coalesce(varU008InspectingActivity, "") <> activityText,
                                      Set(varU008InspectingActivity, activityText);
                                      Set(varU008Dirty, true));
                                  If(!IsBlank(activityText) && scopeCount > 0 && pendingCount = 0
                                          && completeCount = scopeCount && unvalidatedCount = 0,
                                      UpdateContext({_u008SubmitConfirm: true}),
                                      nfSendToast("Inspection not ready",
                                          Trim(
                                              If(IsBlank(activityText), "Enter Inspecting Activity. ", "") &
                                              If(scopeCount = 0, "Add applicable valves to the worklist. ", "") &
                                              If(pendingCount > 0, $"Resolve {pendingCount} pending worklist decision(s). ", "") &
                                              If(completeCount < scopeCount, $"{scopeCount - completeCount} in-scope valve(s) still have incomplete requirements. ", "") &
                                              If(unvalidatedCount > 0, $"{unvalidatedCount} in-scope valve(s) still need Validate & Save Valve. ", "")
                                          ), 9000, "Warning"))))
                        Text: ="Final Inspection Attestation"
                        Visible: =!varU008Attested
                        Width: =250
            - hctrU008Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =15
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =2
                Children:
                  - ctrU008Valves:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =thmU008.Surface
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        PaddingBottom: =8
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - lblU008ValvesTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =thmU008.Heading
                              FontWeight: =FontWeight.Bold
                              Height: =34
                              LayoutMinHeight: =34
                              PaddingTop: =6
                              Size: =14
                              Text: |-
                                =Switch(
                                    nfModNumber,
                                    40, "URO MRC 008 - HULL AND BACKUP VALVES - SSN688 CLASS (M40)",
                                    60, "URO MRC 008 - HULL AND BACKUP VALVES - SSBN/SSGN726 CLASS (M60)",
                                    70, "URO MRC 008 - HULL AND BACKUP VALVES - SSN774 CLASS (M70)",
                                    80, "URO MRC 008 - HULL AND BACKUP VALVES - SSN21 CLASS (M80)",
                                    "URO MRC 008 - HULL AND BACKUP VALVES"
                                )
                              Underline: =true
                        - hctrU008FilterBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =44
                              PaddingLeft: =4
                              PaddingRight: =4
                            Children:
                              - btnU008AddValves:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    AccessibleLabel: ="Open the valve picker to add applicable valves to the worklist"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    BasePaletteColor: =thmU008.Primary
                                    Height: =34
                                    OnSelect: |-
                                      =Set(varU008SysFilter, "All");
                                      UpdateContext({
                                          _u008PickerOpen: true,
                                          _u008PickSearch: "",
                                          _u008PickGroup: "All",
                                          _u008AddValveOpen: false
                                      })
                                    Size: =12
                                    Text: |-
                                      =$"Add Valves ({CountRows(
                                          Filter(
                                              colU008Answers,
                                              'Pair Order' = 0,
                                              'Applicability State' = "Applicable",
