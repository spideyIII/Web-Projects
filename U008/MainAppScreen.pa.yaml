                                                ),
                                                Patch(
                                                    colU008Answers,
                                                    LookUp(colU008Answers, RowKey = _u008RowKey),
                                                    {'Validated Date': ""}
                                                );
                                                nfSendToast(
                                                    "Save failed",
                                                    "Not saved - the valve stays open. Fix the error and try again.",
                                                    5000,
                                                    "Error"
                                                )
                                            )
                                        )
                                    )
                                )
