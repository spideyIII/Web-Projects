          Properties:
            Height: =App.Height
            NewBlurBorder: =0
            NewBorderRadius: =0
            NewBoxShadowBlur: =0
            NewBoxShadowHorizontalOffset: =0
            NewBoxShadowRadius: =0
            NewBoxShadowVerticalOffset: =0
            NewFilterBlur: =3
