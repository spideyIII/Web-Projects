Screens:
  MainAppScreen:
    Properties:
      Fill: =thmU035.AppBg
      LoadingSpinnerColor: =thmU035.Primary
      OnVisible: |-
        =Set(
              visibleTrigger,
              Now()
          );
          Set(
              _spinner,
              true
          );
          Set(
              _spinnertext,
              "Loading..."
          );
          UpdateContext(
              {
                  _pickerOpen: false,
                  _drfRowModalOpen: false,
                  _drfChildKey: "",
                  _drfChildNew: false,
                  _pickSearch: "",
                  _pickGroup: "All",
                  _addItemOpen: false,
                  _rowModalOpen: false,
                  _rowView: "Screening",
                  _remarksTarget: "",
                  _childDefKey: "",
                  _childDefNew: false,
                  _childDefTick: 0,
                  _attachOpen: false,
                  _drfModalOpen: false,
                  _refPopupOpen: false,
                  _refPopupView: "Notes",
                  _refImageIndex: 1,
                  _drfRowKey: "",
                  _rowKey: "",
                  _subKey: "",
                  _refEglParent: "",
                  _refImageKey: "",
                  _refSearch: "",
                  _drfShowAll: false
              }
          );
          Collect(
              colParentResults,
              {
                  InspectionResultId: Blank(),
                  ImpactRequirementId: Blank(),
                  UROImpactItemId: Blank(),
                  OrderNumber: "",
                  DRFInspection: "",
                  Guidelines: "",
                  DRFType: "",
                  DOI: Blank(),
                  AsFoundCAT: "",
                  AdditionalDate: Blank(),
                  AdditionalName: "",
                  AdditionalSignature: false,
                  Signature: "",
                  VisualDefects: "",
                  DRFRequired: "",
                  FinalCAT: "",
                  ReferenceNotes: "",
                  Remarks: "",
                  IsDirty: false
              }
          );
          Clear(colParentResults);
          LoadU035Results();
          Set(
              _spinner,
              false
          );
          UpdateContext({_pickerOpen: CountRows(colParentResults) = 0});
    Children:
      - vctrRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =thmU035.AppBg
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - hctrTopAction:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmU035.Surface
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =60
                  PaddingBottom: =4
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =4
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - btnBack:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Back"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Subtle
                        Color: =thmU035.TextMuted
                        FontWeight: =""
                        Height: =36
                        Icon: ="ArrowLeft"
                        Layout: =ButtonLayout.IconOnly
                        OnSelect: |-
                          =If(
                              HasDirtyChanges,
                              Set(varConfirmType, "leave");
                              Set(varConfirmMessage, "You have unsaved changes. Leave this page?");
                              Set(varShowConfirmPopup, true),
                              Back()
                          )
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: =""
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =40
                  - lblHeader:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =thmU035.Heading
                        FillPortions: =1
                        FontWeight: =FontWeight.Bold
                        LayoutMinWidth: =1
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Size: =18
                        Text: =nfHeader
                        Width: =140
                  - lblNotificationAnchor:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        Text: =""
                        Width: =75
                  - lblFeedbackAnchor:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: =""
                        Width: =60
                  - btnThemeToggle:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Toggle light or dark appearance"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =thmU035.TextBody
                        FontWeight: =""
                        Height: =36
                        OnSelect: |-
                          =Set(
                              varU035ThemeMode,
                              If(varU035ThemeMode = "Dark", "Light", "Dark")
                          )
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: |-
                          =If(
                              varU035ThemeMode = "Dark",
                              "Appearance: Light",
                              "Appearance: Dark"
                          )
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =150
                  - btnInfo:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Information"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =thmU035.Link
                        FontWeight: =""
                        Height: =36
                        Icon: ="Info"
                        OnSelect: |-
                          =nfSendToast(
                              "Info",
                              "Select EGL tasks to build the worklist, then open each row to answer screening and DRF questions.",
                              4000,
                              "Info"
                          )
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Info"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =65
                  - btnNotes:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Open notes"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =thmU035.Link
                        FontWeight: =""
                        Height: =36
                        Icon: ="Info"
                        OnSelect: |-
                          =UpdateContext({
                              _refPopupOpen: true,
                              _refPopupView: "EGL",
                              _refImageIndex: 1,
                              _refEglParent: "",
                              _refSearch: ""
                          })
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="GN/EGL/Images"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =150
            - hctrU035NotificationStrip:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(IsBlank(varInlineNoticeTitle), Color.Transparent, Switch(varInlineNoticeSeverity, "Error", thmU035.Danger, "Warning", thmU035.WarnBg, "Success", thmU035.SuccessBg, thmU035.SurfaceAlt))
                  FillPortions: =0
                  Height: =32
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =6
                  LayoutMaxHeight: =32
                  LayoutMinHeight: =32
                  LayoutMinWidth: =0
                  PaddingLeft: =10
                  PaddingRight: =4
                Children:
                  - lblU035InlineNotice:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Right
                        AlignInContainer: =AlignInContainer.Center
                        Color: =Switch(varLastSeverity, "Error", thmU035.TextInverse, "Warning", thmU035.WarnText, "Success", thmU035.SuccessText, thmU035.TextBody)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =28
                        LayoutMinWidth: =0
                        Size: =12
                        Text: |-
                          =If(
                              IsBlank(varInlineNoticeTitle),
                              "",
                              varInlineNoticeTitle &
                              If(
                                  !IsBlank(varInlineNoticeBody),
                                  "    " & varInlineNoticeBody,
                                  ""
                              )
                          )
                  - btnU035InlineNoticeClose:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Dismiss notification title"
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: =ButtonAppearance.Transparent
                        Color: =thmU035.TextBody
                        Height: =28
                        Icon: ="Dismiss"
                        OnSelect: =Set(varInlineNoticeTitle, "")
                        Text: =""
                        Visible: =!IsBlank(varInlineNoticeTitle)
                        Width: =28
                  - tmrU035InlineNotice:
                      Control: Timer@2.1.0
                      Properties:
                        AutoStart: =true
                        Duration: =250
                        Height: =1
                        OnTimerEnd: |-
                          =If(
                              !IsBlank(varInlineNoticeTitle) && Now() >= varInlineNoticeUntil,
                              Set(varInlineNoticeTitle, "")
                          )
                        Repeat: =true
                        Visible: =false
                        Width: =1
            - hctrContextBar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =thmU035.SurfaceAlt
                  FillPortions: =0
                  Height: =55
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutMinHeight: =52
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  RadiusBottomLeft: =6
                  RadiusBottomRight: =6
                  RadiusTopLeft: =6
                  RadiusTopRight: =6
                Children:
                  - lblModBadge:
                      Control: ModernText@1.0.0
                      Properties:
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        Color: =thmU035.ChipText
                        Fill: =thmU035.ChipFill
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        LayoutMinWidth: =96
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =14
                        Text: ="MOD " & Text(nfModNumber)
                        Width: =90
                  - lblActivityLabel:
                      Control: ModernText@1.0.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        AutoHeight: =true
                        Color: =thmU035.TextMuted
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =20
                        LayoutMinWidth: =120
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Text: ="Worklist Rows " & Text(CountRows(colParentResults))
                        Width: =160
                  - btnSelectItems:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Open the item worklist picker"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =thmU035.Primary
                        DisplayMode: |-
                          =If(
                              nfInWorkingStatus && !nfU035AllRowsSigned(),
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        FontWeight: =""
                        Height: =36
                        Icon: ="Add"
                        OnSelect: |-
                          =UpdateContext({
                              _pickerOpen: true,
                              _pickSearch: "",
                              _pickGroup: "All",
                              _addItemOpen: false
                          });
                          Set(varU035Search, "")
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Select EGL Tasks"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =155
                  - btnSave:
                      Control: ModernButton@1.0.0
                      Properties:
                        AccessibleLabel: ="Save"
                        Align: =Align.Center
                        AlignInContainer: =AlignInContainer.Center
                        BasePaletteColor: =thmU035.Primary
                        DisplayMode: |-
                          =If(
                              nfInWorkingStatus && !nfU035AllRowsSigned(),
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        FontWeight: =""
                        Height: =36
                        Icon: ="Save"
                        OnSelect: |-
                          = If(
                              HasDirtyChanges,
                              If(
                                  SaveAndRepopulateU035(),
                                  nfSendToast(
                                      "Draft saved",
                                      "Inspection data saved successfully.",
                                      3000,
                                      "Success"
                                  ),
                                  nfSendToast(
                                      "Save failed",
                                      "Save did not complete successfully.",
                                      5000,
                                      "Error"
                                  )
                              ),
                              nfSendToast(
                                  "No change",
                                  "Nothing to save.",
                                  3000,
                                  "Warning"
                              )
                          )
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: ="Save"
                        VerticalAlign: =VerticalAlign.Middle
                        Width: =80
            - vctrWorklistBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =thmU035.Surface
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  PaddingBottom: =12
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =12
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - hctrListHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Start
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =34
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =34
                        LayoutWrap: =true
                      Children:
                        - lblListTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Color: =thmU035.Heading
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              Size: =16
                              Text: ="Inspection Worklist"
                  - vctrEmptyState:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =thmU035.SurfaceAlt
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =6
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =CountRows(colParentResults) = 0
                        X: =40
                        Y: =40
                      Children:
                        - lblEmptyTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =thmU035.Heading
                              FontWeight: =FontWeight.Bold
                              Height: =40
                              Size: =18
                              Text: ="No inspection worklist rows"
                              Width: =300
                        - lblEmptyBody:
                            Control: ModernText@1.0.0
                            Properties:
                              Align: =Align.Center
                              Color: =thmU035.TextMuted
                              Size: =13
                              Text: ="Select one or more EGL tasks to generate the inspection worklist."
                              Width: =420
                        - btnEmptySelect:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Open the item worklist picker"
                              Align: =Align.Center
                              BasePaletteColor: =thmU035.Primary
                              DisplayMode: |-
                                =If(
                                    nfInWorkingStatus && !nfU035AllRowsSigned(),
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              FontWeight: =""
                              Height: =36
                              Icon: ="Add"
                              OnSelect: |-
                                =UpdateContext({
                                    _pickerOpen: true,
                                    _pickSearch: "",
                                    _pickGroup: "All",
                                    _addItemOpen: false
                                });
                                Set(varU035Search, "")
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: ="Select EGL Tasks"
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =175
                  - galResults:
                      Control: Gallery@2.15.0
                      Variant: VariableHeight
                      Properties:
                        AccessibleLabel: ="Selected inspection worklist"
                        BorderColor: =thmU035.Border
                        Items: =SortByColumns(colParentResults, "OrderNumber", SortOrder.Ascending)
                        LayoutMinHeight: =1
                        LayoutMinWidth: =1
                        TabIndex: =0
                        TemplateSize: =86
                        Transition: =Transition.Pop
                        Visible: =CountRows(colParentResults) > 0
                        Width: =Parent.Width
                      Children:
                        - ctrListRow:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.Semilight
                              Fill: =thmU035.SurfaceAlt
                              Height: =76
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              PaddingBottom: =6
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =6
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Width: =Parent.TemplateWidth - 10
                            Children:
                              - vctrRowText:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    FillPortions: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =2
                                    LayoutMinHeight: =1
                                    LayoutMinWidth: =1
                                  Children:
                                    - lblRowTitle:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =thmU035.Heading
                                          FillPortions: =1
                                          FontWeight: =FontWeight.Bold
                                          LayoutMinHeight: =1
                                          LayoutMinWidth: =1
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =16
                                          Text: =Coalesce(ThisItem.DRFInspection, ThisItem.OrderNumber, "EGL task")
                                    - lblRowMeta:
                                        Control: ModernText@1.0.0
                                        Properties:
                                          AlignInContainer: =AlignInContainer.Stretch
                                          Color: =thmU035.TextMuted
                                          FillPortions: =1
                                          LayoutMinHeight: =1
                                          LayoutMinWidth: =1
                                          Text: =Coalesce(ThisItem.OrderNumber, "-") & "  ·  " & nfU035SubDoneCount(ThisItem.OrderNumber) & " of " & CountRows(nfU035EglSubtasks(ThisItem.OrderNumber)) & " subtasks complete"
                              - lblRowStatusPill:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Align: =Align.Center
                                    Color: =Switch(nfU035ParentStatus(ThisItem.OrderNumber), "Signed", thmU035.SuccessText, "Complete", thmU035.ChipText, "In Progress", thmU035.WarnText, thmU035.TextMuted)
                                    Fill: =Switch(nfU035ParentStatus(ThisItem.OrderNumber), "Signed", thmU035.SuccessBg, "Complete", thmU035.InfoBg, "In Progress", thmU035.WarnBg, thmU035.SurfaceSubtle)
                                    FontWeight: =FontWeight.Bold
                                    Height: =30
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =0
                                    RadiusBottomLeft: =15
                                    RadiusBottomRight: =15
                                    RadiusTopLeft: =15
                                    RadiusTopRight: =15
                                    Text: =nfU035ParentStatus(ThisItem.OrderNumber)
                                    Width: =140
                        - btnRowOpen:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Open task subtasks"
                              Align: =Align.Center
                              Appearance: =ButtonAppearance.Transparent
                              Color: =Color.Transparent
                              FontWeight: =""
                              Height: =74
                              OnSelect: |-
                                =With({first: First(nfU035EglSubtasks(ThisItem.OrderNumber)).ItemCode}, EnsureU035Sub(ThisItem.OrderNumber, first); UpdateContext({_rowKey: ThisItem.OrderNumber, _subKey: first, _rowModalOpen: true, _drfModalOpen: false, _drfChildKey: ""}))
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
                              RadiusTopLeft: =6
                              RadiusTopRight: =6
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =Parent.TemplateWidth - 10
      - ctrWorklistPicker:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =thmU035.Overlay
            Height: =Parent.Height
            Visible: =_pickerOpen
            Width: =Parent.Width
          Children:
            - vctrWorklistPickerCard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderColor: =thmU035.Border
                  BorderThickness: =1
                  DropShadow: =DropShadow.ExtraBold
                  Fill: =thmU035.Surface
                  Height: =620
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Width: =Parent.Width - 500
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =40
                Children:
                  - hctrWorklistPickerHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutMinHeight: =40
                      Children:
                        - lblWorklistPickerTitle:
                            Control: ModernText@1.0.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =thmU035.Heading
                              FillPortions: =1
                              FontWeight: =FontWeight.Bold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: ="Select EGL Tasks"
                        - btnWorklistPickerClose:
                            Control: ModernButton@1.0.0
                            Properties:
                              AccessibleLabel: ="Close the EGL picker"
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =ButtonAppearance.Subtle
                              Color: =thmU035.TextMuted
                              FontWeight: =""
                              Height: =36
                              Icon: ="Dismiss"
                              Layout: =ButtonLayout.IconOnly
                              OnSelect: |-
                                =UpdateContext({
                                    _pickerOpen: false,
                                    _pickSearch: "",
                                    _pickGroup: "All",
                                    _addItemOpen: false
                                })
                              PaddingBottom: =5
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =5
                              RadiusBottomLeft: =4
                              RadiusBottomRight: =4
                              RadiusTopLeft: =4
                              RadiusTopRight: =4
                              Text: =""
                              VerticalAlign: =VerticalAlign.Middle
                              Width: =40
                  - lblWorklistPickerSubtitle:
                      Control: ModernText@1.0.0
                      Properties:
                        Color: =thmU035.TextMuted
                        Height: =20
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =12
                        Text: |-
                          =CountRows(colParentResults) & " selected / " &
                          CountRows(
                              Filter(
                                  nfU035SelectableEglParents,
                                  IsBlank(LookUp(colParentResults, OrderNumber = ParentCode))
                              )
                          ) & " left"
                  - hctrWorklistPickerFilters:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =42
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =42
                      Children:
                        - txtWorklistPickSearch:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              AccessibleLabel: ="Search EGL tasks to add"
                              AlignInContainer: =AlignInContainer.Center
                              Appearance: =Appearance.Outline
